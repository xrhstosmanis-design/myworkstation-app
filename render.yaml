services:
  - type: web
    name: myworkstation-app
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build:production
    startCommand: npm run prisma:push -w server && node server/scripts/ensure-pos-return-compat.js && node server/scripts/ensure-netlink-reports-compat.js && node server/scripts/patch-pos-return-diagnostics.js && node server/scripts/patch-pos-return-audit.js && node server/scripts/enforce-kiosk-modifier-only-milk-ice.js && npm run seed && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: myworkstation-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        value: admin@myworkstationapp.gr
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_INVOICE_MODEL
        value: gpt-5
      - key: KAT_OWNER_NAME
        value: Νίκη Ραζάτου
      - key: KAT_OWNER_EMAIL
        value: nikirazatou@hotmail.gr
      - key: BACKUP_MONITOR_SECRET
        sync: false
  - type: cron
    name: myworkstation-db-backup
    runtime: docker
    region: oregon
    plan: standard
    schedule: "0 */3 * * *"
    dockerfilePath: ./ops/backup/Dockerfile
    dockerContext: ./ops/backup
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: myworkstation-db
          property: connectionString
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_MONITOR_URL
        value: https://myworkstation-app.onrender.com/api/system/backup-monitor
      - key: BACKUP_MONITOR_SECRET
        sync: false

databases:
  - name: myworkstation-db
    region: oregon
    plan: basic-256mb
    databaseName: myworkstation
    user: myworkstation
