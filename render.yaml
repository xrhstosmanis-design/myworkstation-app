services:
  - type: web
    name: myworkstation-app
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run prisma:push -w server && npm run seed && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: myworkstation-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        value: admin@myworkstationapp.gr
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: KAT_OWNER_NAME
        value: Νίκη Ραζάτου
      - key: KAT_OWNER_EMAIL
        value: nikirazatou@hotmail.gr

databases:
  - name: myworkstation-db
    region: frankfurt
    plan: free
    databaseName: myworkstation
    user: myworkstation
