services:
  - type: web
    name: myworkstation-app
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run prisma:push -w server && node server/scripts/ensure-pos-return-compat.js && node server/scripts/patch-pos-return-diagnostics.js && node server/scripts/patch-pos-return-audit.js && npm run seed && node server/scripts/repair-kat-milk-modifier-consumption.js && node server/scripts/cleanup-preparation-stock-triggers.js && node server/scripts/patch-preparation-resolver-source.js && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: myworkstation-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        value: admin@myworkstationapp.gr
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_INVOICE_MODEL
        value: gpt-5
      - key: KAT_OWNER_NAME
        value: Νίκη Ραζάτου
      - key: KAT_OWNER_EMAIL
        value: nikirazatou@hotmail.gr

databases:
  - name: myworkstation-db
    region: frankfurt
    plan: free
    databaseName: myworkstation
    user: myworkstation
