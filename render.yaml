services:
  - type: web
    name: myworkstation-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run prisma:migrate -w server
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: myworkstation-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: myworkstation-db
    plan: free
