name: MWChat
options:
  bundleIdPrefix: gr.myworkstation.chat.ios
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
packages:
  MWSChatCore:
    path: .
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 13.1.0
targets:
  MWChat:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
    dependencies:
      - package: MWSChatCore
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gr.myworkstation.chat.ios.preview
        PRODUCT_NAME: MWChat
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: MWChat.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MW Chat · Preview
        NSCameraUsageDescription: Λήψη φωτογραφίας ή βίντεο μόνο για το πρόχειρο της συνομιλίας.
        NSMicrophoneUsageDescription: Ρητή εγγραφή φωνητικού ή ήχου βίντεο της συνομιλίας.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [remote-notification]
        FirebaseAppDelegateProxyEnabled: false
        FirebaseMessagingAutoInitEnabled: false
        FirebaseDataCollectionDefaultEnabled: false
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  MWChatTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: MWChat
  MWChatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MWChat
schemes:
  MWChat:
    build:
      targets:
        MWChat: all
    test:
      targets: [MWChatTests, MWChatUITests]
      gatherCoverageData: true
      environmentVariables:
        MWS_IOS_SYNTHETIC_TESTS: '1'
