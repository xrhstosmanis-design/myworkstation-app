name: Claude handoff (DRAFT — do not install)
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Explicit approved task ID"
        required: true
        type: choice
        options:
          - INVOICE-OWNER-FINALIZATION-01
          - AUTO-REPORT-OBSERVABILITY-01
          - OCR-CONFIDENCE-01
          - AI-WALLET-HISTORY-02
permissions:
  contents: read
concurrency:
  group: claude-handoff-${{ inputs.task }}
  cancel-in-progress: false
jobs:
  review-gate:
    if: ${{ false }} # Disabled even if this draft is mistakenly installed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explicitly disabled
        run: echo "DRAFT ONLY; no Claude call; no repository writes"
