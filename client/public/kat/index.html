<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Κυλικείο ΚΑΤ - Online Παραγγελίες</title></head><body><script>(async()=>{const r=await fetch('./app.html',{cache:'no-store'});let h=await r.text();
h=h.replace('</head>','<style>.base,.pricing-note{display:none!important}.line-comment{width:100%;min-height:74px;margin-top:12px;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit;resize:vertical}.cart-comment{display:block;margin-top:4px;color:var(--wine)!important;font-style:italic}</style></head>');
h=h.replace("selectedModifiers=[];","selectedModifiers=[],lineComment='';");
h=h.replace("configuring=p;selectedModifiers=[];modifierTitle.textContent=p.name;","configuring=p;selectedModifiers=[];lineComment='';modifierTitle.textContent=p.name;");
h=h.replace('<div id="modifierPrice" class="modifier-price"></div>','<div id="modifierPrice" class="modifier-price"></div><textarea id="lineComment" class="line-comment" maxlength="180" placeholder="Σχόλιο για αυτό το προϊόν, π.χ. 1 παγάκι, πολύ ελαφρύς, λίγο γάλα"></textarea>');
h=h.replace("function toggleModifier(groupId,modifierId){const group=modifierGroups.find(g=>g.id===groupId);if(!group)return;selectedModifiers=selectedModifiers.filter(id=>!group.items.some(m=>m.id===id));selectedModifiers.push(modifierId);renderModifierDialog()}","function toggleModifier(groupId,modifierId){const group=modifierGroups.find(g=>g.id===groupId);if(!group)return;const multi=/EXTRA|ΕΞΤΡΑ/.test(String(group.description||'').toLocaleUpperCase('el-GR'));if(multi){selectedModifiers=selectedModifiers.includes(modifierId)?selectedModifiers.filter(id=>id!==modifierId):[...selectedModifiers,modifierId]}else{selectedModifiers=selectedModifiers.filter(id=>!group.items.some(m=>m.id===id));selectedModifiers.push(modifierId)}renderModifierDialog();const el=document.getElementById('lineComment');if(el)el.value=lineComment}");
h=h.replace("function addLine(product,modifierIds){const key=product.id+'|'+[...modifierIds].sort().join(',');const found=cart.find(x=>x.key===key);if(found)found.quantity++;else cart.push({key,productId:product.id,name:product.name,basePrice:product.onlinePrice,modifierIds:[...modifierIds],quantity:1});modifierDialog.close();renderCart()}","function addLine(product,modifierIds,comment=''){comment=String(comment||'').trim();const key=product.id+'|'+[...modifierIds].sort().join(',')+'|'+comment;const found=cart.find(x=>x.key===key);if(found)found.quantity++;else cart.push({key,productId:product.id,name:product.name,basePrice:product.onlinePrice,modifierIds:[...modifierIds],comment,quantity:1});modifierDialog.close();renderCart()}");
h=h.replace("addConfigured.onclick=()=>configuring&&addLine(configuring,selectedModifiers);","addConfigured.onclick=()=>{const el=document.getElementById('lineComment');lineComment=el?.value||'';if(configuring)addLine(configuring,selectedModifiers,lineComment)};");
h=h.replace("<small>${euro(lineUnit(r))}</small></div>","${r.comment?`<small class=\"cart-comment\">Σχόλιο: ${r.comment}</small>`:''}<br><small>${euro(lineUnit(r))}</small></div>");
h=h.replace("deliveryNotes:notes.value.trim()||null","deliveryNotes:[notes.value.trim(),...cart.filter(r=>r.comment).map(r=>`${r.name}: ${r.comment}`)].filter(Boolean).join(' | ')||null");
document.open();document.write(h);document.close()})().catch(()=>{document.body.innerHTML='<p style="font-family:Arial;padding:30px">Προσωρινό σφάλμα φόρτωσης. Κάντε ανανέωση.</p>'})</script></body></html>
