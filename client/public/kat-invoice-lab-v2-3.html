<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAT Invoice Lab V2.3</title></head><body><div id="boot" style="font:700 18px system-ui;padding:24px">Φόρτωση KAT Invoice Lab V2.3…</div><script>
(async()=>{try{let h=await (await fetch('/kat-invoice-lab-v2.html?base=v22',{cache:'no-store'})).text();
h=h.replaceAll('V2.2','V2.3').replace('SUPPLIER CODE + DISCOUNT PRIORITY','SUPPLIER CODE RECOVERY + DISCOUNT AMOUNT VALIDATION');
// V2.3: raw supplier code always wins; accept 5-14 digit supplier item codes.
h=h.replace(/function deriveCode\(line\)\{[\s\S]*?\}\nfunction rawColumns/,`function deriveCode(line){const raw=String(line?.rawText||'').trim();const m=raw.match(/^\\s*(\\d{5,14})\\b/);if(m)return m[1];const existing=String(line?.code||'').trim();return /^\\d{5,14}$/.test(existing)?existing:''}\nfunction rawColumns`);
// V2.3: deterministic commercial columns. For STEFANIDIS-style rows: qty|unit price|initial|disc1%|disc1€|disc2%|disc2€|disc3%|disc3€|net. Missing discount amount is validated from initial-net.
h=h.replace(/function parseCommercial\(raw,line\)\{[\s\S]*?\}\nfunction enrich/,`function parseCommercial(raw,line){let quantity=Number(line?.quantity||0),price=Number(line?.unitCost||0),initial=0,d1=0,d1a=0,d2=0,d2a=0,d3=0,d3a=0,netAmount=Number(line?.netAmount||0),vatRate=Number(line?.vatRate||0),grossAmount=Number(line?.grossAmount||0);const rc=rawColumns(raw);if(rc&&rc.numeric.length>=3){const a=rc.numeric;quantity=a[0]||quantity;price=a[1]||price;initial=a[2]||quantity*price;if(a.length>=6){d1=a[3]||0;d1a=a[4]||0;netAmount=a[a.length-1]||netAmount;if(a.length>=8){d2=a[5]||0;d2a=a[6]||0}if(a.length>=10){d3=a[7]||0;d3a=a[8]||0}}else if(a.length>=4){netAmount=a[a.length-1]||netAmount}}if(!initial&&quantity>0&&price>0)initial=quantity*price;if(initial>0&&netAmount>0&&initial>=netAmount){const diff=round2(initial-netAmount);if(d1>0&&d1a<=0)d1a=diff;if(d1a>0&&d1<=0)d1=round2(d1a/initial*100)}if(!netAmount&&initial>0){netAmount=round2(initial-(d1a||0)-(d2a||0)-(d3a||0))}if(!grossAmount&&netAmount>0)grossAmount=netAmount*(1+vatRate/100);const discountCheck=initial>0&&netAmount>0?Math.abs(round2(initial-(d1a||0)-(d2a||0)-(d3a||0))-round2(netAmount))<=0.02:false;return {quantity,unitCost:price,initialAmount:initial,discount1:d1,discount1Amount:d1a,discount2:d2,discount2Amount:d2a,discount3:d3,discount3Amount:d3a,netAmount,vatRate,grossAmount,discountCheck,rawColumnCount:rc?.numeric?.length||0}}\nfunction enrich`);
// Add dedicated left-side crops. These are merged only to recover missing supplier codes/descriptions.
h=h.replace("const specs=[{name:'μεσαίο-πάνω',y0:.16,y1:.48},{name:'μεσαίο',y0:.23,y1:.62},{name:'μεσαίο-χαμηλό',y0:.34,y1:.76},{name:'χαμηλό',y0:.46,y1:.92}]", "const specs=[{name:'μεσαίο-πάνω',y0:.16,y1:.48},{name:'μεσαίο',y0:.23,y1:.62},{name:'μεσαίο-χαμηλό',y0:.34,y1:.76},{name:'χαμηλό',y0:.46,y1:.92}]");
// Make missing-code rows trigger crop even when quantity/price are already complete.
h=h.replace("const shouldCrop=String(mime).startsWith('image/')&&(incomplete(lines)>0||lines.length<7);", "const shouldCrop=String(mime).startsWith('image/')&&(incomplete(lines)>0||lines.length<7||lines.some(l=>!deriveCode(l)));" );
// Status includes supplier-code and discount checks.
h=h.replace("const withCode=rows.filter(x=>x.code).length,withDiscount=rows.filter(x=>Number(x.discount1||0)>0||Number(x.discount2||0)>0||Number(x.discount3||0)>0).length;", "const withCode=rows.filter(x=>x.code).length,withDiscount=rows.filter(x=>Number(x.discount1||0)>0||Number(x.discount2||0)>0||Number(x.discount3||0)>0).length,discountOk=rows.filter(x=>x.discountCheck).length;");
h=h.replace(/\$\('info'\)\.textContent=`V2\.3:[^`]*`;/, "$('info').textContent=`V2.3: ${rows.length} γραμμές · ${withCode} με κωδικό προμηθευτή · ${withDiscount} με έκπτωση · ${discountOk} με αριθμητικά επιβεβαιωμένη έκπτωση · ${incomplete(rows)} ελλιπείς ποσότητα/τιμή.`;");
document.open();document.write(h);document.close();}catch(e){document.getElementById('boot').textContent='Σφάλμα V2.3: '+e.message}})();
</script></body></html>
