<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyWorkStation · KAT Invoice Lab V2.3</title><style>html,body{margin:0;height:100%;background:#eef4f1;font-family:system-ui}.bar{position:fixed;z-index:20;right:12px;top:10px;background:#073e32;color:white;border-radius:999px;padding:7px 11px;font-weight:900;font-size:12px;box-shadow:0 3px 10px #0003}iframe{border:0;width:100%;height:100vh}</style></head><body><div class="bar">V2.3 · DISCOUNT € + SUPPLIER CODE RECOVERY</div><iframe id="lab" src="/kat-invoice-lab-v2.html?v=23"></iframe><script>
const frame=document.getElementById('lab');
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;
try{
 const oldNum=w.num||function(s){return Number(String(s||'').replace(',','.'))||0};
 const n=s=>oldNum(String(s??'').replace(/%/g,'')); const r2=x=>Math.round((Number(x||0)+Number.EPSILON)*100)/100;
 w.deriveCode=function(line){const raw=String(line?.rawText||'').trim();const m=raw.match(/^\s*(\d{5,14})\b/);if(m)return m[1];const c=String(line?.code||'').trim();if(/^\d{5,14}$/.test(c))return c;const desc=String(line?.description||'');const dm=desc.match(/^\s*(\d{5,14})\b/);return dm?dm[1]:''};
 w.parseCommercial=function(raw,line){let q=Math.max(0,Number(line?.quantity||0)),price=Math.max(0,Number(line?.unitCost||0)),initial=0,d1=0,d1a=0,d2=0,d2a=0,d3=0,d3a=0,net=Math.max(0,Number(line?.netAmount||0)),vat=Math.max(0,Number(line?.vatRate||0)),gross=Math.max(0,Number(line?.grossAmount||0));const text=String(raw||'').replace(/\s+/g,' ').trim();const um=text.match(/\b(TEM|ΤΕΜ|ΤΜΧ|PCS|PC|KG|KGR|LT|L)\b/i);if(um){const tail=text.slice(um.index+um[0].length).trim();let p=tail.includes('|')?tail.split('|').map(x=>x.trim()).filter(x=>x!==''):(tail.match(/\d+(?:[.,]\d+)?%?/g)||[]);let a=p.map(n);if(a.length>=3){q=a[0]||q;price=a[1]||price;initial=a[2]||r2(q*price);if(a.length>=6){d1=a[3]||0;d1a=a[4]||0;net=a[a.length-1]||net;if(a.length>=8){d2=a[5]||0;d2a=a[6]||0}if(a.length>=10){d3=a[7]||0;d3a=a[8]||0}}else if(a.length>=4){net=a[a.length-1]||net}}}
 if(!initial&&q&&price)initial=r2(q*price);if(initial>0&&net>0&&initial>net){const diff=r2(initial-net);if(!d1a)d1a=diff;if(!d1)d1=r2(diff/initial*100)}if(!net&&initial){net=initial;if(d1a)net-=d1a;else if(d1)net*=1-d1/100;if(d2a)net-=d2a;else if(d2)net*=1-d2/100;if(d3a)net-=d3a;else if(d3)net*=1-d3/100;net=r2(net)}if(!gross&&net)gross=r2(net*(1+vat/100));return{quantity:q,unitCost:price,initialAmount:initial,discount1:d1,discount1Amount:d1a,discount2:d2,discount2Amount:d2a,discount3:d3,discount3Amount:d3a,netAmount:net,vatRate:vat,grossAmount:gross,rawColumnCount:0}}
 const oldCrops=w.makeCrops;
 w.makeCrops=async function(file){const crops=await oldCrops(file);if(!String(file.type||'').startsWith('image/'))return crops;try{const b=await createImageBitmap(file);const specs=[{name:'κωδικοί-πάνω',y0:.15,y1:.55},{name:'κωδικοί-κάτω',y0:.45,y1:.94}];for(const s of specs){const sx=0,sy=Math.floor(b.height*s.y0),sw=Math.floor(b.width*.58),sh=Math.floor(b.height*(s.y1-s.y0));const c=document.createElement('canvas');c.width=2600;c.height=Math.max(900,Math.round(sh*(2600/sw)));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(b,sx,sy,sw,sh,0,0,c.width,c.height);crops.push({name:s.name,dataUrl:c.toDataURL('image/jpeg',.99)})}b.close?.()}catch{}return crops};
 const strong=d.querySelector('header strong');if(strong)strong.textContent='MyWorkStation · KAT Invoice Lab V2.3';const tag=d.querySelector('.tag');if(tag)tag.textContent='V2.3 SAFE TEST';const notice=d.querySelector('.notice');if(notice)notice.textContent='V2.3: κρατά πραγματική Τιμή ΤΜΧ, Έκπτ1/2/3 σε % και €, και κάνει επιπλέον αριστερό crop/zoom μόνο για ανάκτηση Κωδικού προμηθευτή. Δεν καταχωρίζει τίποτα.';
}catch(e){console.error('V2.3 patch',e)}});
</script></body></html>
