<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAT Invoice Lab V2.6.6</title><style>html,body{margin:0;height:100%;font-family:system-ui;background:#eef4f1}#bar{padding:10px 14px;background:#073e32;color:white;font-weight:800}#msg{padding:8px 14px;background:#fff8df;border-bottom:1px solid #e7cf78}iframe{width:100%;height:calc(100% - 82px);border:0}</style></head><body><div id="bar">MyWorkStation · KAT Invoice Lab V2.6.6 CLEAN STORE BRIDGE</div><div id="msg">Έλεγχος ενεργού session και φόρτωση Κυλικείου ΚΑΤ…</div><iframe id="lab" src="/kat-invoice-lab-v2-6-clean.html?bridge=v266"></iframe><script>
const msg=document.getElementById('msg'),frame=document.getElementById('lab');
const token=localStorage.getItem('token')||sessionStorage.getItem('token')||sessionStorage.getItem('platformToken')||'';
async function stores(){const c=new AbortController();const t=setTimeout(()=>c.abort(),10000);try{const r=await fetch('/api/stores',{credentials:'include',signal:c.signal,headers:{...(token?{Authorization:`Bearer ${token}`}:{})}});let d=[];try{d=await r.json()}catch{}if(!r.ok)throw new Error((d&&d.error)||`HTTP ${r.status}`);return Array.isArray(d)?d:[]}finally{clearTimeout(t)}}
async function bridge(){try{const rows=await stores();if(!rows.length)throw new Error('0 καταστήματα από /api/stores');const kat=rows.find(s=>String(s.name||'').toLocaleUpperCase('el-GR').includes('ΚΑΤ')||String(s.name||'').toUpperCase().includes('KAT'))||rows[0];msg.textContent=`Session OK · ${rows.length} καταστήματα · επιλέχθηκε: ${kat.name}`;const apply=()=>{try{const d=frame.contentDocument;if(!d)return false;const sel=d.getElementById('store');if(!sel)return false;sel.innerHTML=rows.map(s=>`<option value="${String(s.id).replace(/"/g,'&quot;')}">${String(s.name||'')}</option>`).join('');sel.value=kat.id;sel.dispatchEvent(new Event('change',{bubbles:true}));const st=d.getElementById('status');if(st)st.textContent=`V2.6.6 CLEAN STORE BRIDGE · ${rows.length} καταστήματα · ${kat.name}`;return true}catch{return false}};frame.addEventListener('load',()=>{let n=0;const x=setInterval(()=>{n++;if(apply()||n>30)clearInterval(x)},250)});let n=0;const x=setInterval(()=>{n++;if(apply()||n>30)clearInterval(x)},250)}catch(e){msg.textContent=`STORE BRIDGE ERROR: ${e.name==='AbortError'?'timeout /api/stores':e.message} · token:${token?'ΝΑΙ':'ΟΧΙ'}`;msg.style.background='#fff0f1'}}
bridge();
</script></body></html>
