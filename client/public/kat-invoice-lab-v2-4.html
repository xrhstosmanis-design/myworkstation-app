<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAT Invoice Lab V2.4.3 RECOVERY GUARD</title></head><body><div id="boot" style="font:700 18px system-ui;padding:24px">Φόρτωση KAT Invoice Lab V2.4.3…</div><script>
(async()=>{try{let h=await (await fetch('/kat-invoice-lab-v2.html?base=v22',{cache:'no-store'})).text();
h=h.replaceAll('V2.2','V2.4.3').replace('SUPPLIER CODE + DISCOUNT PRIORITY','REGRESSION LAB · RECOVERY GUARD + ECONOMIC GUARD + PACK RULES');
const inject=`
function commercialRawScore(raw,line){try{const p=parseCommercial(raw,line),q=Number(p.quantity||0),u=Number(p.unitCost||0),initial=Number(p.initialAmount||0),net=Number(p.netAmount||0),d1=Number(p.discount1Amount||0),d2=Number(p.discount2Amount||0),d3=Number(p.discount3Amount||0);let s=0;if(q>0)s+=8;if(u>0)s+=8;if(initial>0)s+=8;if(net>0)s+=8;s+=Math.min(12,Number(p.rawColumnCount||0)*2);if(q>0&&u>0&&initial>0){const expected=q*u,rel=Math.abs(initial-expected)/Math.max(initial,expected,0.01);if(rel<=0.03)s+=55;else if(rel<=0.08)s+=20;else s-=55}if(initial>0&&net>0){if(net<=initial*1.02)s+=20;else s-=65;const discounts=d1+d2+d3;if(discounts>0){const rel=Math.abs((initial-discounts)-net)/Math.max(initial,0.01);if(rel<=0.03)s+=30;else if(rel<=0.08)s+=10;else s-=20}}return s}catch{return -999}}
function strongDescKey(v){return norm(String(v||'').replace(/\\b(1PACK|1\\s*POD|C20U|C12U|C14U|C38U)\\b/ig,' ').replace(/\\s+/g,' ').trim())}
function rowScore(x){const e=enrich(x);return commercialRawScore(String(x?.rawText||''),x)+(deriveCode(e)?20:0)+(Number(e.confidence||0)/100)+Math.min(5,String(e.rawText||'').length/100)}
function genericRecoveryRow(line){if(deriveCode(line))return false;const d=String(line?.description||line?.rawText||'').toLocaleUpperCase('el-GR').replace(/\\s+/g,' ').trim();const generic=/^(ΑΝΑΨΥΚΤΙΚΟ|ΑΝΑΨΥΚΤΙΚΑ|ΝΕΡΟ|WATER)(?:\\s|$)/.test(d);if(!generic)return false;const brands=/(COCA|ΚΟΚΑ|SPRITE|FANTA|PEPSI|SEVEN|7UP|ΖΑΓΟΡΙ|ΘΕΩΝΗ|VIKOS|ΒΙΚΟΣ|MONSTER|RED\\s*BULL|REDBULL)/.test(d);return !brands}
function dedupeLines(lines){const out=[];for(const src of (lines||[])){const s=enrich(src),sk=strongDescKey(s.description||s.rawText);let idx=-1;for(let i=0;i<out.length;i++){const o=enrich(out[i]),ok=strongDescKey(o.description||o.rawText);const qtyCompat=Number(s.quantity||0)<=0||Number(o.quantity||0)<=0||Number(s.quantity||0)===Number(o.quantity||0);if(sk&&ok&&qtyCompat&&(sk===ok||sk.includes(ok)||ok.includes(sk))){idx=i;break}}if(idx<0){if(genericRecoveryRow(src))continue;out.push({...src});continue}const a=out[idx],better=rowScore(src)>rowScore(a)?src:a,worse=better===src?a:src;const merged={...better};for(const k of ['code','barcode','description','unit'])if(!String(merged[k]||'').trim()&&String(worse[k]||'').trim())merged[k]=worse[k];for(const k of ['quantity','unitCost','netAmount','vatRate','grossAmount','confidence'])if(Number(merged[k]||0)<=0&&Number(worse[k]||0)>0)merged[k]=worse[k];if(commercialRawScore(String(worse.rawText||''),worse)>commercialRawScore(String(merged.rawText||''),merged))merged.rawText=worse.rawText;out[idx]=merged}return out}
function packRule(line){const d=String(line?.description||line?.rawText||'').toLocaleUpperCase('el-GR').replace(/,/g,'.'),u=String(line?.unit||'').toLocaleUpperCase('el-GR');if(!/(ΚΙΒ|ΚΒ|CASE|BOX)/.test(u+' '+d))return null;if(/MONSTER|RED\\s*BULL|REDBULL/.test(d))return {pcs:24,rule:'Monster / Red Bull'};if(/(1\\.5\\s*(L|LT)\\b|1500\\s*ML\\b)/.test(d))return {pcs:6,rule:'1,5L'};if(/(330\\s*ML\\b|0\\.33\\s*L\\b|33\\s*CL\\b)/.test(d))return {pcs:24,rule:'330ml'};if(/(500\\s*ML\\b|0\\.5\\s*L\\b|50\\s*CL\\b)/.test(d))return {pcs:24,rule:'500ml'};if(/ΦΙΑΛ|BOTTLE/.test(d))return {pcs:20,rule:'Φιάλες'};if(/ΝΕΡΟ|WATER|ΖΑΓΟΡΙ|ΘΕΩΝΗ/.test(d)&&/(750\\s*ML|0\\.75\\s*L)/.test(d))return {pcs:12,rule:'Νερό 750ml'};return null}
function stockView(line){const e=enrich(line),r=packRule(e);if(!r)return {...e,stockQty:null,netUnitCost:null,packRule:''};const stockQty=Number(e.quantity||0)*r.pcs;const netUnitCost=stockQty>0&&Number(e.netAmount||0)>0?Number(e.netAmount)/stockQty:0;return {...e,stockQty,netUnitCost,packRule:r.rule+' · '+r.pcs+' τμχ/ΚΒ'}}
`;
h=h.replace('function render(jobId,ai,lines,label){',inject+'\nfunction render(jobId,ai,lines,label){');
h=h.replace("if(cCols>tCols||(cCols===tCols&&candidateRaw.length>targetRaw.length))target.rawText=candidateRaw;","const cScore=commercialRawScore(candidateRaw,c),tScore=commercialRawScore(targetRaw,target);if(cScore>tScore+2||(Math.abs(cScore-tScore)<=2&&(cCols>tCols||(cCols===tCols&&candidateRaw.length>targetRaw.length))))target.rawText=candidateRaw;");
// Recovery may enrich a matched product, but generic crop guesses may never create a new product row.
h=h.replace("if(!target){const valid=deriveCode(c)||String(c?.description||'').trim();if(valid)out.push({...c});continue}","if(!target){const valid=deriveCode(c)||String(c?.description||'').trim();if(valid&&!genericRecoveryRow(c))out.push({...c});continue}");
h=h.replace('<th>Confidence</th><th>Raw</th>','<th>ΤΜΧ stock</th><th>Καθ. τιμή/ΤΜΧ</th><th>Κανόνας συσκ.</th><th>Confidence</th><th>Raw</th>');
h=h.replace("const rows=(lines||[]).map(enrich).filter(l=>l.code||String(l.description||'').trim());","const rows=dedupeLines(lines||[]).map(stockView).filter(l=>l.code||String(l.description||'').trim());");
h=h.replace("<td>${esc(l.confidence??0)}%</td><td>${esc(l.rawText||'')}</td>","<td>${l.stockQty==null?'—':esc(l.stockQty)}</td><td>${l.netUnitCost==null?'—':fmt(l.netUnitCost)}</td><td>${esc(l.packRule||'—')}</td><td>${esc(l.confidence??0)}%</td><td>${esc(l.rawText||'')}</td>");
h=h.replace("render(full.job.id,full.ai,lines,'KAT_V2_4_3_SUPPLIER_CODE_DISCOUNTS');","lines=dedupeLines(lines);render(full.job.id,full.ai,lines,'KAT_V2_4_3_RECOVERY_GUARD');");
h=h.replace("status('3/3 V2.4.3 supplier-code/discount parsing…');render(full.job.id,full.ai,lines,'KAT_V2_4_3_SUPPLIER_CODE_DISCOUNTS');","status('3/3 V2.4.3 recovery guard + economic guard + ΚΒ→ΤΜΧ…');lines=dedupeLines(lines);render(full.job.id,full.ai,lines,'KAT_V2_4_3_RECOVERY_GUARD');");
h=h.replace('V2.4.3: ο κωδικός στην αρχή της γραμμής κρατιέται ως Κωδικός προμηθευτή.','V2.4.3 RECOVERY GUARD SAFE: generic crop/recovery γραμμές χωρίς πραγματικό κωδικό ή συγκεκριμένο προϊόν δεν δημιουργούν νέα προϊόντα. Economic guard και pack rules παραμένουν ενεργά.');
document.open();document.write(h);document.close();}catch(e){document.getElementById('boot').textContent='Σφάλμα φόρτωσης V2.4.3: '+e.message}})();
</script></body></html>
