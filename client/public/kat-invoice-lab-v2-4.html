<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAT Invoice Lab V2.4</title></head><body><div id="boot" style="font:700 18px system-ui;padding:24px">Φόρτωση KAT Invoice Lab V2.4…</div><script>
(async()=>{try{let h=await (await fetch('/kat-invoice-lab-v2.html?base=v22',{cache:'no-store'})).text();
h=h.replaceAll('V2.2','V2.4').replace('SUPPLIER CODE + DISCOUNT PRIORITY','REGRESSION LAB · DEDUP + RECOVERY + CASE TO PCS');
// Keep the proven V2.2 commercial parser untouched. Add only post-processing.
const inject=`
function strongDescKey(v){return norm(String(v||'').replace(/\\b(1PACK|1\\s*POD|C20U|C12U|C14U|C38U)\\b/ig,' ').replace(/\\s+/g,' ').trim())}
function rowScore(x){const e=enrich(x);return (deriveCode(e)?20:0)+(Number(e.quantity||0)>0?10:0)+(Number(e.unitCost||0)>0?10:0)+(Number(e.netAmount||0)>0?8:0)+(Number(e.vatRate||0)>0?3:0)+(Number(e.confidence||0)/100)+Math.min(5,String(e.rawText||'').length/100)}
function dedupeLines(lines){const out=[];for(const src of (lines||[])){const s=enrich(src),sk=strongDescKey(s.description||s.rawText);let idx=-1;for(let i=0;i<out.length;i++){const o=enrich(out[i]),ok=strongDescKey(o.description||o.rawText);const qtyCompat=Number(s.quantity||0)<=0||Number(o.quantity||0)<=0||Number(s.quantity||0)===Number(o.quantity||0);if(sk&&ok&&qtyCompat&&(sk===ok||sk.includes(ok)||ok.includes(sk))){idx=i;break}}if(idx<0){out.push({...src});continue}const a=out[idx],better=rowScore(src)>rowScore(a)?src:a,worse=better===src?a:src;const merged={...better};for(const k of ['code','barcode','description','unit'])if(!String(merged[k]||'').trim()&&String(worse[k]||'').trim())merged[k]=worse[k];for(const k of ['quantity','unitCost','netAmount','vatRate','grossAmount','confidence'])if(Number(merged[k]||0)<=0&&Number(worse[k]||0)>0)merged[k]=worse[k];if(String(worse.rawText||'').length>String(merged.rawText||'').length)merged.rawText=worse.rawText;out[idx]=merged}return out}
function packRule(line){const d=String(line?.description||line?.rawText||'').toLocaleUpperCase('el-GR'),u=String(line?.unit||'').toLocaleUpperCase('el-GR');if(!/(ΚΙΒ|ΚΒ|CASE|BOX)/.test(u+' '+d))return null;if(/COCA|ΚΟΚΑ/.test(d)&&/(1[.,]?5\\s*L|1[.,]?5LT)/.test(d))return {pcs:6,rule:'Coca-Cola 1,5L'};if(/ΝΕΡΟ|WATER|ΖΑΓΟΡΙ|ΘΕΩΝΗ/.test(d)&&/(750\\s*ML|0[.,]?75\\s*L)/.test(d))return {pcs:12,rule:'Νερό 750ml'};if(/ΝΕΡΟ|WATER|ΖΑΓΟΡΙ|ΘΕΩΝΗ/.test(d)&&/(1\\s*L|1LT|1[.,]?5\\s*L|1[.,]?5LT)/.test(d))return {pcs:6,rule:'Νερό 1L/1,5L'};if(/ΦΙΑΛ|BOTTLE/.test(d))return {pcs:20,rule:'ΚΒ φιάλες'};return null}
function stockView(line){const e=enrich(line),r=packRule(e);if(!r)return {...e,stockQty:null,netUnitCost:null,packRule:''};const stockQty=Number(e.quantity||0)*r.pcs;const netUnitCost=stockQty>0&&Number(e.netAmount||0)>0?Number(e.netAmount)/stockQty:0;return {...e,stockQty,netUnitCost,packRule:r.rule+' · '+r.pcs+' τμχ/ΚΒ'}}
`;
h=h.replace('function render(jobId,ai,lines,label){',inject+'\nfunction render(jobId,ai,lines,label){');
// Add stock conversion columns without changing invoice columns.
h=h.replace('<th>Confidence</th><th>Raw</th>','<th>ΤΜΧ stock</th><th>Καθ. τιμή/ΤΜΧ</th><th>Κανόνας συσκ.</th><th>Confidence</th><th>Raw</th>');
h=h.replace("const rows=(lines||[]).map(enrich).filter(l=>l.code||String(l.description||'').trim());","const rows=dedupeLines(lines||[]).map(stockView).filter(l=>l.code||String(l.description||'').trim());");
h=h.replace("<td>${esc(l.confidence??0)}%</td><td>${esc(l.rawText||'')}</td>","<td>${l.stockQty==null?'—':esc(l.stockQty)}</td><td>${l.netUnitCost==null?'—':fmt(l.netUnitCost)}</td><td>${esc(l.packRule||'—')}</td><td>${esc(l.confidence??0)}%</td><td>${esc(l.rawText||'')}</td>");
// Before rendering, collapse obvious duplicates. Recovery/crops from V2.2 remain available.
h=h.replace("render(full.job.id,full.ai,lines,'KAT_V2_4_SUPPLIER_CODE_DISCOUNTS');","lines=dedupeLines(lines);render(full.job.id,full.ai,lines,'KAT_V2_4_DEDUP_CASE_TO_PCS');");
h=h.replace("status('3/3 V2.4 supplier-code/discount parsing…');render(full.job.id,full.ai,lines,'KAT_V2_4_SUPPLIER_CODE_DISCOUNTS');","status('3/3 V2.4 dedup + ΚΒ→ΤΜΧ…');lines=dedupeLines(lines);render(full.job.id,full.ai,lines,'KAT_V2_4_DEDUP_CASE_TO_PCS');");
// Explicit safe-test wording.
h=h.replace('V2.4: ο κωδικός στην αρχή της γραμμής κρατιέται ως Κωδικός προμηθευτή.','V2.4 SAFE: κρατάμε ανέγγιχτες τις οικονομικές τιμές του V2.2. Προσθέτουμε μόνο deduplication και υπολογισμό stock ΤΜΧ/καθαρής τιμής ανά ΤΜΧ όταν υπάρχει γνωστός κανόνας συσκευασίας.');
document.open();document.write(h);document.close();}catch(e){document.getElementById('boot').textContent='Σφάλμα φόρτωσης V2.4: '+e.message}})();
</script></body></html>
