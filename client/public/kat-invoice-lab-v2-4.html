<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAT Invoice Lab V2.6.2</title></head><body><div id="boot" style="font:700 18px system-ui;padding:24px">Φόρτωση KAT Invoice Lab V2.6.2…</div><script>
(async()=>{try{let h=await (await fetch('/kat-invoice-lab-v2.html?base=v22',{cache:'no-store'})).text();
h=h.replaceAll('V2.2','V2.6.2').replace('SUPPLIER CODE + DISCOUNT PRIORITY','REGRESSION LAB · SAFE DEDUP + NORMALIZED CASE TO PCS');
// AUTH-ONLY: single bootstrap, no nested wrapper. Parser remains untouched.
h=h.replace("const $=id=>document.getElementById(id),token=localStorage.getItem('token');const state={file:null,stores:[],busy:false};","const $=id=>document.getElementById(id),token=(localStorage.getItem('token')||sessionStorage.getItem('token')||sessionStorage.getItem('platformToken')||'');const state={file:null,stores:[],busy:false};");
h=h.replace("const api=async(path,options={})=>{const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})}});","const api=async(path,options={})=>{const r=await fetch(path,{credentials:'include',...options,headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})}});");
h=h.replace("async function loadStores(){if(!token){status('Δεν υπάρχει ενεργό login token. Άνοιξε πρώτα το MyWorkStation και συνδέσου.',true);return}try{","async function loadStores(){try{");
// Keep the proven V2.2 commercial parser untouched. Add only post-processing.
const inject=`
function strongDescKey(v){return norm(String(v||'').replace(/\\b(1PACK|1\\s*POD|C20U|C12U|C14U|C38U|1X6PACK|1X24|12X0[.,]?75LT?)\\b/ig,' ').replace(/\\s+/g,' ').trim())}
function rowScore(x){const e=enrich(x);return (deriveCode(e)?30:0)+(Number(e.quantity||0)>0?12:0)+(Number(e.unitCost||0)>0?12:0)+(Number(e.netAmount||0)>0?10:0)+(Number(e.vatRate||0)>0?4:0)+(Number(e.confidence||0)/100)+Math.min(6,String(e.rawText||'').length/90)}
function sameProduct(a,b){const ac=deriveCode(a),bc=deriveCode(b);if(ac&&bc&&ac===bc)return true;const ak=strongDescKey(a?.description||a?.rawText),bk=strongDescKey(b?.description||b?.rawText);if(!ak||!bk)return false;if(ak===bk)return true;const min=Math.min(ak.length,bk.length),max=Math.max(ak.length,bk.length);return min>=8&&min/max>=0.78&&(ak.includes(bk)||bk.includes(ak))}
function dedupeLines(lines){const out=[];for(const src of (lines||[])){let idx=-1;for(let i=0;i<out.length;i++){if(sameProduct(out[i],src)){idx=i;break}}if(idx<0){out.push({...src});continue}const current=out[idx],better=rowScore(src)>rowScore(current)?src:current,worse=better===src?current:src,merged={...better};for(const k of ['code','barcode','description','unit'])if(!String(merged[k]||'').trim()&&String(worse[k]||'').trim())merged[k]=worse[k];for(const k of ['quantity','unitCost','netAmount','vatRate','grossAmount','confidence'])if(Number(merged[k]||0)<=0&&Number(worse[k]||0)>0)merged[k]=worse[k];const br=String(better.rawText||''),wr=String(worse.rawText||'');if(wr.length>br.length&&rowScore(worse)>=rowScore(better)-5)merged.rawText=wr;out[idx]=merged}return out}
function normalizedPackText(line){return String((line?.description||'')+' '+(line?.rawText||'')+' '+(line?.unit||'')).toLocaleUpperCase('el-GR').replace(/,/g,'.').replace(/ΚΙΒΩΤΙΟ|ΚΙΒΩΤ|ΚΙΒΩΤ\.|ΚΙΒ\/Δ|ΚΙΒ\/Θ|ΚΙΒ|ΚΒ\/Δ|ΚΒ|CASE|BOX/g,' CASE ').replace(/ΛΤ/g,'LT').replace(/ΛΙΤΡ(?:Ο|Α|ΩΝ)?/g,'L').replace(/LIT(?:RE|ER|RO|RA)?/g,'L').replace(/\\s+/g,' ').trim()}
function isCaseLike(t){return /\\bCASE\\b/.test(t)}
function packRule(line){const t=normalizedPackText(line);if(!isCaseLike(t))return null;if(/MONSTER|RED\\s*BULL|REDBULL/.test(t))return {pcs:24,rule:'Monster / Red Bull'};if(/(1\\.5\\s*(L|LT)\\b|1500\\s*ML\\b)/.test(t))return {pcs:6,rule:'1,5L'};if(/(330\\s*ML\\b|0\\.33\\s*L\\b|33\\s*CL\\b)/.test(t))return {pcs:24,rule:'330ml'};if(/(500\\s*ML\\b|0\\.5\\s*L\\b|50\\s*CL\\b)/.test(t))return {pcs:24,rule:'500ml'};if(/ΦΙΑΛ|BOTTLE/.test(t))return {pcs:20,rule:'Φιάλες'};return null}
function stockView(line){const e=enrich(line),r=packRule(e);if(!r)return {...e,stockQty:null,netUnitCost:null,packRule:''};const stockQty=Number(e.quantity||0)*r.pcs;const netUnitCost=stockQty>0&&Number(e.netAmount||0)>0?Number(e.netAmount)/stockQty:0;return {...e,stockQty,netUnitCost,packRule:r.rule+' · '+r.pcs+' τμχ/ΚΒ'}}
`;
h=h.replace('function render(jobId,ai,lines,label){',inject+'\nfunction render(jobId,ai,lines,label){');
h=h.replace('<th>Confidence</th><th>Raw</th>','<th>ΤΜΧ stock</th><th>Καθ. τιμή/ΤΜΧ</th><th>Κανόνας συσκ.</th><th>Confidence</th><th>Raw</th>');
h=h.replace("const rows=(lines||[]).map(enrich).filter(l=>l.code||String(l.description||'').trim());","const rows=dedupeLines(lines||[]).map(stockView).filter(l=>l.code||String(l.description||'').trim());");
h=h.replace("<td>${esc(l.confidence??0)}%</td><td>${esc(l.rawText||'')}</td>","<td>${l.stockQty==null?'—':esc(l.stockQty)}</td><td>${l.netUnitCost==null?'—':fmt(l.netUnitCost)}</td><td>${esc(l.packRule||'—')}</td><td>${esc(l.confidence??0)}%</td><td>${esc(l.rawText||'')}</td>");
h=h.replace("render(full.job.id,full.ai,lines,'KAT_V2_6_2_SUPPLIER_CODE_DISCOUNTS');","lines=dedupeLines(lines);render(full.job.id,full.ai,lines,'KAT_V2_6_2_SAFE_DEDUP_CASE_TO_PCS');");
h=h.replace('V2.6.2: ο κωδικός στην αρχή της γραμμής κρατιέται ως Κωδικός προμηθευτή.','V2.6.2 SAFE: οι οικονομικές τιμές του V2.2 παραμένουν ανέγγιχτες. Όλες οι μορφές Κιβ/δ, Κιβώτ, Κιβώτιο, ΚΒ, CASE, BOX κανονικοποιούνται. Κανόνες: 1,5L=6 τμχ/ΚΒ, 330ml=24, 500ml=24, φιάλες=20, Monster/Red Bull=24.');
document.open();document.write(h);document.close();}catch(e){document.getElementById('boot').textContent='Σφάλμα φόρτωσης V2.6.2: '+e.message}})();
</script></body></html>
