name: N40 temporary source review
on:
  push:
    branches: [fix/n40-twin-navigation-20261010]
    paths: [.github/workflows/n40-review-snapshot-20261010.yml]
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export only tracked source and relevant history
        run: |
          mkdir -p "$RUNNER_TEMP/n40-review"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/n40-review/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/n40-review/revision.txt"
          git log --first-parent --format='%H %aI %s' 22f1914b..HEAD > "$RUNNER_TEMP/n40-review/main-history.txt"
          git log --format='%H %aI %s' -- client/src/components/platform/AiCommandCenter.jsx client/src/components/platform/PlatformAdminApp.jsx > "$RUNNER_TEMP/n40-review/navigation-history.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: n40-current-review
          path: ${{ runner.temp }}/n40-review/
          retention-days: 1
          if-no-files-found: error
