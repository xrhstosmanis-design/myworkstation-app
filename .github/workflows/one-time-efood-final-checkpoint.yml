name: One-time efood final active-list checkpoint

on:
  push:
    branches:
      - "docs/efood-lab-merge-ci-checkpoint-20260928"

permissions:
  contents: write

jobs:
  update-active-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: "docs/efood-lab-merge-ci-checkpoint-20260928"
          fetch-depth: 0
      - name: Update efood status and remove one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          active = Path("CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md")
          workflow = Path(".github/workflows/one-time-efood-final-checkpoint.yml")
          old = (
              "## 28/09/2026 — efood / Pelican ασφαλές one-shot LAB webhook · PR #1514 / CI AWAITING\n\n"
              "- [ ] Στο αποκλειστικό `MYWORKSTATION LAB / ΕΡΓΑΣΤΗΡΙΟ ΔΟΚΙΜΩΝ` προστέθηκε προσωρινό one-shot SANDBOX webhook για το efood Partner `Trigger Test Order`: "
              "ξεχωριστό ισχυρό Authorization secret με hash-only αποθήκευση, 5λεπτο παράθυρο, `FOR UPDATE`, αυτόματο κλείδωμα στο πρώτο έγκυρο event ή στη λήξη, "
              "χειροκίνητο emergency lock και idempotent retry. Το event αποθηκεύεται μόνο κρυπτογραφημένο ως dry-run. Παραγγελία, πώληση, stock, πληρωμή, RBS/EFTPOS, "
              "fiscal/myDATA και outbound external calls παραμένουν κλειδωμένα. Branch `feat/efood-lab-safe-webhook-window`, PR #1514, CI AWAITING· δεν έγινε merge/deploy ούτε πραγματικό Partner trigger. "
              "Checkpoint `CHECKPOINTS/CHANGES/2026-09-28-efood-lab-safe-webhook-window.md`.\n\n"
          )
          new = (
              "## 28/09/2026 — efood / Pelican ασφαλές one-shot LAB webhook · MERGED / CI PASS / AWAITING DEPLOY-LAB\n\n"
              "- [x] PR #1514 συγχωνεύτηκε ως `55f2a53c939cee230bab67b23645fd60555430bc`. PR CI #3827 και main CI #3829 PASS· το επόμενο main `639944effe644d8709f5daefde18b33a428fa710` πέρασε επίσης CI #3830 και περιλαμβάνει την αλλαγή. "
              "Το αποκλειστικό `MYWORKSTATION LAB / ΕΡΓΑΣΤΗΡΙΟ ΔΟΚΙΜΩΝ` διαθέτει πλέον προσωρινό one-shot SANDBOX webhook για το efood Partner `Trigger Test Order`, με hash-only Authorization secret, 5λεπτο παράθυρο, row lock, αυτόματο κλείδωμα/λήξη, idempotent retry και κρυπτογραφημένο dry-run event. "
              "Παραγγελία, πώληση, stock, πληρωμή, RBS/EFTPOS, fiscal/myDATA και outbound external calls παραμένουν κλειδωμένα. Render exact revision και πραγματικό Partner trigger παραμένουν AWAITING· δεν δηλώνεται LAB PASS. "
              "Checkpoint `CHECKPOINTS/CHANGES/2026-09-28-efood-lab-safe-webhook-window.md`.\n\n"
          )
          text = active.read_text(encoding="utf-8")
          if old not in text:
              raise SystemExit("Δεν βρέθηκε το αναμενόμενο efood active-list block")
          active.write_text(text.replace(old, new, 1), encoding="utf-8")
          workflow.unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md .github/workflows/one-time-efood-final-checkpoint.yml
          git commit -m "docs: record merged efood LAB webhook status"
          git push origin HEAD:docs/efood-lab-merge-ci-checkpoint-20260928
