name: Cash counting claim registry sync (single use)
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: write
  pull-requests: read
jobs:
  synchronize-retained-cash-claim:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/cash-adjacent-count-claim-20261105' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout only the owned documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/cash-adjacent-count-claim-20261105
          fetch-depth: 1
      - name: Prepare Python for the existing tracker PDF generator
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve entire registry history and prepend one bounded claim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          claim_file=Path('CHECKPOINTS/CHANGES/2026-11-05-cash-adjacent-counting-claim.md')
          marker='## 05/11/2026 — CASH-ADJACENT-COUNT-21'.encode('utf-8')
          claim=claim_file.read_bytes().rstrip(b'\n')+b'\n\n'
          assert claim.startswith(marker), 'Unexpected claim header'
          for name in (
              'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md',
              'docs/roadmap/OPEN_WORK_TRACKER.md',
              'docs/roadmap/PENDING_WORK.md',
          ):
              path=Path(name)
              before=path.read_bytes()
              assert before and before.startswith(b'## '), f'Unexpected registry prefix: {name}'
              assert marker not in before, f'Duplicate cash claim in: {name}'
              after=claim+before
              assert after.endswith(before) and len(after)==len(claim)+len(before)
              path.write_bytes(after)
              print(f'Preserved {name}: original {len(before)} bytes, prepend {len(claim)} bytes')
          PY
      - name: Regenerate both existing tracker PDF copies from the canonical Markdown
        shell: bash
        run: |
          set -euo pipefail
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          python -m pip install --disable-pip-version-check 'reportlab==4.4.0'
          python docs/roadmap/generate-open-work-tracker.py
          cp output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf
          cmp output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf
      - name: Commit only documentation and delete this one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- '.github/workflows/cash-adjacent-claim-sync-once.yml'
          git add -- CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md \
                     docs/roadmap/OPEN_WORK_TRACKER.md \
                     docs/roadmap/PENDING_WORK.md \
                     output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf \
                     docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'docs(cash): preserve registries and regenerate tracker PDF'
          git push origin HEAD:docs/cash-adjacent-count-claim-20261105
