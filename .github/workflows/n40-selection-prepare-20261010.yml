name: N40 one-time selection integration
on:
  push:
    branches: [fix/n40-twin-selection-20261010]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/n40-twin-selection-20261010
          fetch-depth: 0
      - name: Reconcile main and apply only exact N40 anchors
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import re
          tracker=Path('docs/roadmap/OPEN_WORK_TRACKER.md').read_text()
          claim=re.search(r'^### AI-CC-LIMITS .*?(?=^### |\Z)',tracker,re.M|re.S)
          assert claim and 'codex/n40-full-twin-navigation-audit-20261010' in claim.group(), 'Preserve owner; scoped main claim required'
          def replace_once(path,old,new):
              p=Path(path); source=p.read_text()
              assert source.count(old)==1, f'Expected exactly one source anchor: {path} / {old[:100]}'
              p.write_text(source.replace(old,new,1))
          cc='client/src/components/platform/AiCommandCenter.jsx'
          parent='client/src/components/platform/PlatformAdminApp.jsx'
          replace_once(cc,'import AiCreditAlert from "./AiCreditAlert.jsx";','import AiCreditAlert from "./AiCreditAlert.jsx";\nimport {resolveTwinSelection,twinSelectionFor} from "./ai-command-twin-selection.js";')
          replace_once(cc,'onOpenStock,onOpenWorkforce,onOpenVideo}){','onOpenStock,onOpenWorkforce,onOpenVideo,initialTwinSelection=null,onTwinSelectionChange}){')
          replace_once(cc,'  const [selectedTwinId,setSelectedTwinId]=useState("");','  const [twinSelection,setTwinSelection]=useState(()=>initialTwinSelection);')
          replace_once(cc,'  const selectedTwin=useMemo(()=>digitalTwin.find(item=>item.id===selectedTwinId)||digitalTwin[0]||null,[digitalTwin,selectedTwinId]);','''  const selectedTwin=useMemo(()=>resolveTwinSelection(digitalTwin,twinSelection),[digitalTwin,twinSelection]);
            const selectTwin=twin=>{
              const selection=twinSelectionFor(twin);
              setTwinSelection(selection);onTwinSelectionChange?.(selection);
            };
            // Remember the initial pair too: refreshing the list must not silently replace it.
            useEffect(()=>{
              if(twinSelection===null&&selectedTwin){
                const selection=twinSelectionFor(selectedTwin);
                setTwinSelection(selection);onTwinSelectionChange?.(selection);
              }
            },[twinSelection,selectedTwin,onTwinSelectionChange]);''')
          replace_once(cc,'className={selectedTwin?.id===item.id?"active":""} onClick={()=>setSelectedTwinId(item.id)}','className={selectedTwin?.id===item.id&&selectedTwin?.companyId===item.companyId?"active":""} onClick={()=>selectTwin(item)}')
          replace_once(cc,'        {selectedTwin&&<div className="ai-full-twin-areas">','        {twinSelection!==null&&!selectedTwin&&<div className="ai-command-problem-error" role="alert" data-ai-twin-selection-unavailable="true"><AlertTriangle/>Το επιλεγμένο κατάστημα δεν είναι πλέον διαθέσιμο. Επίλεξε ξανά κατάστημα.</div>}\n        {selectedTwin&&<div className="ai-full-twin-areas">')
          replace_once(parent,'  const [showAiCommandCenter,setShowAiCommandCenter]=useState(false);','  const [showAiCommandCenter,setShowAiCommandCenter]=useState(false);\n  const [aiTwinSelection,setAiTwinSelection]=useState(null);')
          replace_once(parent,'    setUser(null);setData(null);setShowSecurity(false);if(clearError)setError("");','    setUser(null);setData(null);setShowSecurity(false);setAiTwinSelection(null);if(clearError)setError("");')
          replace_once(parent,'      request={request} companies={data?.companies||[]} loading={loading}\n      onClose={()=>setShowAiCommandCenter(false)}','      request={request} companies={data?.companies||[]} loading={loading}\n      initialTwinSelection={aiTwinSelection} onTwinSelectionChange={setAiTwinSelection}\n      onClose={()=>setShowAiCommandCenter(false)}')
          checkpoint=Path('CHECKPOINTS/CHANGES/2026-10-10-n40-selection-guard.md')
          assert not checkpoint.exists()
          stamp=datetime.now(ZoneInfo('Europe/Athens')).isoformat(timespec='seconds')
          note=f'''## {stamp} — N40-SELECTION-GUARD-20261010 / SOURCE / AWAITING CI AND LAB

          Same logical owner codex/n40-full-twin-navigation-audit-20261010; implementation branch fix/n40-twin-selection-20261010. Claim PR2040 merged0618764ab1beb13e1047780ef9bdc41d59a17dfc after exact head CI38036258928 SUCCESS. First causal selection patch only: exact company/store pair, latched initial selection, fail-closed unavailable message with no six-domain actions, in-memory parent retention across Command Center close/manual reopen and reset on session clearing. No silent first-store fallback for remembered invalid selection. No new persistence, token mechanism, API, authorization, business action, CSS redesign or device change. Local dependency-free Node22 helper tests8/8 PASS; Node20 mounted real-parent tests and existing CC regressions run separately below. Not authenticated LAB or visual acceptance.

          Residual OPEN: explicit selected-store handoff for POS/EFTPOS/Cash, automatic return from all destinations, same-tab Stock support-navigation return, data-source races, server role/module/revocation breadth and all six authenticated LAB transition tests. Manual reopen retention is not automatic return or full page reload persistence. Visual phases1–14 and all other owners remain protected. Central PDFs preserve other owners latest reports; candidate generation from prior claim succeeded but publication still PENDING. Checkpoint CHECKPOINTS/CHANGES/2026-10-10-n40-selection-guard.md. No manual PASS.
          '''
          note='\n'.join(line[10:] if line.startswith('          ') else line for line in note.splitlines()).rstrip()+'\n'
          checkpoint.write_text('# N40 selection guard and remount retention\n\n'+note)
          for name in ['docs/roadmap/OPEN_WORK_TRACKER.md','CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md','docs/roadmap/PENDING_WORK.md']:
              p=Path(name); before=p.read_text(); assert 'N40-SELECTION-GUARD-20261010' not in before
              p.write_text(before.rstrip()+'\n\n'+note)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install existing workspace dependencies without production configuration
        run: npm install --no-audit --no-fund
      - name: Test the real components and protected Command Center regressions
        run: |
          set -o pipefail
          node --test server/test/ai-command-twin-selection.test.js server/test/ai-command-twin-selection-ui.test.js server/test/super-admin-ai-command-center-phase1.test.js | tee "$RUNNER_TEMP/n40-focused.log"
      - name: Publish tested patch to the source branch only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHECKPOINTS/CHANGES/2026-10-10-n40-selection-guard.md')
          p.write_text(p.read_text()+'\n## Isolated Node20 focused execution\n\nThe preparation runner executed both new selection suites, including the real mounted PlatformAdminApp/AiCommandCenter with fixture APIs/panels, plus the existing Command Center phase regression suite. The focused command passed; exact assertions/counts are in n40-focused.log. Standard full repository CI, production deployment and authenticated LAB remain NOT TESTED at this commit. This is synthetic runtime evidence only, not server authorization or real store acceptance.\n')
          PY
          git rm .github/workflows/n40-selection-prepare-20261010.yml
          git add client/src/components/platform/AiCommandCenter.jsx client/src/components/platform/PlatformAdminApp.jsx CHECKPOINTS/CHANGES/2026-10-10-n40-selection-guard.md docs/roadmap/OPEN_WORK_TRACKER.md CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md docs/roadmap/PENDING_WORK.md
          git diff --cached --check -- '*.js' '*.jsx' '*.md' '*.yml'
          git commit -m 'fix(n40): preserve exact Twin selection and block stale-store fallback'
          git push origin HEAD:refs/heads/fix/n40-twin-selection-20261010
      - name: Export review evidence without dependencies or credentials
        if: always()
        run: |
          git diff origin/main -- client/src/components/platform/AiCommandCenter.jsx client/src/components/platform/PlatformAdminApp.jsx client/src/components/platform/ai-command-twin-selection.js server/test/ai-command-twin-selection*.test.js > "$RUNNER_TEMP/n40-source.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/n40-source-revision.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/n40-source-review.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n40-selection-review
          path: |
            ${{ runner.temp }}/n40-focused.log
            ${{ runner.temp }}/n40-source.patch
            ${{ runner.temp }}/n40-source-revision.txt
            ${{ runner.temp }}/n40-source-review.tar.gz
          retention-days: 1
