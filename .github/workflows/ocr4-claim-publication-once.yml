name: OCR4 one-use claim publication
on:
  push:
    branches: [docs/ocr4-pdf-total-safety-20261105]
    paths: [.github/workflows/ocr4-claim-publication-once.yml]
permissions:
  contents: write
concurrency:
  group: ocr4-claim-publication-20261105
  cancel-in-progress: false
jobs:
  prepare-documents:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app' && github.ref == 'refs/heads/docs/ocr4-pdf-total-safety-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document-rendering dependencies only
        run: python -m pip install 'reportlab>=4,<5' 'PyMuPDF>=1.24,<2'
      - name: Preserve complete registries and prepend exact bounded claim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          registry={
            'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md':'80c1df45af001806ea30365f324994eacdefcea8',
            'docs/roadmap/OPEN_WORK_TRACKER.md':'5f92c1f4e4f88d781e5bc5e22882bd351bb5a03b',
            'docs/roadmap/PENDING_WORK.md':'70d348568067ee040cef33e3f59249bc55e67b46',
          }
          checkpoint=Path('CHECKPOINTS/CHANGES/2026-11-05-ocr4-pdf-total-safety-claim.md')
          checkpoint_bytes=checkpoint.read_bytes()
          prefix=checkpoint_bytes.split(b'## Publication preparation\n',1)[0]
          assert prefix.startswith(b'## 05/11/2026 - INVOICE-PDF-TOTAL-SAFETY-01')
          assert prefix.endswith(b'\n\n')
          # Check ALL newly written text, but never clean old historical bytes.
          # Huge repeated registries can make Git align old whitespace as additions.
          for number,line in enumerate(checkpoint_bytes.splitlines(),1):
            assert line.rstrip(b' \t')==line,('new checkpoint trailing whitespace',number)
            assert not line.startswith((b'<<<<<<< ',b'=======',b'>>>>>>> ')),('new conflict marker',number)
          def blob(data):
            return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          out=Path('/tmp/ocr4-review');out.mkdir(exist_ok=False)
          receipt={'base_main':'6f30ba0c6255d808458992bb7d23f3cea5668409','kind':'DOCUMENTATION_ONLY','registries':{},'runtime_changed':False,'lab_performed':False,'provider_called':False,'new_text_whitespace_verified':True,'historical_whitespace_preserved':True}
          originals={}
          for name,expected in registry.items():
            data=Path(name).read_bytes();assert blob(data)==expected,(name,'changed input')
            assert b'INVOICE-PDF-TOTAL-SAFETY-01' not in data,(name,'duplicate claim')
            originals[name]=data
          for name,data in originals.items():
            before=out/'before'/name;before.parent.mkdir(parents=True,exist_ok=True);before.write_bytes(data)
            changed=prefix+data;Path(name).write_bytes(changed)
            assert Path(name).read_bytes()[len(prefix):]==data
            after=out/'after'/name;after.parent.mkdir(parents=True,exist_ok=True);after.write_bytes(changed)
            receipt['registries'][name]={'before_blob':blob(data),'after_blob':blob(changed),'old_bytes':len(data),'new_bytes':len(changed),'prefix_bytes':len(prefix),'old_suffix_preserved':True}
          copies=[
            'AGENTS.md',str(checkpoint),'docs/manual/invoices/PASS.md',
            'docs/roadmap/NUMBERED_WORK_CHECKLIST_2026-10-06.md',
            'docs/roadmap/generate-open-work-tracker.py',
            'CHECKPOINTS/CHANGES/2026-11-04-invoice-header-timing.md',
            'CHECKPOINTS/CHANGES/2026-11-05-invoice-fast-low-reasoning.md',
            'server/src/routes/commerce-pos-v244.js',
            'server/src/lib/pos-fast-header-timing.js',
            'server/src/lib/invoice-total-reading.js',
            'server/src/invoice-line-reconciliation.js',
            'server/src/services/ai-wallet-invoice-metering.js',
            'server/test/pos-fast-header-latency.test.js',
            'server/test/pos-fast-header-timing.test.js',
            'client/src/lib/invoice-v244.js',
            'client/src/lib/invoice-v244-safe.js',
            'client/src/lib/invoice-v244-core.js',
            'CHECKPOINTS/EVIDENCE/invoice-physical-pages-20261102/fixtures/two-physical-pages.pdf',
          ]
          for name in copies:
            data=Path(name).read_bytes();dst=out/'source'/name;dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(data)
          for name in ['docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf','output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf']:
            data=Path(name).read_bytes();dst=out/'before'/name;dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(data)
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Regenerate existing tracker PDF and verify content
        shell: bash
        run: |
          set -euo pipefail
          python docs/roadmap/generate-open-work-tracker.py
          cp output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf
          python - <<'PY'
          from pathlib import Path
          import fitz,json,hashlib
          root=Path('/tmp/ocr4-review');receipt=json.loads((root/'receipt.json').read_text())
          names=['docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf','output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf']
          data=Path(names[0]).read_bytes();assert data==Path(names[1]).read_bytes()
          doc=fitz.open(stream=data,filetype='pdf');assert len(doc)>0
          assert 'INVOICE-PDF-TOTAL-SAFETY-01' in ''.join(p.get_text() for p in doc[:3])
          for name in names:
            dst=root/'after'/name;dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(data)
          for page in sorted(set([0,min(1,len(doc)-1),len(doc)-1])):
            doc[page].get_pixmap(matrix=fitz.Matrix(1.25,1.25)).save(str(root/f'after-page-{page+1}.png'))
          receipt['pdf']={'pages':len(doc),'sha256':hashlib.sha256(data).hexdigest(),'two_copies_equal':True,'claim_text_present':True,'visual_review':'PENDING_HUMAN_OR_ASSISTANT_REVIEW'}
          (root/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Remove one-use workflow and restrict final diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ocr4-claim-publication-once.yml
          python - <<'PY'
          import subprocess
          expected={
            '.github/workflows/ocr4-claim-publication-once.yml',
            'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md',
            'docs/roadmap/OPEN_WORK_TRACKER.md',
            'docs/roadmap/PENDING_WORK.md',
            'docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf',
            'output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==expected,(changed,expected)
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()
          PY
          # The new prefix/checkpoint were checked above; historical suffixes
          # are byte-verified. This temporary runner changes no normal CI gate.
          git diff --check -- .github/workflows/ocr4-claim-publication-once.yml CHECKPOINTS/CHANGES/2026-11-05-ocr4-pdf-total-safety-claim.md
      - uses: actions/upload-artifact@v4
        with:
          name: ocr4-claim-complete-review
          path: /tmp/ocr4-review
          retention-days: 7
          if-no-files-found: error
      - name: Commit documents only to the same isolated publication branch
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=docs/ocr4-pdf-total-safety-20261105
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md docs/roadmap/OPEN_WORK_TRACKER.md docs/roadmap/PENDING_WORK.md docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf .github/workflows/ocr4-claim-publication-once.yml
          git commit -m 'docs(invoice): synchronize OCR4 pre-source claim, preserve all registry suffixes and regenerate tracker PDFs'
          git push origin "HEAD:refs/heads/$branch"
