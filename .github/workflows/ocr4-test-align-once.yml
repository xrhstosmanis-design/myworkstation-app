name: OCR4 verified legacy test alignment
on:
  push:
    branches: [staging/ocr4-multipage-test-align-20261105]
    paths: [.github/workflows/ocr4-test-align-once.yml]
permissions:
  contents: write
jobs:
  align-and-verify:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app' && github.ref == 'refs/heads/staging/ocr4-multipage-test-align-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source and existing failing assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 2b1b18c2bd30b74ac490fe781636de05dc95ee36
          test "$(git ls-remote origin refs/heads/fix/ocr4-pdf-total-safety-20261105 | cut -f1)" = 2b1b18c2bd30b74ac490fe781636de05dc95ee36
          mkdir /tmp/ocr4-test-align
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/ocr4-test-align');name='server/test/pos-invoice-multipage-upload-v1.test.js';b=Path(name).read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='7bd1c5f087f7d74762db88ce37ac196d8aaaef41'
          runtime=Path('server/src/routes/commerce-pos-v244.js').read_bytes();assert hashlib.sha256(runtime).hexdigest()=='32e1f56f985603aaa7c819a490c9dc2d846884c0c43dbd7e4f22f8fd9d5653e8'
          (root/'before.test.js').write_bytes(b)
          for p in ['CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md','docs/roadmap/OPEN_WORK_TRACKER.md','docs/roadmap/PENDING_WORK.md']:
            dest=root/'before'/p;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(Path(p).read_bytes())
          (root/'receipt.json').write_text(json.dumps({'base':'2b1b18c2bd30b74ac490fe781636de05dc95ee36','runtime_sha256':hashlib.sha256(runtime).hexdigest(),'test_before_blob':'7bd1c5f087f7d74762db88ce37ac196d8aaaef41','scope':'Existing static expectation alignment only; runtime unchanged; not release or OCR acceptance.'},indent=2)+'\n')
          PY
      - name: Install declared dependencies without lifecycle or manifest changes
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false --no-save
      - name: Reproduce the exact remaining legacy assertion
        shell: bash
        run: |
          set -euo pipefail
          status=0
          node --test server/test/pos-fast-header-latency.test.js server/test/pos-fast-header-timing.test.js server/test/pos-fast-handoff-recovery-v1.test.js server/test/pos-fast-header-pdf-total-safety.test.js server/test/pos-fast-header-pdf-real-helpers.test.js server/test/pos-fast-header-pdf-timing-shared.test.js server/test/pos-invoice-multipage-upload-v1.test.js > /tmp/ocr4-test-align/before.tap 2>&1 || status=$?
          test "$status" = 1
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/ocr4-test-align/before.tap').read_text()
          stats={k:int(re.search(r'^# '+k+r' (\d+)$',text,re.M)[1]) for k in ['tests','pass','fail','skipped','cancelled']}
          assert stats=={'tests':325,'pass':324,'fail':1,'skipped':0,'cancelled':0},stats
          failures=re.findall(r'^not ok \d+ - (.+)$',text,re.M)
          assert failures==['MANTZILAS FAST total uses the balanced VAT summary and ignores the account balance'],failures
          print(stats,failures)
          PY
      - name: Preserve parser proof and require the guarded production assignment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('server/test/pos-invoice-multipage-upload-v1.test.js');s=p.read_text()
          old=r'  assert.match(wrapper,/verifiedVatSummaryTotal=recoverVatSummaryInvoiceTotal\(azureRawText\)/);'
          new=r'''  const headerStart=wrapper.indexOf('router.post("/ai-reader/fast-header"');
            const headerEnd=wrapper.indexOf('\nrouter.post("/ai-reader/fast-duplicate-check"',headerStart);
            assert.ok(headerStart>=0&&headerEnd>headerStart);
            const header=wrapper.slice(headerStart,headerEnd);
            assert.match(header,/let azureCanVerifyDocumentTotal=!isPdf;/);
            assert.match(header,/azureCanVerifyDocumentTotal=!isPdf\|\|parsed\.azurePageCount===1;/);
            assert.match(header,/const verifiedVatSummaryTotal=azureCanVerifyDocumentTotal\?recoverVatSummaryInvoiceTotal\(azureRawText\):0;/);
            // Execute the production assignment: image/known-one-page reuse remains,
            // but a balanced page footer cannot certify a multi-page or unknown PDF.
            const assignment=header.split('\n').find(line=>line.trim().startsWith('const verifiedVatSummaryTotal='));
            assert.ok(assignment);
            const readFooter=new Function('azureCanVerifyDocumentTotal','recoverVatSummaryInvoiceTotal','azureRawText',`${assignment}\nreturn verifiedVatSummaryTotal;`);
            assert.equal(readFooter(true,recoverVatSummaryInvoiceTotal,printed),318.74);
            assert.equal(readFooter(false,recoverVatSummaryInvoiceTotal,printed),0);'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='8289fce99f4c07dabf70d127201166c7412ddf0584591288d31ba03b4d7d7f46'
          PY
          node --check server/test/pos-invoice-multipage-upload-v1.test.js
          node --test server/test/pos-fast-header-latency.test.js server/test/pos-fast-header-timing.test.js server/test/pos-fast-handoff-recovery-v1.test.js server/test/pos-fast-header-pdf-total-safety.test.js server/test/pos-fast-header-pdf-real-helpers.test.js server/test/pos-fast-header-pdf-timing-shared.test.js server/test/pos-invoice-multipage-upload-v1.test.js > /tmp/ocr4-test-align/after.tap 2>&1
      - name: Record the verified cause and unchanged runtime
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re,subprocess,os
          root=Path('/tmp/ocr4-test-align');r=json.loads((root/'receipt.json').read_text())
          stats={}
          for phase in ['before','after']:
            p=root/f'{phase}.tap';text=p.read_text();stats[phase]={k:int(re.search(r'^# '+k+r' (\d+)$',text,re.M)[1]) for k in ['tests','pass','fail','skipped','cancelled']};stats[phase]['sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          assert stats['after']['pass']==stats['after']['tests']==325 and stats['after']['fail']==stats['after']['skipped']==stats['after']['cancelled']==0
          runtime=Path('server/src/routes/commerce-pos-v244.js').read_bytes();assert hashlib.sha256(runtime).hexdigest()==r['runtime_sha256']
          r.update({'results':stats,'node':subprocess.check_output(['node','--version'],text=True).strip(),'workflow_run':os.environ['RUN_ID'],'runtime_changed':False,'full_ci':'PENDING','independent_review':'PENDING','lab':'NOT_TESTED','provider_called':False,'production_deployed':False,'publication':'STAGING_BRANCH_ONLY_UNTIL_AUTHORIZED_FAST_FORWARD'})
          prefix='\n\n'.join([
            '## 05/11/2026 - INVOICE-PDF-TOTAL-SAFETY-01 / VERIFIED CI CAUSE / LEGACY TEST ALIGNED / AWAITING FULL CI',
            'Retained task4 owner /root, source PR3667. Main723b167 is already synchronized without losing peer3665. Exact downloaded raw CI logs for jobs127068324620 and127077517536 both show the same single failure: pos-invoice-multipage-upload-v1.test.js, MANTZILAS FAST total. Previous contradictory tool diagnoses remain withdrawn. Raw evidence artifact13393140796 SHA25658634e5970e05d6336322ba32e014c3246b9c960ea0dee50daec759eeb4e238e; test-before blob7bd1c5f087f7d74762db88ce37ac196d8aaaef41 verified.',
            'Cause: one historical static regex required unconditional VAT-footer reuse. The test now requires the numeric-one-page eligibility binding and guarded production assignment. All original parser/account-balance/unbalanced-footer assertions remain. The actual production assignment is also executed: eligible full-document reuse returns318.74; ineligible multi-page/unknown-page reuse returns0. No runtime edit, amount relaxation, deleted test, skip or threshold change.',
            'Complete-checkout Node20 targeted seven suites: before324PASS/1FAIL; after325PASS/0FAIL/0SKIP. Runtime SHA25632e1f56f985603aaa7c819a490c9dc2d846884c0c43dbd7e4f22f8fd9d5653e8 unchanged. Provider/database/wallet I/O simulated. This is not full native CI, independent approval or OCR/LAB acceptance. Keep source PR DRAFT until review and full exact checks.',
            'No paid provider request, invoice submission/payment, stock/fiscal operation, main change or deployment. Protect H/G, H21.959s and reserved I; no historical replay. General OCR, supplier/pages/packages/discount/VAT/EFK and latency remain OPEN. Checkpoint CHECKPOINTS/CHANGES/2026-11-05-ocr4-pdf-total-safety-source.md. Next: exact full PR/main CI and independent read-only review before guarded release and fresh no-submit LAB acceptance.'
          ])+'\n\n'
          assert all(x.rstrip()==x for x in prefix.splitlines());r['registries']={}
          for name in ['CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md','docs/roadmap/OPEN_WORK_TRACKER.md','docs/roadmap/PENDING_WORK.md']:
            p=Path(name);old=p.read_bytes();assert old==(root/'before'/name).read_bytes();new=prefix.encode()+old;p.write_bytes(new);assert p.read_bytes()[len(prefix.encode()):]==old
            r['registries'][name]={'old_suffix_preserved':True,'old_bytes':len(old),'new_bytes':len(new)}
          p=Path('CHECKPOINTS/CHANGES/2026-11-05-ocr4-pdf-total-safety-source.md');p.write_bytes(p.read_bytes()+b'\n'+prefix.encode())
          for name in ['server/test/pos-invoice-multipage-upload-v1.test.js',str(p),*r['registries']]:
            dst=root/'after'/name;dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(Path(name).read_bytes())
          (root/'receipt.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
      - name: Regenerate existing tracker PDF copies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'reportlab>=4,<5' 'PyMuPDF>=1.24,<2'
          python docs/roadmap/generate-open-work-tracker.py
          cp output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf
          python - <<'PY'
          from pathlib import Path
          import fitz,hashlib,json
          root=Path('/tmp/ocr4-test-align');r=json.loads((root/'receipt.json').read_text());names=['docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf','output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf']
          b=Path(names[0]).read_bytes();assert b==Path(names[1]).read_bytes();doc=fitz.open(stream=b,filetype='pdf');assert 'VERIFIED CI CAUSE' in ' '.join(doc[0].get_text().split())
          for n in sorted({0,1,len(doc)-1}):doc[n].get_pixmap(matrix=fitz.Matrix(1.25,1.25)).save(str(root/f'page-{n+1}.png'))
          for name in names:
            dst=root/'after'/name;dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(b)
          r['pdf']={'pages':len(doc),'sha256':hashlib.sha256(b).hexdigest(),'two_copies_equal':True,'visual_review':'PENDING'}
          text=json.dumps(r,indent=2)+'\n';(root/'receipt.json').write_text(text)
          p=Path('CHECKPOINTS/EVIDENCE/ocr4-pdf-total-safety-source-20261105/legacy-test-alignment.json');assert not p.exists();p.write_text(text)
          PY
      - name: Remove helper and verify exact staged publication paths
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ocr4-test-align-once.yml
          git add server/test/pos-invoice-multipage-upload-v1.test.js CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md CHECKPOINTS/CHANGES/2026-11-05-ocr4-pdf-total-safety-source.md CHECKPOINTS/EVIDENCE/ocr4-pdf-total-safety-source-20261105/legacy-test-alignment.json docs/roadmap/OPEN_WORK_TRACKER.md docs/roadmap/PENDING_WORK.md docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf .github/workflows/ocr4-test-align-once.yml
          python - <<'PY'
          import subprocess
          expected={'server/test/pos-invoice-multipage-upload-v1.test.js','CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md','CHECKPOINTS/CHANGES/2026-11-05-ocr4-pdf-total-safety-source.md','CHECKPOINTS/EVIDENCE/ocr4-pdf-total-safety-source-20261105/legacy-test-alignment.json','docs/roadmap/OPEN_WORK_TRACKER.md','docs/roadmap/PENDING_WORK.md','docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf','output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only','2b1b18c2bd30b74ac490fe781636de05dc95ee36'],text=True).splitlines());assert actual==expected,(actual,expected)
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()
          PY
          git diff --cached --check -- server/test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr4-verified-legacy-test-alignment
          path: /tmp/ocr4-test-align
          if-no-files-found: error
          retention-days: 14
      - name: Store verified commit only on staging branch
        shell: bash
        run: |
          set -euo pipefail
          branch=staging/ocr4-multipage-test-align-20261105
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(invoice): require PDF-safe VAT footer eligibility while retaining supplier arithmetic proof'
          git push origin "HEAD:refs/heads/$branch"
