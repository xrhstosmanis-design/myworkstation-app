name: Reconcile inventory card recovery with accepted main once
on:
  push:
    branches:
      - recovery/inventory-unknown-barcode-20261107
    paths:
      - .github/workflows/inventory-card-reconcile-main-once.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bounded local Git state
        uses: actions/checkout@v4
        with:
          ref: recovery/inventory-unknown-barcode-20261107
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            AGENTS.md
            CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md
            CHECKPOINTS/CHANGES/2026-11-07-inventory-unknown-barcode-recovery.md
            docs/roadmap/OPEN_WORK_TRACKER.md
            docs/roadmap/PENDING_WORK.md
            docs/manual/inventory/PASS.md
            .github/workflows/inventory-card-reconcile-main-once.yml
      - name: Verify original bytes and resolve only shared-list prepend
        shell: bash
        env:
          EXPECTED_PREVIOUS: "74f5e3fc80e87387d8b895cb51450f3773ef524a"
          EXPECTED_MAIN: "f0aca8f104c37be776c8a7dfc140a14cedf6bccc"
        run: |
          set -euo pipefail
          git config user.name "myworkstation-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PREVIOUS"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          export MERGE_BASE="$(git merge-base HEAD origin/main)"
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess,hashlib
          p='CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md'
          ours=Path(p).read_bytes()
          base=subprocess.check_output(['git','show',os.environ['MERGE_BASE']+':'+p])
          theirs=subprocess.check_output(['git','show','origin/main:'+p])
          for other in ['AGENTS.md','docs/roadmap/OPEN_WORK_TRACKER.md','docs/roadmap/PENDING_WORK.md','docs/manual/inventory/PASS.md']:
              if Path(other).stat().st_size<10000: raise SystemExit('Missing or truncated canonical file: '+other)
          if len(base)<100000 or not ours.endswith(base) or not theirs.endswith(base):
              raise SystemExit('Registry history differs from additive prefix model: FAIL CLOSED')
          a=ours[:-len(base)]
          b=theirs[:-len(base)]
          if not (10<=len(a)<=5000 and 10<=len(b)<=5000):
              raise SystemExit('Unexpected registry prefix length')
          if b'INVENTORY-SCAN-WORKFLOW-01' not in a or b'INVENTORY-SCAN-WORKFLOW-01' not in b:
              raise SystemExit('Unrecognized scope prefix')
          Path('/tmp/inv-ours-prefix').write_bytes(a)
          Path('/tmp/inv-main-prefix').write_bytes(b)
          Path('/tmp/inv-common-history').write_bytes(base)
          print('Validated suffix-preserving shared history; base_bytes=',len(base),'ours_added=',len(a),'main_added=',len(b))
          PY
          set +e
          git merge --no-commit --no-ff origin/main
          merge_code=$?
          set -e
          if [ "$merge_code" -ne 0 ]; then
            conflict_paths="$(git diff --name-only --diff-filter=U)"
            if [ "$conflict_paths" != "CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md" ]; then
              echo "Unexpected merge conflicts; preserving all refs, no push"
              exit 1
            fi
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md')
          a=Path('/tmp/inv-ours-prefix').read_bytes()
          b=Path('/tmp/inv-main-prefix').read_bytes()
          original=Path('/tmp/inv-common-history').read_bytes()
          merged=a+b+original
          if merged.count(original)!=1 or not merged.endswith(original):
              raise SystemExit('Original shared registry bytes not intact')
          p.write_bytes(merged)
          print('Merged both scoped prefixes and all historical bytes:',len(merged))
          PY
          git add CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md
          git rm -- .github/workflows/inventory-card-reconcile-main-once.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check -- CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md docs/roadmap/OPEN_WORK_TRACKER.md docs/roadmap/PENDING_WORK.md docs/manual/inventory/PASS.md
          git config user.name "myworkstation-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(inventory): reconcile restored filter PASS with barcode-card recovery"
          git push origin HEAD:recovery/inventory-unknown-barcode-20261107
