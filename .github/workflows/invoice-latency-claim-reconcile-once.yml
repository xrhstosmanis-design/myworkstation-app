name: Reconcile latency sample claim once
on:
  push:
    branches: [docs/invoice-latency-repeated-samples-20261105]
    paths: [.github/workflows/invoice-latency-claim-reconcile-once.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          filter: blob:none
      - run: |
          test "$(git rev-parse HEAD^)" = 00926fb14786c82256ceebded7b1b27397a9a188
          test "$(git ls-remote origin refs/heads/docs/invoice-latency-repeated-samples-20261105 | cut -f1)" = "$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install reportlab==4.4.9 pypdf==6.3.0
      - name: Reconcile exact documentation heads and remove this workflow
        shell: python
        run: |
          import subprocess,hashlib,shutil
          from pathlib import Path
          base='401f6a1f5dad3a8c5f38b65ab5d7c9115b6cee6f';ours='f089575a965b84244c132110a8ab9a3472305dfd';main='7851efe9889621553790fe920316c6b0a5bdbfcd'
          expected={'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md': 'e6c5b4e1507f5b32ef26114395e38a884eda95c5b79f11e0938edfe7e3d126f8', 'docs/roadmap/OPEN_WORK_TRACKER.md': '784a2afc6d44a5ca633affe5cc02f63546edffc4ccfd3457f527bb16f2ae494a', 'docs/roadmap/PENDING_WORK.md': '7fa3e6db0f12d13344ea5a2683538cc0d2e636e22807e23194ce61f92104e2dc'}
          subprocess.run(['git','fetch','origin',main],check=True)
          r=subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','merge','--no-commit','--no-ff',main]);assert r.returncode==1,r.returncode
          conflicts=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          pdfs={'output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf','docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf'}
          assert conflicts <= set(expected)|pdfs,conflicts
          for p,h in expected.items():
           b=subprocess.check_output(['git','show',base+':'+p]);o=subprocess.check_output(['git','show',ours+':'+p]);m=subprocess.check_output(['git','show',main+':'+p]);assert o.endswith(b) and m.endswith(b);n=o[:-len(b)]+m;assert n.endswith(m) and hashlib.sha256(n).hexdigest()==h;Path(p).write_bytes(n)
          subprocess.run(['python','docs/roadmap/generate-open-work-tracker.py'],check=True)
          shutil.copyfile('output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf','docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf')
          workflow='.github/workflows/invoice-latency-claim-reconcile-once.yml';Path(workflow).unlink()
          subprocess.run(['git','add','--',*expected,*pdfs,workflow],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U'])
          subprocess.run(['git','diff','--cached','--check','--','*.md'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','docs(invoice): preserve peer physical-page claim alongside latency sample protocol'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',main,'HEAD'],text=True).splitlines();assert len(changed)==14 and not any(p.startswith(('.github/','server/','client/')) for p in changed),changed
          subprocess.run(['git','push','origin','HEAD:docs/invoice-latency-repeated-samples-20261105'],check=True)
