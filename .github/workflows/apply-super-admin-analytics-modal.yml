      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build client
        run: npm run build -w client

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/platform/PlatformAdminApp.jsx \
                  client/src/components/platform/SuperAdminAnalyticsCenter.jsx \
                  client/src/components/platform/super-admin-analytics.css \
                  server/e2e/super-admin-analytics-modal-source-invariants.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(platform): open filtered analytics center"
          git push origin "HEAD:${{ github.ref_name }}"
