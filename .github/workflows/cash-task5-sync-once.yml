name: Cash task 5 bounded branch synchronization
on:
  push:
    branches: [feat/cash-audit-clean-main-20261105]
    paths: ['.github/workflows/cash-task5-sync-once.yml']
permissions:
  contents: write
concurrency:
  group: cash-task5-sync-once
  cancel-in-progress: false
jobs:
  reconcile-once:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app' && github.ref == 'refs/heads/feat/cash-audit-clean-main-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact draft cash input
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            CHECKPOINTS/CHANGES
      - name: Verify, merge pinned main, preserve registry and remove helper
        env:
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, os, hashlib
          OLD_HEAD = '6f5beff4c1b1e2f467023aa966ee02d5a3ac303d'
          INPUT_PARENT = '36ba90a1173f55d4b9c5184ccbc4001f38d46324'
          MAIN = 'f81aba245787e5ecda325d81ba919ef130a44e63'
          BRANCH = 'feat/cash-audit-clean-main-20261105'
          ACTIVE = 'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md'
          WORKFLOW = '.github/workflows/cash-task5-sync-once.yml'
          EXPECTED_TREE = 'd2834448e81419e204b70a7d009440c994b51996'
          EXPECTED_REGISTRY_SHA256 = '7a6c7c78637176dc4257f1944b410d5fdc84bf2329e87827cb3bddd147af5c95'
          NEW_PREFIX = b'## 06/11/2026 \xe2\x80\x94 CASH-ADJACENT-COUNT-21 / TWO REVIEW CORRECTIONS / LOCAL VERIFICATION\n\nSame owner, draft PR #3683. Corrected stale automatic summaries after manual review and selected-period boundary ambiguity; unavailable outer context cannot produce a numeric allocation proposal. Node20 focused96/96PASS; actual panel/JWT/store authorization/route/canonical projection with synthetic sources passed Chromium desktop/mobile, zero write/provider hooks. These are isolated local checks, not hosted cash LAB or financial finality. Previous fullCI42165538303 was green only for6f5beff4; corrected head requires fresh full native CI. Pinned mainf81aba24 and every peer registry byte preserved. Next: publish the reviewed branch through the authorized connector and bounded Git synchronization, then exact CI and guarded release/hosted acceptance. Parent CASH-UNIFIED-AUDIT-15 remains OPEN. Checkpoint: CHECKPOINTS/CHANGES/2026-11-06-cash-automatic-review.md.\n\n## 06/11/2026 \xe2\x80\x94 CASH-ADJACENT-COUNT-21 / TASK 5 REVIEW CONTINUATION / SAME OWNER\n\nContinue draft PR #3683, feat/cash-audit-clean-main-20261105. Exact previous head6f5beff4 fullCI42165538303 passed all5 jobs (5940+8 native tests). Hosted automatic-check acceptance and parent financial reconciliation remain OPEN. Read-only review found stale automatic summary after manual review and selected-period boundary ambiguity; bounded corrections and isolated native/browser regression are next. Current-main f81aba24 peer records/source remain intact. Local Git publication lacks credentials; preserve full bytes and do not claim a push/release. No paid OCR, production or money/employee mutation. Checkpoint: CHECKPOINTS/CHANGES/2026-11-06-cash-automatic-review.md.\n\n'
          ALLOWED_INPUT = ['.github/workflows/cash-task5-sync-once.yml', 'CHECKPOINTS/CHANGES/2026-11-06-cash-automatic-review.md', 'CHECKPOINTS/EVIDENCE/cash-automatic-review-20261106/source-verification.json', 'client/src/components/shared/CashReconciliationPanel.jsx', 'server/src/services/cash-adjacent-counting-errors.js', 'server/test/cash-adjacent-counting-errors.test.js', 'server/test/cash-adjacent-counting-report.test.js', 'server/test/cash-reconciliation-ui.test.js']
          def git(*args):
              return subprocess.check_output(['git', *args])
          event = os.environ['EVENT_SHA']
          assert git('rev-parse', 'HEAD').decode().strip() == event, 'unexpected checkout head'
          assert git('rev-parse', 'HEAD^').decode().strip() == INPUT_PARENT, 'unexpected input parent'
          changed = sorted(git('diff', '--name-only', OLD_HEAD, 'HEAD').decode().splitlines())
          assert changed == ALLOWED_INPUT, 'unexpected publication input paths'
          subprocess.run(['git', 'fetch', '--filter=blob:none', 'origin', 'refs/heads/main:refs/remotes/origin/main', 'refs/heads/'+BRANCH+':refs/remotes/origin/cash-task5-check'], check=True)
          assert git('rev-parse', 'refs/remotes/origin/main').decode().strip() == MAIN, 'main advanced; stop for review'
          assert git('rev-parse', 'refs/remotes/origin/cash-task5-check').decode().strip() == event, 'cash branch advanced; stop for review'
          base = git('merge-base', OLD_HEAD, MAIN).decode().strip()
          original = git('show', base+':'+ACTIVE)
          ours = git('show', OLD_HEAD+':'+ACTIVE)
          theirs = git('show', MAIN+':'+ACTIVE)
          assert ours.endswith(original) and theirs.endswith(original), 'registry histories are not additive'
          merged = NEW_PREFIX + ours[:-len(original)] + theirs
          assert merged.endswith(theirs), 'main registry suffix changed'
          assert hashlib.sha256(merged).hexdigest() == EXPECTED_REGISTRY_SHA256, 'registry does not match locally verified bytes'
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          result = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', MAIN])
          conflicts = git('diff', '--name-only', '--diff-filter=U').decode().splitlines()
          assert result.returncode in (0, 1) and set(conflicts) <= {ACTIVE}, 'unexpected merge conflict'
          assert git('rev-parse', 'MERGE_HEAD').decode().strip() == MAIN, 'expected merge state absent'
          Path(ACTIVE).write_bytes(merged)
          subprocess.run(['git', 'add', '--', ACTIVE], check=True)
          subprocess.run(['git', 'rm', '--', WORKFLOW], check=True)
          assert not git('diff', '--name-only', '--diff-filter=U').strip(), 'unresolved conflict'
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = git('write-tree').decode().strip()
          assert tree == EXPECTED_TREE, 'final tree differs from reviewed local tree'
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'chore(cash): preserve current main and sync task 5 review checkpoint'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/'+BRANCH], check=True)
          print('Verified tree:', tree)
          print('Published branch commit:', git('rev-parse', 'HEAD').decode().strip())
          print('Preserved current-main registry bytes:', len(theirs))
          PY
