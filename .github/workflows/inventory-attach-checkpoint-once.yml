name: Inventory attachment one-time checkpoint
on:
  push:
    branches:
      - recovery/inventory-product-attach-20261107
    paths:
      - .github/workflows/inventory-attach-checkpoint-once.yml
permissions:
  contents: write
jobs:
  retain-shared-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/inventory-product-attach-20261107
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            AGENTS.md
            CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md
            CHECKPOINTS/CHANGES/2026-11-07-inventory-product-attach-recovery.md
            docs/roadmap/OPEN_WORK_TRACKER.md
            docs/roadmap/PENDING_WORK.md
            .github/workflows/inventory-attach-checkpoint-once.yml
      - name: Verify complete original registries and prepend scoped OPEN entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          active=Path('CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md')
          tracker=Path('docs/roadmap/OPEN_WORK_TRACKER.md')
          pending=Path('docs/roadmap/PENDING_WORK.md')
          checkpoint=Path('CHECKPOINTS/CHANGES/2026-11-07-inventory-product-attach-recovery.md')
          guide=Path('AGENTS.md')
          for p in (active,tracker,pending,checkpoint,guide):
              if not p.is_file() or p.stat().st_size==0:
                  raise SystemExit('Missing authoritative file: '+str(p))
          before=active.read_bytes()
          if len(before)<100000 or b'INVENTORY-SCAN-WORKFLOW-01' not in before:
              raise SystemExit('Unexpected active-list structure: preserve original without changing it')
          if b'INVENTORY-SCAN-WORKFLOW-01' not in tracker.read_bytes():
              raise SystemExit('Tracker owner/work scope not verified; stop')
          if not guide.read_bytes().startswith(b'##'):
              raise SystemExit('AGENTS.md not verified; stop')
          marker='07/11/2026 — INVENTORY-SCAN-WORKFLOW-01 · recovery #3692'.encode('utf-8')
          if marker not in before:
              entry=(marker.decode('utf-8')+
                 ' — Owner /root unchanged. Draft recovery branch from main; safe original-DRAFT product attachment candidate, both-grant checks and replay tests; full CI and measured LAB NOT TESTED; attachment #3692 awaits fresh CI, review and measured LAB. Checkpoint: CHECKPOINTS/CHANGES/2026-11-07-inventory-product-attach-recovery.md. Do not repeat accepted Enter/filter counts.\n\n').encode('utf-8')
              active.write_bytes(entry+before)
              if not active.read_bytes().endswith(before):
                  raise SystemExit('Original active-list history was not preserved exactly')
          PY
          git rm -- .github/workflows/inventory-attach-checkpoint-once.yml
          git add CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md
          git diff --cached --check
          git config user.name "myworkstation-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "docs(inventory): preserve full active list and record recovery checkpoint"
          git push origin HEAD:recovery/inventory-product-attach-20261107
