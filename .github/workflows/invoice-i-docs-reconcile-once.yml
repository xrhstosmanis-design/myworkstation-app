name: Reconcile invoice I documentation once
on:
  push:
    branches: [docs/invoice-header-i-result-20261105]
    paths: [.github/workflows/invoice-i-docs-reconcile-once.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.ref == 'refs/heads/docs/invoice-header-i-result-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          filter: blob:none
      - name: Verify exact parent and branch lease
        run: |
          test "$(git rev-parse HEAD^)" = a1663c1bb9d5128241043a273bd35506976e7810
          test "$(git ls-remote origin refs/heads/docs/invoice-header-i-result-20261105 | cut -f1)" = "$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 2618f358a9d6613d6d6044cc9d9253c0c345792e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install reportlab==4.4.9 pypdf==6.3.0
      - name: Preserve both complete registry histories, regenerate tracker and remove this workflow
        shell: python
        run: |
          import subprocess,base64,zlib,json,hashlib,shutil
          from pathlib import Path
          p=json.loads(zlib.decompress(base64.b64decode('')))
          main='2618f358a9d6613d6d6044cc9d9253c0c345792e'
          base='b7c75d4ec908919acaa21d967ae81f29b4d6aadf'
          ours='31e26ab324a1e107fabf5078586c0aac6e981ed1'
          subprocess.run(['git','fetch','origin',main],check=True)
          res=subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','merge','--no-commit','--no-ff',main])
          assert res.returncode==1,res.returncode
          conflicts=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          assert conflicts==set(p['registry']+['output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf']),conflicts
          for path in p['registry']:
           old=subprocess.check_output(['git','show',base+':'+path]);o=subprocess.check_output(['git','show',ours+':'+path]);m=subprocess.check_output(['git','show',main+':'+path])
           assert o.endswith(old) and m.endswith(old),path
           new=o[:-len(old)]+m;assert new.endswith(m);Path(path).write_bytes(new)
          cp=Path(p['checkpoint']);cp.write_text(cp.read_text()+p['append'])
          for path,sha in p['hashes'].items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==sha,path
          subprocess.run(['python','docs/roadmap/generate-open-work-tracker.py'],check=True)
          shutil.copyfile('output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf','docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf')
          Path('.github/workflows/invoice-i-docs-reconcile-once.yml').unlink()
          subprocess.run(['git','add','--',*p['registry'],p['checkpoint'],'output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf','docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf','.github/workflows/invoice-i-docs-reconcile-once.yml'],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U']), 'unresolved conflicts'
          subprocess.run(['git','diff','--cached','--check','--','*.md'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','docs(invoice): reconcile measured I publication with current task3 records'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',main,'HEAD'],text=True).splitlines()
          assert len(changed)==12 and not any(x.startswith(('.github/','server/','client/')) for x in changed),changed
          subprocess.run(['git','push','origin','HEAD:docs/invoice-header-i-result-20261105'],check=True)
