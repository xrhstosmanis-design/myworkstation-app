name: Cash task 5 bounded release receipt
on:
  push:
    branches: [docs/cash-task5-release-20261106]
    paths: ['.github/workflows/cash-task5-release-receipt-once.yml']
permissions:
  contents: write
concurrency:
  group: cash-task5-release-receipt-once
  cancel-in-progress: false
jobs:
  preserve-once:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app' && github.ref == 'refs/heads/docs/cash-task5-release-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact receipt input
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            CHECKPOINTS/CHANGES
            CHECKPOINTS/EVIDENCE/cash-automatic-review-20261106
      - name: Preserve all registry bytes and remove helper
        env:
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, os, hashlib
          MAIN = 'a4e0b020a0fd444892133a5a6399df9ed359bf71'
          BRANCH = 'docs/cash-task5-release-20261106'
          ACTIVE = 'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md'
          WORKFLOW = '.github/workflows/cash-task5-release-receipt-once.yml'
          INPUT_PATHS = ['.github/workflows/cash-task5-release-receipt-once.yml', 'CHECKPOINTS/CHANGES/2026-11-06-cash-automatic-review.md', 'CHECKPOINTS/EVIDENCE/cash-automatic-review-20261106/release-receipt.json']
          FINAL_PATHS = ['CHECKPOINTS/CHANGES/2026-11-06-cash-automatic-review.md', 'CHECKPOINTS/EVIDENCE/cash-automatic-review-20261106/release-receipt.json', 'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md']
          EXPECTED_TREE = '8faea2771f7ce5dc80a527788d3cbea951e1ee37'
          ORIGINAL_SHA256 = '7a6c7c78637176dc4257f1944b410d5fdc84bf2329e87827cb3bddd147af5c95'
          FINAL_SHA256 = '35f6de4cf90587b90f25c5c4c0dfaf7a80b7f035f8edcfc4b2c440927ecd142d'
          PREFIX = '## 06/11/2026 — CASH-ADJACENT-COUNT-21 / APPROVED RELEASE VERIFIED / AWAITING LAB\n\nSame owner; PR #3683 merged as a4e0b020a0fd444892133a5a6399df9ed359bf71 after explicit owner approval. Exact source CI42274917114 and exact main CI42277948014 passed all five jobs / 5960 tests. Automatic guarded Render deployment42280068079 succeeded 19:32:17 UTC; independent health20:01:02 UTC returned ok:true on the same revision. Native login advanced to 2FA, then secure-auth/state/fresh-tab browser calls timed out; authenticated cash acceptance NOT TESTED, authentication outcome UNKNOWN. No cash automatic-check action observed. No paid OCR, review/offset, money/employee adjustment or email. Same task and parent CASH-UNIFIED-AUDIT-15 remain OPEN; prior scoped basic/full PASS protected. Next restore observable native access, refresh LAB baseline and perform the approved read-only no-charge check once. This entry supersedes older delivery-only DRAFT/awaiting-CI notes below. Checkpoint: CHECKPOINTS/CHANGES/2026-11-06-cash-automatic-review.md. Evidence: CHECKPOINTS/EVIDENCE/cash-automatic-review-20261106/release-receipt.json.\n\n'
          def git(*args):
              return subprocess.check_output(['git', *args])
          event = os.environ['EVENT_SHA']
          assert git('rev-parse', 'HEAD').decode().strip() == event
          assert git('rev-parse', 'HEAD^').decode().strip() == MAIN
          assert sorted(git('diff', '--name-only', MAIN, 'HEAD').decode().splitlines()) == INPUT_PATHS
          subprocess.run(['git', 'fetch', '--filter=blob:none', 'origin', 'refs/heads/main:refs/remotes/origin/main', 'refs/heads/'+BRANCH+':refs/remotes/origin/cash-release-check'], check=True)
          assert git('rev-parse', 'refs/remotes/origin/main').decode().strip() == MAIN, 'main advanced; stop for review'
          assert git('rev-parse', 'refs/remotes/origin/cash-release-check').decode().strip() == event, 'branch advanced; stop for review'
          original = git('show', MAIN+':'+ACTIVE)
          assert hashlib.sha256(original).hexdigest() == ORIGINAL_SHA256
          result = PREFIX.encode() + original
          assert result.endswith(original) and hashlib.sha256(result).hexdigest() == FINAL_SHA256
          Path(ACTIVE).write_bytes(result)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--', ACTIVE], check=True)
          subprocess.run(['git', 'rm', '--', WORKFLOW], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check', MAIN], check=True)
          assert sorted(git('diff', '--cached', '--name-only', MAIN).decode().splitlines()) == FINAL_PATHS
          assert git('write-tree').decode().strip() == EXPECTED_TREE, 'unreviewed tree'
          subprocess.run(['git', 'commit', '-m', 'docs(cash): preserve registry and record approved installation'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/'+BRANCH], check=True)
          print('Verified tree:', EXPECTED_TREE)
          print('Published commit:', git('rev-parse', 'HEAD').decode().strip())
          print('Preserved registry bytes:', len(original))
          PY
