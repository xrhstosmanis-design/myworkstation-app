name: Deploy MyWorkStation to Render

on:
  workflow_run:
    workflows: ["MyWorkStation CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve revision
        id: revision
        env:
          WORKFLOW_REVISION: ${{ github.event.workflow_run.head_sha }}
          MANUAL_REVISION: ${{ github.sha }}
        run: |
          if [ -n "$WORKFLOW_REVISION" ]; then
            echo "sha=$WORKFLOW_REVISION" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$MANUAL_REVISION" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing GitHub Actions secret: RENDER_DEPLOY_HOOK_URL"
            echo "Create a Render Deploy Hook for service myworkstation-app and save it as this repository secret."
            exit 1
          fi

      - name: Capture rollback checkpoint
        run: |
          node <<'NODE'
          const fs=require("fs");
          (async()=>{
            const url="https://myworkstation-app.onrender.com/api/health";
            const response=await fetch(url);
            if(!response.ok)throw new Error(`Pre-deploy health failed: ${response.status}`);
            const health=await response.json();
            if(health?.ok!==true||typeof health.revision!=="string"||!health.revision.trim())throw new Error("Pre-deploy health has no rollback revision");
            const checkpoint={capturedAt:new Date().toISOString(),healthUrl:url,revision:health.revision,version:health.version||null};
            fs.writeFileSync("render-rollback-checkpoint.json",JSON.stringify(checkpoint,null,2)+"\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`### Render rollback checkpoint\n\nPrevious healthy revision: \`${health.revision}\`\n`);
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Preserve rollback checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: render-rollback-checkpoint-${{ steps.revision.outputs.sha }}
          path: render-rollback-checkpoint.json
          retention-days: 30

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for exact production revision
        env:
          EXPECTED_REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          echo "Waiting for Render revision $EXPECTED_REVISION"
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error https://myworkstation-app.onrender.com/api/health > /tmp/health.json; then
              cat /tmp/health.json
              if HEALTH_FILE=/tmp/health.json node -e 'const fs=require("fs"),h=JSON.parse(fs.readFileSync(process.env.HEALTH_FILE,"utf8"));process.exit(h.ok===true&&h.revision===process.env.EXPECTED_REVISION?0:1)'; then
                echo "Render is healthy on the expected revision."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Render did not reach expected revision $EXPECTED_REVISION in time."
          echo "Use the preserved render-rollback-checkpoint artifact to identify the previous healthy revision."
          exit 1
