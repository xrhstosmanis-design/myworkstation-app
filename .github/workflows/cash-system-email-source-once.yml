name: Cash system email bounded source publication
on:
  push:
    branches: [fix/cash-system-email-20261107]
    paths: ['.github/workflows/cash-system-email-source-once.yml']
permissions:
  contents: write
concurrency:
  group: cash-system-email-source-once
  cancel-in-progress: false
jobs:
  preserve-once:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app' && github.ref == 'refs/heads/fix/cash-system-email-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_DATE_EPOCH: '1794080047'
      PYTHONHASHSEED: '0'
      TZ: UTC
    steps:
      - name: Checkout exact documentation input
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            CHECKPOINTS/CHANGES
            CHECKPOINTS/EVIDENCE/cash-automatic-review-20261106
            docs/manual/cash-control
            docs/roadmap
            tools
            server/src/services
            server/test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documented PDF renderer
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.9
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-dejavu-core
      - name: Preserve registries, verify generated PDF and remove helper
        env:
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, os, json, hashlib, re, unicodedata, shutil
          import reportlab
          MAIN='7b40395f1313dd5cc1d3789878930e1eca56602b'
          BRANCH='fix/cash-system-email-20261107'
          WORKFLOW='.github/workflows/cash-system-email-source-once.yml'
          INPUT_PATHS=['.github/workflows/cash-system-email-source-once.yml', 'CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md', 'server/src/services/cash-reconciliation-report.js', 'server/src/services/cash-reviewed-email.js', 'server/test/cash-reconciliation-report.test.js', 'server/test/cash-reviewed-email-routes.test.js', 'server/test/cash-reviewed-email.test.js']
          FINAL_PATHS=['CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md', 'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md', 'docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf', 'docs/roadmap/OPEN_WORK_TRACKER.md', 'docs/roadmap/PENDING_WORK.md', 'output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf', 'server/src/services/cash-reconciliation-report.js', 'server/src/services/cash-reviewed-email.js', 'server/test/cash-reconciliation-report.test.js', 'server/test/cash-reviewed-email-routes.test.js', 'server/test/cash-reviewed-email.test.js']
          TEXT_SHAS={'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md': '7923fee97726cfa900a4140f3f28d5c018cdb7442a5511eefefb1323ac0de8f8', 'docs/roadmap/OPEN_WORK_TRACKER.md': 'fefb45db0ee804e7f4c6f4ba851878eb99b1f51d88943dc7c04c801a388dbab8', 'docs/roadmap/PENDING_WORK.md': '93e6418231dc4c772888ef24e3a302659da84b12e2a6c6149b2b5128e9df2f54', 'CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md': '5254b02eefd59d59a4b55867b1222407aaf7678b16d4cfcf18a6755ea35e1644', 'server/src/services/cash-reviewed-email.js': '2647328e30977a04cad18df2f1b46368fd9a8668a45ba76b030832cd6c4a9e83', 'server/src/services/cash-reconciliation-report.js': 'b0ec7eef8e9239bd3a15358f0eb0f78feb3785a2a2921bd73fc06200a01c8998', 'server/test/cash-reviewed-email.test.js': '09757c2524287eb0a466b9c18b9f86a531b4f9f7467c9258337ac00acd632f3e', 'server/test/cash-reviewed-email-routes.test.js': '45ba28fe85920be6273b98e3d701a973b903e149d7e0e026ce37f53f9eb351de', 'server/test/cash-reconciliation-report.test.js': 'c675138088481d4317233062e92865d65224bb029ad863dba9df94ede7a4dce4'}
          PREFIXES={'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md': {'prefix': '## 07/11/2026 21:34:07 Europe/Athens - CASH-UNIFIED-AUDIT-15 / SOURCE CANDIDATE / AWAITING LAB\n\nSame owner codex/cash-chat-reconciliation-20261026 with /root coordination; no transfer. Claim PR #3707 merged as 7b40395f1313dd5cc1d3789878930e1eca56602b after exact docs CI 42406315142. Implementation branch fix/cash-system-email-20261107.\n\nCandidate: native email reads the full existing no-charge report; the complete canonical envelope is checked before a private email-only basic-readiness projection. Delivered findings, canonical fingerprint/generation and arithmetic/provisional/auth/recipient guards remain authoritative. One conditional system-generated follow-up instruction supports owner/manager review; blank sender comment supported. Scheduled/public schemas and duplicate formatting stay unchanged.\n\nNode 20.20.2 focused checks: 44 PASS / 0 FAIL / 0 SKIP; injected fake mail transport only. Final independent review found no blocking issue in the five approved source/test paths. This is local source evidence only; exact source CI/release and new hosted acceptance remain pending. AWAITING LAB, no new functional/manual PASS. Preserve 03/11 source evidence, 04/11 basic/full saved-reading scoped PASS and 07/11 limited no-charge LIVE UI PASS.\n\nNo paid OCR, ledger/review/offset writes, schedules, recipient/settings changes or production email attempt. Prior outbound approval rejection remains; separate approval of exact recipients is still required. Delivery NOT TESTED / NOT SENT. Parent financial/source residuals and all peer ownership stay OPEN. Next: exact source CI/review and authorized release, then scoped native full-report/email-preview LAB parity. Checkpoint: CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md. Complete base registry suffixes retained.\n\n', 'oldSha256': '818baac4e683ae5524cda48706406df050edda9d9e6dab0c93c615bcd4b44024', 'oldBytes': 5312047, 'newSha256': '7923fee97726cfa900a4140f3f28d5c018cdb7442a5511eefefb1323ac0de8f8'}, 'docs/roadmap/OPEN_WORK_TRACKER.md': {'prefix': '## 07/11/2026 21:34:07 Europe/Athens - CASH-UNIFIED-AUDIT-15 / SOURCE CANDIDATE / AWAITING LAB\n\nSame owner codex/cash-chat-reconciliation-20261026 with /root coordination; no transfer. Claim PR #3707 merged as 7b40395f1313dd5cc1d3789878930e1eca56602b after exact docs CI 42406315142. Implementation branch fix/cash-system-email-20261107.\n\nCandidate: native email reads the full existing no-charge report; the complete canonical envelope is checked before a private email-only basic-readiness projection. Delivered findings, canonical fingerprint/generation and arithmetic/provisional/auth/recipient guards remain authoritative. One conditional system-generated follow-up instruction supports owner/manager review; blank sender comment supported. Scheduled/public schemas and duplicate formatting stay unchanged.\n\nNode 20.20.2 focused checks: 44 PASS / 0 FAIL / 0 SKIP; injected fake mail transport only. Final independent review found no blocking issue in the five approved source/test paths. This is local source evidence only; exact source CI/release and new hosted acceptance remain pending. AWAITING LAB, no new functional/manual PASS. Preserve 03/11 source evidence, 04/11 basic/full saved-reading scoped PASS and 07/11 limited no-charge LIVE UI PASS.\n\nNo paid OCR, ledger/review/offset writes, schedules, recipient/settings changes or production email attempt. Prior outbound approval rejection remains; separate approval of exact recipients is still required. Delivery NOT TESTED / NOT SENT. Parent financial/source residuals and all peer ownership stay OPEN. Next: exact source CI/review and authorized release, then scoped native full-report/email-preview LAB parity. Checkpoint: CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md. Complete base registry suffixes retained.\n\n', 'oldSha256': '96b390402588b460d30aba5141a8527bd163193a2648240be94a03117b53ea21', 'oldBytes': 4131314, 'newSha256': 'fefb45db0ee804e7f4c6f4ba851878eb99b1f51d88943dc7c04c801a388dbab8'}, 'docs/roadmap/PENDING_WORK.md': {'prefix': '## 07/11/2026 21:34:07 Europe/Athens - CASH-UNIFIED-AUDIT-15 / SOURCE CANDIDATE / AWAITING LAB\n\nSame owner codex/cash-chat-reconciliation-20261026 with /root coordination; no transfer. Claim PR #3707 merged as 7b40395f1313dd5cc1d3789878930e1eca56602b after exact docs CI 42406315142. Implementation branch fix/cash-system-email-20261107.\n\nCandidate: native email reads the full existing no-charge report; the complete canonical envelope is checked before a private email-only basic-readiness projection. Delivered findings, canonical fingerprint/generation and arithmetic/provisional/auth/recipient guards remain authoritative. One conditional system-generated follow-up instruction supports owner/manager review; blank sender comment supported. Scheduled/public schemas and duplicate formatting stay unchanged.\n\nNode 20.20.2 focused checks: 44 PASS / 0 FAIL / 0 SKIP; injected fake mail transport only. Final independent review found no blocking issue in the five approved source/test paths. This is local source evidence only; exact source CI/release and new hosted acceptance remain pending. AWAITING LAB, no new functional/manual PASS. Preserve 03/11 source evidence, 04/11 basic/full saved-reading scoped PASS and 07/11 limited no-charge LIVE UI PASS.\n\nNo paid OCR, ledger/review/offset writes, schedules, recipient/settings changes or production email attempt. Prior outbound approval rejection remains; separate approval of exact recipients is still required. Delivery NOT TESTED / NOT SENT. Parent financial/source residuals and all peer ownership stay OPEN. Next: exact source CI/review and authorized release, then scoped native full-report/email-preview LAB parity. Checkpoint: CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md. Complete base registry suffixes retained.\n\n', 'oldSha256': '0e09757c2885f5bac5ad29078f7884ae8ef0e76093e0c3a6199cba947365ab6c', 'oldBytes': 3658321, 'newSha256': '93e6418231dc4c772888ef24e3a302659da84b12e2a6c6149b2b5128e9df2f54'}}
          PDFS=['output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf', 'docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf']
          EXPECTED_PAGES=975
          EXPECTED_PDF_TEXT_SHA='c966bd9093678ef9c4d5cbdefd7a9653d797dffb095d2fa08d655ede8b8342a1'
          def git(*a):return subprocess.check_output(['git',*a])
          def sha(b):return hashlib.sha256(b).hexdigest()
          event=os.environ['EVENT_SHA']
          assert reportlab.Version=='4.4.9'
          assert git('rev-parse','HEAD').decode().strip()==event
          assert git('rev-parse','HEAD^').decode().strip()==MAIN
          assert sorted(git('diff','--name-only',MAIN,'HEAD').decode().splitlines())==INPUT_PATHS
          subprocess.run(['git','fetch','--filter=blob:none','origin','refs/heads/main:refs/remotes/origin/main','refs/heads/'+BRANCH+':refs/remotes/origin/cash-system-email-source-check'],check=True)
          assert git('rev-parse','refs/remotes/origin/main').decode().strip()==MAIN,'main advanced; stop for review'
          assert git('rev-parse','refs/remotes/origin/cash-system-email-source-check').decode().strip()==event,'branch advanced; stop for review'
          for path, spec in PREFIXES.items():
              original=git('show',MAIN+':'+path)
              assert len(original)==spec['oldBytes'] and sha(original)==spec['oldSha256']
              data=spec['prefix'].encode()+original
              assert data.endswith(original) and sha(data)==spec['newSha256']
              Path(path).write_bytes(data)
          for path, expected in TEXT_SHAS.items():assert sha(Path(path).read_bytes())==expected,path+' differs from reviewed bytes'
          subprocess.run(['python3','-c',"import reportlab.rl_config,runpy; reportlab.rl_config.invariant=1; runpy.run_path('docs/roadmap/generate-open-work-tracker.py',run_name='__main__')"],check=True)
          shutil.copyfile(PDFS[0],PDFS[1])
          assert Path(PDFS[0]).read_bytes()==Path(PDFS[1]).read_bytes()
          pdf_text=subprocess.check_output(['pdftotext','-layout',PDFS[0],'-']).decode()
          normalized=' '.join(unicodedata.normalize('NFC',pdf_text).split())
          assert sha(normalized.encode())==EXPECTED_PDF_TEXT_SHA,'PDF text differs from reviewed generation'
          info=subprocess.check_output(['pdfinfo',PDFS[0]]).decode()
          assert int(re.search(r'^Pages:\s+(\d+)',info,re.M).group(1))==EXPECTED_PAGES,'PDF pagination changed'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--sparse','--',*FINAL_PATHS],check=True)
          subprocess.run(['git','rm','--',WORKFLOW],check=True)
          subprocess.run(['git','diff','--cached','--check',MAIN,'--',*TEXT_SHAS.keys()],check=True)
          assert sorted(git('diff','--cached','--name-only',MAIN).decode().splitlines())==FINAL_PATHS
          assert not git('diff','--name-only').strip(),'unstaged changes'
          subprocess.run(['git','commit','-m','fix(cash): send the full system-generated report through native email'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+BRANCH],check=True)
          print('Published commit:',git('rev-parse','HEAD').decode().strip())
          print('Published tree:',git('rev-parse','HEAD^{tree}').decode().strip())
          print('PDF pages:',EXPECTED_PAGES)
          print('PDF SHA256:',sha(Path(PDFS[0]).read_bytes()))
          print('Verified normalized PDF text SHA256:',EXPECTED_PDF_TEXT_SHA)
          print('Preserved registry byte counts:',json.dumps({p:s['oldBytes'] for p,s in PREFIXES.items()}))
          PY
