name: Publish cash personal recipient claim once
on:
  push:
    branches: [docs/cash-test-recipient-20261108]
    paths: [.github/workflows/cash-personal-recipient-claim-once.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          tracker = Path("docs/roadmap/OPEN_WORK_TRACKER.md")
          active = Path("CHECKPOINTS/ACTIVE_WORK_2026.md")
          checkpoint = Path("CHECKPOINTS/CHANGES/2026-11-08-cash-personal-test-recipient.md")
          original_tracker = tracker.read_bytes()
          original_active = active.read_bytes()
          assert not checkpoint.exists()
          assert b"PERSONAL TEST RECIPIENT CLAIM" not in original_tracker
          assert b"| CASH-UNIFIED-AUDIT-15 |" not in original_active
          anchor = b"\n\n## "
          assert anchor in original_active
          tracker.write_bytes("## 08/11/2026 20:51:53 Europe/Athens - CASH-UNIFIED-AUDIT-15 / PERSONAL TEST RECIPIENT CLAIM\n\nRetained owner `codex/cash-chat-reconciliation-20261026` with /root coordination. Scope is a separate, server-configured test recipient bound to the authorized Super Admin account, with the same resolved address shown in the personal preview and checked again before send. Keep current fallback to the account address when no separate address is configured. Preserve owner recipients, authentication, SMTP, store/day authorization and report freshness guards.\nBranch `docs/cash-test-recipient-20261108`; base `b2b3f178d89640dd7f4f85c5436f3dd328606d79`; checkpoint `CHECKPOINTS/CHANGES/2026-11-08-cash-personal-test-recipient.md`. Preview mismatch observed; actual send NOT TESTED. Parent remains OPEN.\n\n\n".encode() + original_tracker)
          active.write_bytes(original_active.replace(anchor, b"\n" + "| 1 | CASH-UNIFIED-AUDIT-15 | retained cash owner | #3708, #3711, #3712 | Personal test recipient claim; send NOT TESTED | [Checkpoint](CHANGES/2026-11-08-cash-personal-test-recipient.md) |\n".encode() + anchor[1:], 1))
          checkpoint.write_text("# 08/11/2026 20:51:53 Europe/Athens — Cash audit personal test recipient\n\nBefore-source claim at `b2b3f178d89640dd7f4f85c5436f3dd328606d79`, branch `docs/cash-test-recipient-20261108`.\n\nRetained owner `codex/cash-chat-reconciliation-20261026` with /root coordination. Scope is a separate, server-configured test recipient bound to the authorized Super Admin account, with the same resolved address shown in the personal preview and checked again before send. Keep current fallback to the account address when no separate address is configured. Preserve owner recipients, authentication, SMTP, store/day authorization and report freshness guards.\n\nProduction personal preview on 08/11 showed the login address for the 06/11 report; the owner requested a different exact personal recipient. The preview was cancelled. Private addresses are omitted. Existing full-preview/Cancel PASS (#3712) remains scoped; delivery and new behavior are NOT TESTED.\n\nAcceptance: check authorized account binding, default fallback, rejected stale recipient and preserved owner routing with fake transport. After normal release and LAB acceptance, verify the exact recipient before a single approved native test and record provider acceptance separately from inbox receipt.\n", encoding="utf-8")
          PY
          git rm -- .github/workflows/cash-personal-recipient-claim-once.yml
          git add -- CHECKPOINTS/CHANGES/2026-11-08-cash-personal-test-recipient.md CHECKPOINTS/ACTIVE_WORK_2026.md docs/roadmap/OPEN_WORK_TRACKER.md
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs(cash): scope personal test recipient before implementation"
          git push origin HEAD:refs/heads/docs/cash-test-recipient-20261108
