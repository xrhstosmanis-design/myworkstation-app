name: Task3 isolated documentation assembly

on:
  push:
    branches: [tools/task3-document-assembly-20261105]
    paths:
      - .github/workflows/task3-document-assembly.yml
      - docs/roadmap/task3-document-assembly.py

permissions:
  contents: write

concurrency:
  group: task3-isolated-document-assembly
  cancel-in-progress: false

jobs:
  assemble-documents:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app' && github.ref == 'refs/heads/tools/task3-document-assembly-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated helper commit only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Install documentation rendering dependencies only
        run: python3 -m pip install --disable-pip-version-check reportlab==4.4.9 PyMuPDF==1.26.7
      - name: Validate helper syntax
        run: python3 -m py_compile docs/roadmap/task3-document-assembly.py
      - name: Assemble complete registries and regenerate canonical PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/task3-document-assembly
          python3 docs/roadmap/task3-document-assembly.py 2>&1 | tee /tmp/task3-document-assembly/assembly.log
      - name: Retain exact checkout and generated-document diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, runpy, shutil, subprocess
          import fitz
          out=Path('/tmp/task3-document-assembly/debug')
          out.mkdir(parents=True,exist_ok=True)
          script=Path('docs/roadmap/task3-document-assembly.py')
          shutil.copyfile(script,out/'actual-assembly-script.py')
          settings=runpy.run_path(str(script),run_name='diagnostics_only')
          expected=settings['EXPECTED']
          source=settings['SOURCE']
          paths=list(expected)+[settings['PDF'],settings['EVIDENCE']]
          metadata={'githubSha':os.environ.get('GITHUB_SHA'),'githubRef':os.environ.get('GITHUB_REF'),'checkedOutHead':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':[]}
          for path in paths:
              current=Path(path)
              if current.exists():
                  dest=out/'worktree'/path
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(current,dest)
                  raw=current.read_bytes()
                  metadata['files'].append({'path':path,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'blob':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()})
              if path in expected:
                  original=subprocess.check_output(['git','show',source+':'+path])
                  dest=out/'originals'/path
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(original)
          commands=[('staged-check',['git','diff','--cached','--check']),('staged-paths',['git','diff','--cached','--name-only']),('status',['git','status','--porcelain'])]
          for name,args in commands:
              result=subprocess.run(args,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (out/(name+'.txt')).write_text('exitCode='+str(result.returncode)+'\n'+result.stdout,encoding='utf-8')
          (out/'checkout-metadata.json').write_text(json.dumps(metadata,indent=2)+'\n')
          generator=Path('docs/roadmap/generate-open-work-tracker.py')
          shutil.copyfile(generator,out/'canonical-generator.py')
          pdf=Path(settings['PDF'])
          if pdf.exists():
              shutil.copyfile(pdf,out/'actual-generated-tracker.pdf')
              doc=fitz.open(pdf)
              first='\n'.join(doc[i].get_text() for i in range(min(4,doc.page_count)))
              (out/'first-four-pages.txt').write_text(first,encoding='utf-8')
              for i in sorted(set([0,1,2,doc.page_count-1])):
                  if 0<=i<doc.page_count:
                      doc[i].get_pixmap(matrix=fitz.Matrix(1.2,1.2)).save(out/('actual-page-%04d.png'%(i+1)))
              doc.close()
          PY
      - name: Retain generated blobs on this helper branch only
        env:
          EXPECTED_HELPER_HEAD: ${{ github.sha }}
        run: |
          set -eu
          target=refs/heads/tools/task3-document-assembly-20261105
          test "$GITHUB_REF" = "$target"
          test "$(git ls-remote origin "$target" | cut -f1)" = "$EXPECTED_HELPER_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(task3): generated lossless registry and PDF output; helper only'
          git push origin "HEAD:$target"
          git rev-parse HEAD > /tmp/task3-document-assembly/output-commit.txt
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          out=Path('/tmp/task3-document-assembly')
          paths=json.loads((out/'allowed-output-paths.json').read_text())
          rows=[]
          for path in paths:
              sha=subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
              rows.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          (out/'output-tree-entries.json').write_text(json.dumps(rows,indent=2)+'\n')
          print('TASK3_OUTPUT_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          print(json.dumps(rows,indent=2))
          PY
      - name: Preserve full documents, proof and rendered review samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task3-document-assembly
          path: /tmp/task3-document-assembly/
          if-no-files-found: error
          retention-days: 7
