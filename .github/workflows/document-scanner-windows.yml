name: Document scanner connector
on:
  pull_request:
    paths: ['tools/windows-document-scanner/**', '.github/workflows/document-scanner-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scanner:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and exercise actual loopback protocol with synthetic WIA source
        shell: pwsh
        run: dotnet run --project tools/windows-document-scanner/MyWorkStation.DocumentScanner.csproj -c Release -- --self-test
      - name: Package standalone Windows connector
        shell: pwsh
        run: |
          dotnet publish tools/windows-document-scanner/MyWorkStation.DocumentScanner.csproj -c Release -r win-x64 --self-contained true -o scanner-release
          Copy-Item tools/windows-document-scanner/README.md scanner-release/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: MyWorkStation-DocumentScanner-Windows-x64
          path: scanner-release/
          retention-days: 14
