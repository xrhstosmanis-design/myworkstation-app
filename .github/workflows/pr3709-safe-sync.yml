name: PR3709 guarded GitHub-side registry reconciliation
on:
  push:
    branches:
      - docs/ocr4-confidence-scale-claim-20261107
    paths:
      - .github/workflows/pr3709-safe-sync.yml

permissions:
  contents: write

jobs:
  reconcile-on-pr-branch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Sparse checkout without large chat transfers
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/pr3709-safe-sync.yml
            CHECKPOINTS/CHANGES/2026-11-07-ocr4-confidence-scale-claim.md
            CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md
            docs/roadmap/generate-open-work-tracker.py
            docs/roadmap/OPEN_WORK_TRACKER.md
            docs/roadmap/PENDING_WORK.md
            docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf
            output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf

      - name: Set up Python for the existing PDF generator
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate exact inputs and prepare safe registry bytes
        shell: bash
        env:
          EXPECTED_BASE_SHA: 7b40395f1313dd5cc1d3789878930e1eca56602b
          EXPECTED_MAIN_SHA: 83cee2b70b08e14acaee82bd93129c3586ca64bf
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          PR_SHA="$(git rev-parse HEAD)"
          test "$MAIN_SHA" = "$EXPECTED_MAIN_SHA" || { echo "Main moved; abort before write"; exit 1; }
          test "$PR_SHA" = "$GITHUB_SHA" || { echo "PR head mismatch"; exit 1; }
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          echo "PR_SHA=$PR_SHA" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, pathlib, subprocess
          def show(ref, path):
              return subprocess.check_output(["git", "show", f"{ref}:{path}"])
          base = os.environ["EXPECTED_BASE_SHA"]
          main = os.environ["EXPECTED_MAIN_SHA"]
          pr = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          registry = "CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md"
          old, recent, pending = (show(r, registry) for r in (base, main, pr))
          assert old and recent.endswith(old) and pending.endswith(old), "registry ancestry changed"
          current_add, claim_add = recent[:-len(old)], pending[:-len(old)]
          assert current_add.count(b"\n") == 22 and claim_add.count(b"\n") == 12, "unexpected registry insertions"
          assert claim_add.startswith(b"## 07/11/2026 17:05 Europe/Athens - OCR4-CONFIDENCE-SCALE-01")
          assert b"OCR4-CONFIDENCE-SCALE-01 / ASSIGNED / BEFORE SOURCE" not in recent
          for path in ("docs/roadmap/OPEN_WORK_TRACKER.md", "docs/roadmap/PENDING_WORK.md"):
              current, claimed = show(main, path), show(pr, path)
              assert current and claimed.endswith(current), f"main entries missing in {path}"
              assert claimed.startswith(b"## 07/11/2026 17:05 Europe/Athens - OCR4-CONFIDENCE-SCALE-01")
          claim_doc = "CHECKPOINTS/CHANGES/2026-11-07-ocr4-confidence-scale-claim.md"
          assert b"OCR4-CONFIDENCE-SCALE-01" in show(pr, claim_doc)
          combined = current_add + claim_add + old
          assert combined.endswith(old) and combined.startswith(current_add)
          assert len(combined) == len(recent) + len(claim_add)
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr3709-verified-registry.md"
          out.write_bytes(combined)
          print("PASS: all old registry bytes + 22 main + 12 claim lines; both trackers preserve main")
          PY

      - name: Regenerate and inspect PDFs in temporary runner checkout
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach "$MAIN_SHA"
          git restore --source="$PR_SHA" --staged --worktree -- \
            CHECKPOINTS/CHANGES/2026-11-07-ocr4-confidence-scale-claim.md \
            docs/roadmap/OPEN_WORK_TRACKER.md \
            docs/roadmap/PENDING_WORK.md
          cp "$RUNNER_TEMP/pr3709-verified-registry.md" CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md
          python3 -m pip install --disable-pip-version-check --quiet reportlab pypdf
          test -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          python3 docs/roadmap/generate-open-work-tracker.py
          cp output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf \
             docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          a = Path("output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf")
          b = Path("docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf")
          assert a.read_bytes() == b.read_bytes() and a.read_bytes().startswith(b"%PDF-")
          reader = PdfReader(str(a))
          assert len(reader.pages) > 0
          first = "\n".join(page.extract_text() or "" for page in reader.pages[:8])
          assert "OCR4-CONFIDENCE-SCALE-01" in first, "claim missing from PDF"
          assert "CASH-UNIFIED-AUDIT-15" in first, "current main entries missing from PDF"
          print(f"PASS: {len(reader.pages)} pages; twin PDFs identical and contain OCR and cash entries")
          PY

      - name: Check exact six-file change and push only PR branch
        shell: bash
        env:
          PR_BRANCH: docs/ocr4-confidence-scale-claim-20261107
        run: |
          set -euo pipefail
          git add -- \
            CHECKPOINTS/CHANGES/2026-11-07-ocr4-confidence-scale-claim.md \
            CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md \
            docs/roadmap/OPEN_WORK_TRACKER.md \
            docs/roadmap/PENDING_WORK.md \
            docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf \
            output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = {
              "CHECKPOINTS/CHANGES/2026-11-07-ocr4-confidence-scale-claim.md",
              "CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md",
              "docs/roadmap/OPEN_WORK_TRACKER.md",
              "docs/roadmap/PENDING_WORK.md",
              "docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf",
              "output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf",
          }
          actual = set(subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines())
          assert actual == expected, f"unexpected files: missing={expected-actual}, extra={actual-expected}"
          numstat = subprocess.check_output(["git","diff","--cached","--numstat"],text=True)
          by_path = {p:(a,d) for a,d,p in (line.split("\t",2) for line in numstat.splitlines())}
          for p in ("CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md",
                    "docs/roadmap/OPEN_WORK_TRACKER.md", "docs/roadmap/PENDING_WORK.md"):
              assert by_path[p] == ("12","0"), f"non-additive {p}: {by_path[p]}"
          print("PASS: only the six approved documentation/PDF files changed, three exact 12-line additions.")
          PY
          TREE="$(git write-tree)"
          COMMIT="$(printf '%s\n' 'docs(ocr4): reconcile claim with concurrent main registry and regenerate PDFs' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$TREE" -p "$PR_SHA" -p "$MAIN_SHA")"
          ACTUAL_PR="$(git ls-remote origin "refs/heads/$PR_BRANCH" | cut -f1)"
          ACTUAL_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$ACTUAL_PR" = "$PR_SHA" || { echo "PR changed before push; abort"; exit 1; }
          test "$ACTUAL_MAIN" = "$MAIN_SHA" || { echo "Main changed before push; abort"; exit 1; }
          git update-ref refs/heads/pr3709-verified-candidate "$COMMIT"
          git push origin "refs/heads/pr3709-verified-candidate:refs/heads/$PR_BRANCH"
          echo "PASS: safe 2-parent reconciliation commit $COMMIT pushed to Draft PR branch only."
          echo "Main and production were not written. Temporary workflow excluded from final merge tree."
