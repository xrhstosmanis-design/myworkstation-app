name: Cash email preview bounded source publication
on:
  push:
    branches: [fix/cash-email-preview-20261107]
    paths: ['.github/workflows/cash-email-preview-source-once.yml']
permissions:
  contents: write
concurrency:
  group: cash-email-preview-source-once
  cancel-in-progress: false
jobs:
  preserve-once:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app' && github.ref == 'refs/heads/fix/cash-email-preview-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_DATE_EPOCH: '1794086015'
      PYTHONHASHSEED: '0'
      TZ: UTC
    steps:
      - name: Checkout exact reviewed source input
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            CHECKPOINTS/CHANGES
            CHECKPOINTS/EVIDENCE/cash-automatic-review-20261106
            docs/manual/cash-control
            docs/roadmap
            tools
            client/src/components/platform
            server/test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documented PDF renderer
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.9
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-dejavu-core
      - name: Preserve registries, verify generated PDF and remove helper
        env:
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, os, json, hashlib, re, unicodedata, shutil
          import reportlab
          MAIN='83cee2b70b08e14acaee82bd93129c3586ca64bf'
          BASE='4b620b2928b0acb9dfdca2174c3bf4b1db1d6466'
          BRANCH='fix/cash-email-preview-20261107'
          WORKFLOW='.github/workflows/cash-email-preview-source-once.yml'
          INPUT_PATHS=['.github/workflows/cash-email-preview-source-once.yml', 'CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md', 'client/src/components/platform/CashEmailPreviewDialog.jsx', 'client/src/components/platform/PlatformAdminApp.jsx', 'client/src/components/platform/platform-admin.css', 'server/test/cash-reviewed-email-ui.test.js']
          FINAL_PATHS=['CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md', 'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md', 'client/src/components/platform/CashEmailPreviewDialog.jsx', 'client/src/components/platform/PlatformAdminApp.jsx', 'client/src/components/platform/platform-admin.css', 'docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf', 'docs/roadmap/OPEN_WORK_TRACKER.md', 'docs/roadmap/PENDING_WORK.md', 'output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf', 'server/test/cash-reviewed-email-ui.test.js']
          MAIN_FINAL_PATHS=['CHECKPOINTS/CHANGES/2026-11-07-cash-email-preview-ui.md', 'CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md', 'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md', 'client/src/components/platform/CashEmailPreviewDialog.jsx', 'client/src/components/platform/PlatformAdminApp.jsx', 'client/src/components/platform/platform-admin.css', 'docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf', 'docs/roadmap/OPEN_WORK_TRACKER.md', 'docs/roadmap/PENDING_WORK.md', 'output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf', 'server/test/automatic-cash-control-daily-v1.test.js', 'server/test/cash-reviewed-email-ui.test.js']
          TEXT_SHAS={'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md': '78044d18e2fd1c10569e3cf6beaa1b9c40d8837b23ac58d1291abdf5a17dd7f6', 'docs/roadmap/OPEN_WORK_TRACKER.md': 'c9e5b42ee565c55f7da8e2c8aa9c7c40fd0f8e3b86f14d3aacf765dd31afb4d4', 'docs/roadmap/PENDING_WORK.md': 'eb7fdd3c18c8243aadce6e30943ca3a92ccc822e65063643303ecd38cfd3b59f', 'CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md': 'ead6373231dd18e7566523e2246dab77f1a8a35730b1840eecc6abc72bf170e5', 'client/src/components/platform/PlatformAdminApp.jsx': 'bbafa200d55fe3d63f8f981c5a41f84aadc7200b0c652c86597c7cf5e33a30ae', 'client/src/components/platform/CashEmailPreviewDialog.jsx': 'e83edefade5b02b076f7853f34f2e15f1b5c8af225797d0cf84e9bc46bb9ad3b', 'client/src/components/platform/platform-admin.css': 'cb360d127ac56c759f779010916d0e8809a73bc652ee27015747a163bac2f279', 'server/test/cash-reviewed-email-ui.test.js': '53e044c53d28c57d1e2d1df3f7f1c762e41508b022e3eb32da6b4d259d16e80e'}
          PREFIXES={'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md': {'prefix': '## 07/11/2026 23:13:35 Europe/Athens - CASH-UNIFIED-AUDIT-15 / CONSOLIDATED PREVIEW UI CANDIDATE / AWAITING LAB\n\nSame retained owner codex/cash-chat-reconciliation-20261026 with /root coordination; no transfer. Existing PR #3711 history, UI note and registry prefixes retained. Consolidation uses exact remote base 4b620b2928b0acb9dfdca2174c3bf4b1db1d6466, including the complete intervening daily-contract test adaptation. The prior local baa512c candidate stayed unpublished; its old test evidence is separate. Draft/review hold on 07/11 at 21:01:44Z / 21:02:04Z changed PR metadata only.\n\nBounded additions repair captured scope/session freshness, modal focus and Escape/in-flight cancel behavior, and short-height access while preserving the full scrollable system report, visible recipients, optional blank comment and explicit Send/Cancel. Four existing client/test paths, using platform-admin.css; backend/schema/recipient authority unchanged. Preserve owner/self readiness, canonical fingerprint/generation, stale-response rejection and atomic double-submit protection. No financial/provider/schedule expansion.\n\nActual consolidated Node 20.20.2 focused suite: 67 PASS / 0 FAIL / 0 SKIP / 0 CANCEL; separate exact-remote daily contract: 11 PASS / 0 FAIL / 0 SKIP / 0 CANCEL. Initial footerless run not counted. Final independent review: NO BLOCKERS; text whitespace check clean. Local source evidence only; new exact-head CI/release and hosted full-preview acceptance remain pending. Preserve actual native-preview FAIL JSON, unchanged manual, prior scoped cash PASS and every peer byte/owner. No new functional PASS.\n\nDelivery NOT TESTED / NOT SENT; exact-recipient approval remains outstanding. Next: exact CI/review and authorized guarded release, then complete native preview/recipients/blank-comment/Cancel observation. Do not repeat the completed no-charge check or any rejected outbound action. Parent checkpoint: CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md. Ten-path increment over current remote base; complete twelve-path PR includes the retained remote UI note and daily-contract test.\n\n', 'oldSha256': 'b6a2bf6ab518b6473c9e65af1dc6a7b34377c55a861a0499e12f9a50d9a52a0f', 'oldBytes': 5317195, 'newSha256': '78044d18e2fd1c10569e3cf6beaa1b9c40d8837b23ac58d1291abdf5a17dd7f6'}, 'docs/roadmap/OPEN_WORK_TRACKER.md': {'prefix': '## 07/11/2026 23:13:35 Europe/Athens - CASH-UNIFIED-AUDIT-15 / CONSOLIDATED PREVIEW UI CANDIDATE / AWAITING LAB\n\nSame retained owner codex/cash-chat-reconciliation-20261026 with /root coordination; no transfer. Existing PR #3711 history, UI note and registry prefixes retained. Consolidation uses exact remote base 4b620b2928b0acb9dfdca2174c3bf4b1db1d6466, including the complete intervening daily-contract test adaptation. The prior local baa512c candidate stayed unpublished; its old test evidence is separate. Draft/review hold on 07/11 at 21:01:44Z / 21:02:04Z changed PR metadata only.\n\nBounded additions repair captured scope/session freshness, modal focus and Escape/in-flight cancel behavior, and short-height access while preserving the full scrollable system report, visible recipients, optional blank comment and explicit Send/Cancel. Four existing client/test paths, using platform-admin.css; backend/schema/recipient authority unchanged. Preserve owner/self readiness, canonical fingerprint/generation, stale-response rejection and atomic double-submit protection. No financial/provider/schedule expansion.\n\nActual consolidated Node 20.20.2 focused suite: 67 PASS / 0 FAIL / 0 SKIP / 0 CANCEL; separate exact-remote daily contract: 11 PASS / 0 FAIL / 0 SKIP / 0 CANCEL. Initial footerless run not counted. Final independent review: NO BLOCKERS; text whitespace check clean. Local source evidence only; new exact-head CI/release and hosted full-preview acceptance remain pending. Preserve actual native-preview FAIL JSON, unchanged manual, prior scoped cash PASS and every peer byte/owner. No new functional PASS.\n\nDelivery NOT TESTED / NOT SENT; exact-recipient approval remains outstanding. Next: exact CI/review and authorized guarded release, then complete native preview/recipients/blank-comment/Cancel observation. Do not repeat the completed no-charge check or any rejected outbound action. Parent checkpoint: CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md. Ten-path increment over current remote base; complete twelve-path PR includes the retained remote UI note and daily-contract test.\n\n', 'oldSha256': 'd30907f8bb3b17d6cf0d416b3b8947a2d24d98eff75666333af4ecddfbe95a35', 'oldBytes': 4136462, 'newSha256': 'c9e5b42ee565c55f7da8e2c8aa9c7c40fd0f8e3b86f14d3aacf765dd31afb4d4'}, 'docs/roadmap/PENDING_WORK.md': {'prefix': '## 07/11/2026 23:13:35 Europe/Athens - CASH-UNIFIED-AUDIT-15 / CONSOLIDATED PREVIEW UI CANDIDATE / AWAITING LAB\n\nSame retained owner codex/cash-chat-reconciliation-20261026 with /root coordination; no transfer. Existing PR #3711 history, UI note and registry prefixes retained. Consolidation uses exact remote base 4b620b2928b0acb9dfdca2174c3bf4b1db1d6466, including the complete intervening daily-contract test adaptation. The prior local baa512c candidate stayed unpublished; its old test evidence is separate. Draft/review hold on 07/11 at 21:01:44Z / 21:02:04Z changed PR metadata only.\n\nBounded additions repair captured scope/session freshness, modal focus and Escape/in-flight cancel behavior, and short-height access while preserving the full scrollable system report, visible recipients, optional blank comment and explicit Send/Cancel. Four existing client/test paths, using platform-admin.css; backend/schema/recipient authority unchanged. Preserve owner/self readiness, canonical fingerprint/generation, stale-response rejection and atomic double-submit protection. No financial/provider/schedule expansion.\n\nActual consolidated Node 20.20.2 focused suite: 67 PASS / 0 FAIL / 0 SKIP / 0 CANCEL; separate exact-remote daily contract: 11 PASS / 0 FAIL / 0 SKIP / 0 CANCEL. Initial footerless run not counted. Final independent review: NO BLOCKERS; text whitespace check clean. Local source evidence only; new exact-head CI/release and hosted full-preview acceptance remain pending. Preserve actual native-preview FAIL JSON, unchanged manual, prior scoped cash PASS and every peer byte/owner. No new functional PASS.\n\nDelivery NOT TESTED / NOT SENT; exact-recipient approval remains outstanding. Next: exact CI/review and authorized guarded release, then complete native preview/recipients/blank-comment/Cancel observation. Do not repeat the completed no-charge check or any rejected outbound action. Parent checkpoint: CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md. Ten-path increment over current remote base; complete twelve-path PR includes the retained remote UI note and daily-contract test.\n\n', 'oldSha256': '4a95222cdd429b01d997a00c37a841c9b88d2777ad5cdfd93499ad2a61b4e052', 'oldBytes': 3663469, 'newSha256': 'eb7fdd3c18c8243aadce6e30943ca3a92ccc822e65063643303ecd38cfd3b59f'}}
          PDFS=['output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf', 'docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf']
          EXPECTED_PAGES=976
          EXPECTED_PDF_TEXT_SHA='d61feea57752f5cd5e6d8c3b4dc97d2a194172b446a8ab113dfd1151577c81b2'
          EXPECTED_PDF_SHA='84104d685b7d3215fba48fe8859263eff28cfd12781f6658ee6e0495639243b0'
          EXPECTED_REVIEWED_TREE='af9b70813b69a2ccddcd26c92f5479c2e539cd2d'
          EXPECTED_EPOCH=1794086015
          def git(*a):return subprocess.check_output(['git',*a])
          def sha(b):return hashlib.sha256(b).hexdigest()
          event=os.environ['EVENT_SHA']
          assert reportlab.Version=='4.4.9'
          assert os.environ.get('SOURCE_DATE_EPOCH')==str(EXPECTED_EPOCH), 'PDF epoch changed'
          assert git('rev-parse','HEAD').decode().strip()==event
          assert git('rev-parse','HEAD^').decode().strip()==BASE
          assert git('merge-base',MAIN,BASE).decode().strip()==MAIN
          assert sorted(git('diff','--name-only',BASE,'HEAD').decode().splitlines())==INPUT_PATHS
          subprocess.run(['git','fetch','--filter=blob:none','origin','refs/heads/main:refs/remotes/origin/main','refs/heads/'+BRANCH+':refs/remotes/origin/cash-email-preview-source-check'],check=True)
          assert git('rev-parse','refs/remotes/origin/main').decode().strip()==MAIN,'main advanced; stop for review'
          assert git('rev-parse','refs/remotes/origin/cash-email-preview-source-check').decode().strip()==event,'branch advanced; stop for review'
          for path, spec in PREFIXES.items():
              original=git('show',BASE+':'+path)
              assert len(original)==spec['oldBytes'] and sha(original)==spec['oldSha256']
              data=spec['prefix'].encode()+original
              assert data.endswith(original) and sha(data)==spec['newSha256']
              Path(path).write_bytes(data)
          for path, expected in TEXT_SHAS.items():assert sha(Path(path).read_bytes())==expected,path+' differs from reviewed bytes'
          subprocess.run(['python3','-c',"import reportlab.rl_config,runpy; reportlab.rl_config.invariant=1; runpy.run_path('docs/roadmap/generate-open-work-tracker.py',run_name='__main__')"],check=True)
          shutil.copyfile(PDFS[0],PDFS[1])
          assert Path(PDFS[0]).read_bytes()==Path(PDFS[1]).read_bytes()
          assert sha(Path(PDFS[0]).read_bytes())==EXPECTED_PDF_SHA, 'PDF bytes differ from reviewed generation'
          pdf_text=subprocess.check_output(['pdftotext','-layout',PDFS[0],'-']).decode()
          normalized=' '.join(unicodedata.normalize('NFC',pdf_text).split())
          assert sha(normalized.encode())==EXPECTED_PDF_TEXT_SHA,'PDF text differs from reviewed generation'
          info=subprocess.check_output(['pdfinfo',PDFS[0]]).decode()
          assert int(re.search(r'^Pages:\s+(\d+)',info,re.M).group(1))==EXPECTED_PAGES,'PDF pagination changed'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--sparse','--',*FINAL_PATHS],check=True)
          subprocess.run(['git','rm','--',WORKFLOW],check=True)
          subprocess.run(['git','diff','--cached','--check',BASE,'--',*TEXT_SHAS.keys()],check=True)
          assert sorted(git('diff','--cached','--name-only',BASE).decode().splitlines())==FINAL_PATHS
          assert sorted(git('diff','--cached','--name-only',MAIN).decode().splitlines())==MAIN_FINAL_PATHS
          assert not git('diff','--name-only').strip(),'unstaged changes'
          assert not git('ls-files','--others','--exclude-standard').strip(),'untracked files'
          assert git('write-tree').decode().strip()==EXPECTED_REVIEWED_TREE,'final tree differs from reviewed tree'
          subprocess.run(['git','commit','-m','fix(cash): bind the complete native preview to its session and scope'],check=True)
          assert git('rev-parse','HEAD^{tree}').decode().strip()==EXPECTED_REVIEWED_TREE
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+BRANCH],check=True)
          print('Published commit:',git('rev-parse','HEAD').decode().strip())
          print('Published tree:',git('rev-parse','HEAD^{tree}').decode().strip())
          print('PDF pages:',EXPECTED_PAGES)
          print('PDF SHA256:',sha(Path(PDFS[0]).read_bytes()))
          print('Verified normalized PDF text SHA256:',EXPECTED_PDF_TEXT_SHA)
          print('Preserved registry byte counts:',json.dumps({p:s['oldBytes'] for p,s in PREFIXES.items()}))
          PY
