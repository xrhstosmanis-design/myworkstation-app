name: Cash email preview bounded evidence publication
on:
  push:
    branches: [docs/cash-native-email-preview-pass-20261107]
    paths: ['.github/workflows/cash-email-preview-pass-once.yml']
permissions:
  contents: write
concurrency:
  group: cash-email-preview-pass-once
  cancel-in-progress: false
jobs:
  preserve-once:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app' && github.ref == 'refs/heads/docs/cash-native-email-preview-pass-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_DATE_EPOCH: '1794090294'
      PYTHONHASHSEED: '0'
      TZ: UTC
    steps:
      - name: Checkout exact reviewed evidence input
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            CHECKPOINTS/CHANGES
            CHECKPOINTS/EVIDENCE/cash-automatic-review-20261106
            CHECKPOINTS/EVIDENCE/cash-system-email-20261107
            docs/manual/cash-control
            docs/roadmap
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documented PDF renderer
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.9
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-dejavu-core
      - name: Preserve registries, verify generated PDF and remove helper
        env:
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, os, json, hashlib, re, unicodedata, shutil
          import reportlab
          MAIN='ff4665eb8ec4b7b572ac65d792a788e48657a051'
          BRANCH='docs/cash-native-email-preview-pass-20261107'
          WORKFLOW='.github/workflows/cash-email-preview-pass-once.yml'
          INPUT_PATHS=['.github/workflows/cash-email-preview-pass-once.yml', 'CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md', 'CHECKPOINTS/EVIDENCE/cash-system-email-20261107/native-in-app-preview.json', 'docs/manual/cash-control/PASS.md']
          FINAL_PATHS=['CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md', 'CHECKPOINTS/EVIDENCE/cash-system-email-20261107/native-in-app-preview.json', 'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md', 'docs/manual/cash-control/PASS.md', 'docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf', 'docs/roadmap/OPEN_WORK_TRACKER.md', 'docs/roadmap/PENDING_WORK.md', 'output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf']
          TEXT_SHAS={'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md': '6eb750471ca51c421c5fb696db43fd0bd587c3d7393935f88f0a8c728aa584df', 'docs/roadmap/OPEN_WORK_TRACKER.md': '4435532b1a16a3cad21cf73cfff21a9383a63f29975716d4c66b6c138be31a0f', 'docs/roadmap/PENDING_WORK.md': '110b292dc3d6b80c4b3568083c9135db33468b1fcfdb0321eafade10bdd3d0b9', 'CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md': 'cbf7772d6326f19a142da4bba42dc0fab7b02db6d8fac4591a68739adee75aba', 'CHECKPOINTS/EVIDENCE/cash-system-email-20261107/native-in-app-preview.json': 'dd7a8cb1b371ae0de49d2adb358d5c56c2005bf60307ddb7b1f9695426afdea7', 'docs/manual/cash-control/PASS.md': '489b2f1107276bc45707df413f66d1d19efe37bf0ddfd1bf4701f226922314f4'}
          PREFIXES={'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md': {'prefix': '## 07/11/2026 22:24:54 UTC - CASH-UNIFIED-AUDIT-15 / FULL NATIVE PREVIEW AND CANCEL / SCOPED LIVE PASS\n\nRetained owner codex/cash-chat-reconciliation-20261026 with /root coordination; no transfer. PR #3711 merged as ff4665eb8ec4b7b572ac65d792a788e48657a051; exact PR CI 42417280001 and main CI 42418343730 passed all five jobs. Guarded deploy 42419487430 / job 128544666223 succeeded; actual health confirmed the exact revision at 07/11 22:14:28.5241665 UTC.\n\nActual native owner preview, 07/11 22:20:04.336–22:21:02.568 UTC: full rendered system report 15,141 JavaScript characters / 147 lines, declared count matched, start visible and actual end reached by native scrolling. Three full-audit pending rows, system handoff sentence and two configured recipients were visible; addresses remain private. Optional comment stayed blank. Cancel closed the dialog and restored the preview control; Send was not selected. No operator email, no-charge repetition or monetary/approval action. PASS applies only to this full native preview and Cancel.\n\nNo raw HTTP/reportHash/generation parity, independent DB/global-state/provider/SMTP/inbox proof, mobile or other-role coverage. Delivery NOT SENT / NOT TESTED; exact-recipient approval remains OUTSTANDING after prior automatic approval rejection. Parent financial/source scope OPEN / ASSIGNED. Old native-preview.json FAIL and every prior registry byte/owner remain unchanged. Manual update is scoped only to observed preview/Cancel. New sanitized evidence: CHECKPOINTS/EVIDENCE/cash-system-email-20261107/native-in-app-preview.json. Parent checkpoint: CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md. No new outbound authorization or financial closure.\n\n', 'oldSha256': '2baac337667246da602bae69fe8f956c299313edafd24c9c5ff4ea7fa5b5a641', 'oldBytes': 5321698, 'newSha256': '6eb750471ca51c421c5fb696db43fd0bd587c3d7393935f88f0a8c728aa584df'}, 'docs/roadmap/OPEN_WORK_TRACKER.md': {'prefix': '## 07/11/2026 22:24:54 UTC - CASH-UNIFIED-AUDIT-15 / FULL NATIVE PREVIEW AND CANCEL / SCOPED LIVE PASS\n\nRetained owner codex/cash-chat-reconciliation-20261026 with /root coordination; no transfer. PR #3711 merged as ff4665eb8ec4b7b572ac65d792a788e48657a051; exact PR CI 42417280001 and main CI 42418343730 passed all five jobs. Guarded deploy 42419487430 / job 128544666223 succeeded; actual health confirmed the exact revision at 07/11 22:14:28.5241665 UTC.\n\nActual native owner preview, 07/11 22:20:04.336–22:21:02.568 UTC: full rendered system report 15,141 JavaScript characters / 147 lines, declared count matched, start visible and actual end reached by native scrolling. Three full-audit pending rows, system handoff sentence and two configured recipients were visible; addresses remain private. Optional comment stayed blank. Cancel closed the dialog and restored the preview control; Send was not selected. No operator email, no-charge repetition or monetary/approval action. PASS applies only to this full native preview and Cancel.\n\nNo raw HTTP/reportHash/generation parity, independent DB/global-state/provider/SMTP/inbox proof, mobile or other-role coverage. Delivery NOT SENT / NOT TESTED; exact-recipient approval remains OUTSTANDING after prior automatic approval rejection. Parent financial/source scope OPEN / ASSIGNED. Old native-preview.json FAIL and every prior registry byte/owner remain unchanged. Manual update is scoped only to observed preview/Cancel. New sanitized evidence: CHECKPOINTS/EVIDENCE/cash-system-email-20261107/native-in-app-preview.json. Parent checkpoint: CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md. No new outbound authorization or financial closure.\n\n', 'oldSha256': '57a6e1e6b5682ee4ce7d0942ac3c95fb3bfc94c95ccd0dc978a64af28952c10b', 'oldBytes': 4140447, 'newSha256': '4435532b1a16a3cad21cf73cfff21a9383a63f29975716d4c66b6c138be31a0f'}, 'docs/roadmap/PENDING_WORK.md': {'prefix': '## 07/11/2026 22:24:54 UTC - CASH-UNIFIED-AUDIT-15 / FULL NATIVE PREVIEW AND CANCEL / SCOPED LIVE PASS\n\nRetained owner codex/cash-chat-reconciliation-20261026 with /root coordination; no transfer. PR #3711 merged as ff4665eb8ec4b7b572ac65d792a788e48657a051; exact PR CI 42417280001 and main CI 42418343730 passed all five jobs. Guarded deploy 42419487430 / job 128544666223 succeeded; actual health confirmed the exact revision at 07/11 22:14:28.5241665 UTC.\n\nActual native owner preview, 07/11 22:20:04.336–22:21:02.568 UTC: full rendered system report 15,141 JavaScript characters / 147 lines, declared count matched, start visible and actual end reached by native scrolling. Three full-audit pending rows, system handoff sentence and two configured recipients were visible; addresses remain private. Optional comment stayed blank. Cancel closed the dialog and restored the preview control; Send was not selected. No operator email, no-charge repetition or monetary/approval action. PASS applies only to this full native preview and Cancel.\n\nNo raw HTTP/reportHash/generation parity, independent DB/global-state/provider/SMTP/inbox proof, mobile or other-role coverage. Delivery NOT SENT / NOT TESTED; exact-recipient approval remains OUTSTANDING after prior automatic approval rejection. Parent financial/source scope OPEN / ASSIGNED. Old native-preview.json FAIL and every prior registry byte/owner remain unchanged. Manual update is scoped only to observed preview/Cancel. New sanitized evidence: CHECKPOINTS/EVIDENCE/cash-system-email-20261107/native-in-app-preview.json. Parent checkpoint: CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md. No new outbound authorization or financial closure.\n\n', 'oldSha256': '4de63b9ae6d106631493fe4b690c45bbbbfa03f899d6091da19252ead656356c', 'oldBytes': 3667454, 'newSha256': '110b292dc3d6b80c4b3568083c9135db33468b1fcfdb0321eafade10bdd3d0b9'}}
          PDFS=['output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf', 'docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf']
          EXPECTED_PAGES=977
          EXPECTED_PDF_TEXT_SHA='47e3cc2014d0babd4b4d1dead32b73f8c80a535dd9e78258c803ad817da62657'
          EXPECTED_PDF_SHA='98eae69048fc46454f08f174d4453fdd6c81b2a91e82e754b6a2cfaf7bcbedc2'
          EXPECTED_REVIEWED_TREE='3d5502e7a86dc95fc9645f577821e05334bd0a11'
          EXPECTED_EPOCH=1794090294
          def git(*a):return subprocess.check_output(['git',*a])
          def sha(b):return hashlib.sha256(b).hexdigest()
          event=os.environ['EVENT_SHA']
          assert reportlab.Version=='4.4.9'
          assert os.environ.get('SOURCE_DATE_EPOCH')==str(EXPECTED_EPOCH), 'PDF epoch changed'
          assert git('rev-parse','HEAD').decode().strip()==event
          assert git('rev-parse','HEAD^').decode().strip()==MAIN
          assert sorted(git('diff','--name-only',MAIN,'HEAD').decode().splitlines())==INPUT_PATHS
          subprocess.run(['git','fetch','--filter=blob:none','origin','refs/heads/main:refs/remotes/origin/main','refs/heads/'+BRANCH+':refs/remotes/origin/cash-email-preview-pass-check'],check=True)
          assert git('rev-parse','refs/remotes/origin/main').decode().strip()==MAIN,'main advanced; stop for review'
          assert git('rev-parse','refs/remotes/origin/cash-email-preview-pass-check').decode().strip()==event,'branch advanced; stop for review'
          for path, spec in PREFIXES.items():
              original=git('show',MAIN+':'+path)
              assert len(original)==spec['oldBytes'] and sha(original)==spec['oldSha256']
              data=spec['prefix'].encode()+original
              assert data.endswith(original) and sha(data)==spec['newSha256']
              Path(path).write_bytes(data)
          for path, expected in TEXT_SHAS.items():assert sha(Path(path).read_bytes())==expected,path+' differs from reviewed bytes'
          subprocess.run(['python3','-c',"import reportlab.rl_config,runpy; reportlab.rl_config.invariant=1; runpy.run_path('docs/roadmap/generate-open-work-tracker.py',run_name='__main__')"],check=True)
          shutil.copyfile(PDFS[0],PDFS[1])
          assert Path(PDFS[0]).read_bytes()==Path(PDFS[1]).read_bytes()
          assert sha(Path(PDFS[0]).read_bytes())==EXPECTED_PDF_SHA, 'PDF bytes differ from reviewed generation'
          pdf_text=subprocess.check_output(['pdftotext','-layout',PDFS[0],'-']).decode()
          normalized=' '.join(unicodedata.normalize('NFC',pdf_text).split())
          assert sha(normalized.encode())==EXPECTED_PDF_TEXT_SHA,'PDF text differs from reviewed generation'
          info=subprocess.check_output(['pdfinfo',PDFS[0]]).decode()
          assert int(re.search(r'^Pages:\s+(\d+)',info,re.M).group(1))==EXPECTED_PAGES,'PDF pagination changed'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--sparse','--',*FINAL_PATHS],check=True)
          subprocess.run(['git','rm','--',WORKFLOW],check=True)
          subprocess.run(['git','diff','--cached','--check',MAIN,'--',*TEXT_SHAS.keys()],check=True)
          assert sorted(git('diff','--cached','--name-only',MAIN).decode().splitlines())==FINAL_PATHS
          assert not git('diff','--name-only').strip(),'unstaged changes'
          assert not git('ls-files','--others','--exclude-standard').strip(),'untracked files'
          assert git('write-tree').decode().strip()==EXPECTED_REVIEWED_TREE,'final tree differs from reviewed tree'
          subprocess.run(['git','commit','-m','docs(cash): record the verified native in-app email preview'],check=True)
          assert git('rev-parse','HEAD^{tree}').decode().strip()==EXPECTED_REVIEWED_TREE
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+BRANCH],check=True)
          print('Published commit:',git('rev-parse','HEAD').decode().strip())
          print('Published tree:',git('rev-parse','HEAD^{tree}').decode().strip())
          print('PDF pages:',EXPECTED_PAGES)
          print('PDF SHA256:',sha(Path(PDFS[0]).read_bytes()))
          print('Verified normalized PDF text SHA256:',EXPECTED_PDF_TEXT_SHA)
          print('Preserved registry byte counts:',json.dumps({p:s['oldBytes'] for p,s in PREFIXES.items()}))
          PY
