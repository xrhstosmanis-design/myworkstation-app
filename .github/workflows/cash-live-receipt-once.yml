name: Cash bounded live acceptance receipt
on:
  push:
    branches: [docs/cash-live-readonly-20261107]
    paths: ['.github/workflows/cash-live-receipt-once.yml']
permissions:
  contents: write
concurrency:
  group: cash-live-receipt-once
  cancel-in-progress: false
jobs:
  preserve-once:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app' && github.ref == 'refs/heads/docs/cash-live-readonly-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_DATE_EPOCH: '1794062090'
      PYTHONHASHSEED: '0'
      TZ: UTC
    steps:
      - name: Checkout exact documentation input
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            CHECKPOINTS/CHANGES
            CHECKPOINTS/EVIDENCE/cash-automatic-review-20261106
            docs/manual/cash-control
            docs/roadmap
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documented PDF renderer
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.9
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-dejavu-core
      - name: Preserve registries, verify generated PDF and remove helper
        env:
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, os, json, hashlib, re, unicodedata, shutil
          import reportlab
          MAIN='a9d6873c98f045de943bc67e3ff15ba70843f896'
          BRANCH='docs/cash-live-readonly-20261107'
          WORKFLOW='.github/workflows/cash-live-receipt-once.yml'
          INPUT_PATHS=['.github/workflows/cash-live-receipt-once.yml', 'CHECKPOINTS/CHANGES/2026-11-06-cash-automatic-review.md', 'CHECKPOINTS/EVIDENCE/cash-automatic-review-20261106/live-ui-acceptance-20261107.json', 'docs/manual/cash-control/PASS.md']
          FINAL_PATHS=['CHECKPOINTS/CHANGES/2026-11-06-cash-automatic-review.md', 'CHECKPOINTS/EVIDENCE/cash-automatic-review-20261106/live-ui-acceptance-20261107.json', 'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md', 'docs/manual/cash-control/PASS.md', 'docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf', 'docs/roadmap/OPEN_WORK_TRACKER.md', 'docs/roadmap/PENDING_WORK.md', 'output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf']
          TEXT_SHAS={'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md': '42dadf491b38278f1432b432408f255a8670c6b731efff68d865a2776ffb4e89', 'docs/roadmap/OPEN_WORK_TRACKER.md': '8d2d5d063c128732be196b98f2dde2207f158a02c6fb2037e4ea6c64fd628274', 'docs/roadmap/PENDING_WORK.md': '2ccf2a01e0e91f309618b34ddc922c061883f979f76139eaed48e2226da32612', 'CHECKPOINTS/CHANGES/2026-11-06-cash-automatic-review.md': 'b2faeabb278ad4978c8f0c43bee306b660e5dab61f7970108d08159a48d09608', 'CHECKPOINTS/EVIDENCE/cash-automatic-review-20261106/live-ui-acceptance-20261107.json': '6acbb48916739a1a4d42cf3854b85231a0b4e0e3a899b94a93935bfba3783cce', 'docs/manual/cash-control/PASS.md': '7048911a5a326249871eac89a999045237a45f0926bbd2e998f27ca2b5d09e15'}
          PREFIXES={'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md': {'prefix': '## 07/11/2026 — CASH-ADJACENT-COUNT-21 / NATIVE LIVE UI CHECK OBSERVED / PARENT OPEN\n\nSame owner; one explicitly owner-authorized live-store no-charge UI check was invoked on runtime5606b18c at 16:34:50 Europe/Athens; completed result was observed by 16:36:08. HOLD,3checked/pending shifts,3ambiguous candidates,0numeric proposals; visible cash rows/ambiguities/pending replies unchanged and history0→0. This closes only the prior unobserved/auth-blocked single native invocation; no LAB, DB/provider telemetry, reportHash or final financial acceptance claim. Task and CASH-UNIFIED-AUDIT-15 remain OPEN/ASSIGNED. Source#3683/release#3699 are merged; old draft/awaiting-CI/no-action delivery notes below are historical. Next: reconcile applicable source evidence and ambiguities; preserve prior basic/full PASS. Checkpoint: CHECKPOINTS/CHANGES/2026-11-06-cash-automatic-review.md; manual: docs/manual/cash-control/PASS.md; evidence: live-ui-acceptance-20261107.json. Entire prior registry retained.\n\n', 'oldSha256': 'f28b2128ba33d7574d8bc397363c46a0d56f3682db68cb124bf77a30c6801f18', 'oldBytes': 5308826, 'newSha256': '42dadf491b38278f1432b432408f255a8670c6b731efff68d865a2776ffb4e89'}, 'docs/roadmap/OPEN_WORK_TRACKER.md': {'prefix': '## 07/11/2026 — CASH-ADJACENT-COUNT-21 / LIMITED NATIVE LIVE UI PASS; OPEN/ASSIGNED\n\nRetained cash owner. Source PR#3683 and release receipt#3699 are merged. On runtime5606b18cc591cb6682dbe54f3aa0fb7e01c0cf91, one owner-directed live-store no-charge automatic UI invocation was recorded on 07/11 at 16:34:50 Europe/Athens; completed result was observed by 16:36:08: HOLD,3checked/pending shifts,3ambiguous candidates and0numeric proposals. Before/after compared visible rows and pending replies matched; review history0→0. This supersedes historical draft#3657/skipped-CI/authentication-block delivery notes only for this flow. It is not financial agreement. Database, provider telemetry and reportHash NOT MEASURED; broader hosted coverage and financial/evidence reconciliation remain OPEN under the same owner, including parent CASH-UNIFIED-AUDIT-15. Do not replay the completed read merely for recording. Checkpoint CHECKPOINTS/CHANGES/2026-11-06-cash-automatic-review.md; manual docs/manual/cash-control/PASS.md; sanitized live-ui-acceptance-20261107.json.\n\n', 'oldSha256': '7b7e4209e98f72b461ee9698072c55d51d6c8b55f94c56a63729708538d99607', 'oldBytes': 4128030, 'newSha256': '8d2d5d063c128732be196b98f2dde2207f158a02c6fb2037e4ea6c64fd628274'}, 'docs/roadmap/PENDING_WORK.md': {'prefix': '## 07/11/2026 — CASH-ADJACENT-COUNT-21 / CURRENT REMAINING SCOPE / OPEN-ASSIGNED\n\nSame retained cash owner and parent CASH-UNIFIED-AUDIT-15. The single native no-charge UI invocation is completed and is removed from current pending acceptance: limited LIVE UI PASS on runtime5606b18c, invoked on 07/11 at 16:34:50 Europe/Athens, with completed result observed by 16:36:08. Its former authentication/unobserved-action blocker below is superseded history, not work to replay. Source#3683/release#3699 are merged.\n\nRemaining work only: reconcile applicable handwritten/source/expense evidence and ambiguous findings; establish final financial reconciliation/approval; complete separately authorized broader role/device/period and manual-review/switch-race coverage. Database/ledger effects, independent control-state checks, provider billing telemetry and canonical reportHash were not measured by this one UI observation and are not closed by it. No automatic financial approval, employee charge or task/parent closure is recorded. Preserve the existing basic/full saved-reading PASS. Current checkpoint CHECKPOINTS/CHANGES/2026-11-06-cash-automatic-review.md and manual docs/manual/cash-control/PASS.md define the observed limit. Unrelated owners and pending tasks below remain unchanged.\n\n', 'oldSha256': '9942b509c145f8585d219b054363a6116ee76a33f94feddbe1d99eee53c38b83', 'oldBytes': 3654812, 'newSha256': '2ccf2a01e0e91f309618b34ddc922c061883f979f76139eaed48e2226da32612'}}
          PDFS=['output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf', 'docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf']
          EXPECTED_PAGES=974
          EXPECTED_PDF_TEXT_SHA='499a1eca49428b7dd68c7b05283b8d00d87d6772a3acdb4750676f504d018c9a'
          def git(*a):return subprocess.check_output(['git',*a])
          def sha(b):return hashlib.sha256(b).hexdigest()
          event=os.environ['EVENT_SHA']
          assert reportlab.Version=='4.4.9'
          assert git('rev-parse','HEAD').decode().strip()==event
          assert git('rev-parse','HEAD^').decode().strip()==MAIN
          assert sorted(git('diff','--name-only',MAIN,'HEAD').decode().splitlines())==INPUT_PATHS
          subprocess.run(['git','fetch','--filter=blob:none','origin','refs/heads/main:refs/remotes/origin/main','refs/heads/'+BRANCH+':refs/remotes/origin/cash-live-check'],check=True)
          assert git('rev-parse','refs/remotes/origin/main').decode().strip()==MAIN,'main advanced; stop for review'
          assert git('rev-parse','refs/remotes/origin/cash-live-check').decode().strip()==event,'branch advanced; stop for review'
          for path, spec in PREFIXES.items():
              original=git('show',MAIN+':'+path)
              assert len(original)==spec['oldBytes'] and sha(original)==spec['oldSha256']
              data=spec['prefix'].encode()+original
              assert data.endswith(original) and sha(data)==spec['newSha256']
              Path(path).write_bytes(data)
          for path, expected in TEXT_SHAS.items():assert sha(Path(path).read_bytes())==expected,path+' differs from reviewed bytes'
          subprocess.run(['python3','-c',"import reportlab.rl_config,runpy; reportlab.rl_config.invariant=1; runpy.run_path('docs/roadmap/generate-open-work-tracker.py',run_name='__main__')"],check=True)
          shutil.copyfile(PDFS[0],PDFS[1])
          assert Path(PDFS[0]).read_bytes()==Path(PDFS[1]).read_bytes()
          pdf_text=subprocess.check_output(['pdftotext','-layout',PDFS[0],'-']).decode()
          normalized=' '.join(unicodedata.normalize('NFC',pdf_text).split())
          assert sha(normalized.encode())==EXPECTED_PDF_TEXT_SHA,'PDF text differs from reviewed generation'
          info=subprocess.check_output(['pdfinfo',PDFS[0]]).decode()
          assert int(re.search(r'^Pages:\s+(\d+)',info,re.M).group(1))==EXPECTED_PAGES,'PDF pagination changed'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--sparse','--',*FINAL_PATHS],check=True)
          subprocess.run(['git','rm','--',WORKFLOW],check=True)
          subprocess.run(['git','diff','--cached','--check',MAIN,'--',*TEXT_SHAS.keys()],check=True)
          assert sorted(git('diff','--cached','--name-only',MAIN).decode().splitlines())==FINAL_PATHS
          assert not git('diff','--name-only').strip(),'unstaged changes'
          subprocess.run(['git','commit','-m','docs(cash): record limited native live acceptance and retain open financial scope'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+BRANCH],check=True)
          print('Published commit:',git('rev-parse','HEAD').decode().strip())
          print('Published tree:',git('rev-parse','HEAD^{tree}').decode().strip())
          print('PDF pages:',EXPECTED_PAGES)
          print('PDF SHA256:',sha(Path(PDFS[0]).read_bytes()))
          print('Verified normalized PDF text SHA256:',EXPECTED_PDF_TEXT_SHA)
          print('Preserved registry byte counts:',json.dumps({p:s['oldBytes'] for p,s in PREFIXES.items()}))
          PY
