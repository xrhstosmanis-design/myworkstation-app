name: Task3 one-shot registries and PDF reconciliation

on:
  push:
    branches: [fix/task3-lab-preparation-20261105]

permissions:
  contents: write

jobs:
  reconcile-once:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/task3-lab-preparation-20261105
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge only append-only historical prefixes with integrity assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='fcbf02372d57dc22f006f1fa8906b52717374380'
          task='11fdcaf6e336df4cb25d1d655005c4c9f7f03f1f'
          peer='c255548a17cfa4d21c024a76bfae6148d76bb3cd'
          paths=[
              'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md',
              'docs/roadmap/OPEN_WORK_TRACKER.md',
              'docs/roadmap/PENDING_WORK.md',
          ]
          def blob(rev,path):
              return subprocess.check_output(['git','show',f'{rev}:{path}'])
          for path in paths:
              old=blob(base,path); ours=blob(task,path); theirs=blob(peer,path)
              current=Path(path).read_bytes()
              if not old or current!=ours or not ours.endswith(old) or not theirs.endswith(old):
                  raise SystemExit(f'ABORT: history or source mismatch: {path}')
              task_prefix=ours[:-len(old)]
              peer_prefix=theirs[:-len(old)]
              if not task_prefix or not peer_prefix:
                  raise SystemExit(f'ABORT: expected both new prefixes: {path}')
              combined=task_prefix+peer_prefix+old
              if not combined.endswith(theirs) or not combined.startswith(task_prefix):
                  raise SystemExit(f'ABORT: lossless merge invariant failed: {path}')
              Path(path).write_bytes(combined)
              print(f'MERGED {path}: task={len(task_prefix)} peer={len(peer_prefix)} base={len(old)} merged={len(combined)}')
          PY
      - name: Generate and verify both canonical PDF copies
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check reportlab==4.4.4 pypdf==6.1.1
          python3 docs/roadmap/generate-open-work-tracker.py
          cp output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          a=Path('output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf').read_bytes()
          b=Path('docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf').read_bytes()
          if not a or a!=b: raise SystemExit('ABORT: PDF copies mismatch')
          pages=len(PdfReader('output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf').pages)
          if pages<966: raise SystemExit(f'ABORT: suspicious PDF page count {pages}')
          print(f'CANONICAL PDF pages={pages} bytes={len(a)} identical=True')
          PY
      - name: Self-delete temporary workflow and commit ONLY verified files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md docs/roadmap/OPEN_WORK_TRACKER.md docs/roadmap/PENDING_WORK.md docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf
          git rm -- .github/workflows/task3-reconcile-once.yml
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "docs(task3): reconcile canonical registries and regenerate matching PDF copies"
          git push origin HEAD:fix/task3-lab-preparation-20261105
