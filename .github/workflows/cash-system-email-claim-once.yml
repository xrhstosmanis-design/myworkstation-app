name: Cash system email before-source claim
on:
  push:
    branches: [docs/cash-system-email-claim-20261107]
    paths: ['.github/workflows/cash-system-email-claim-once.yml']
permissions:
  contents: write
concurrency:
  group: cash-system-email-claim-once
  cancel-in-progress: false
jobs:
  preserve-once:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app' && github.ref == 'refs/heads/docs/cash-system-email-claim-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_DATE_EPOCH: '1794079148'
      PYTHONHASHSEED: '0'
      TZ: UTC
    steps:
      - name: Checkout exact documentation input
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            CHECKPOINTS/CHANGES
            CHECKPOINTS/EVIDENCE/cash-automatic-review-20261106
            docs/manual/cash-control
            docs/roadmap
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documented PDF renderer
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.9
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-dejavu-core
      - name: Preserve registries, verify generated PDF and remove helper
        env:
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, os, json, hashlib, re, unicodedata, shutil
          import reportlab
          MAIN='2f041a203ded570b0ca752a70e7003e2b2564d82'
          BRANCH='docs/cash-system-email-claim-20261107'
          WORKFLOW='.github/workflows/cash-system-email-claim-once.yml'
          INPUT_PATHS=['.github/workflows/cash-system-email-claim-once.yml', 'CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md']
          FINAL_PATHS=['CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md', 'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md', 'docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf', 'docs/roadmap/OPEN_WORK_TRACKER.md', 'docs/roadmap/PENDING_WORK.md', 'output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf']
          TEXT_SHAS={'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md': '818baac4e683ae5524cda48706406df050edda9d9e6dab0c93c615bcd4b44024', 'docs/roadmap/OPEN_WORK_TRACKER.md': '96b390402588b460d30aba5141a8527bd163193a2648240be94a03117b53ea21', 'docs/roadmap/PENDING_WORK.md': '0e09757c2885f5bac5ad29078f7884ae8ef0e76093e0c3a6199cba947365ab6c', 'CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md': '5de332807e96b7c0d4b0f61e93f9f5f1f99bb6f9092c6b1d2ed9731be02d9515'}
          PREFIXES={'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md': {'prefix': '## 07/11/2026 21:19 Europe/Athens - CASH-UNIFIED-AUDIT-15 / SYSTEM-GENERATED EMAIL / BEFORE SOURCE\n\nASSIGNED - retained owner codex/cash-chat-reconciliation-20261026, coordinated by /root; no transfer or competing claim. Claim branch docs/cash-system-email-claim-20261107; implementation branch fix/cash-system-email-20261107. OPEN / AWAITING IMPLEMENTATION AND LAB.\n\nThe owner requires the system to generate the full cash report and send it through its native email flow; the owner or manager then reviews its findings and pending items. Current native email uses an ordinary source read, while the no-charge full check enables fullAudit. Duplicate-sale, stored-paper and full-audit pending evidence therefore does not all reach the existing email preview. This is a bounded connection gap, not a new financial-finality requirement.\n\nScope: connect native email preview/send to the existing full read-only report, validate the complete canonical envelope, and retain the email-only readiness projection without changing scheduled/public schemas. Preserve preview fingerprints/generation, arithmetic/provisional/auth/recipient guards and original amounts. Add only short system-owned pending/follow-up wording; no assistant-authored report/comment or richer duplicate formatter.\n\nProtected: existing 03/11 source evidence, 04/11 basic/full saved-reading scoped PASS and 07/11 limited no-charge LIVE UI PASS. No new functional PASS, manual entry, source fix or delivery is claimed. No paid OCR, ledger/review/offset writes, schedules, new recipients or production email attempt. Earlier outbound approval rejection remains effective; this claim/code correction grants no send approval. Any later delivery needs separate approval for its exact recipients.\n\nNext: publish this documentation-only claim on main after applicable CI, then implement the bounded correction and verify synthetic parity/freshness guards, exact CI and separately authorized LAB. All full-email delivery and new behavior remain NOT TESTED / NOT SENT. Parent and existing residual financial/source work remain OPEN. Checkpoint: CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md. All prior registry bytes and peer ownership retained.\n\n', 'oldSha256': '42dadf491b38278f1432b432408f255a8670c6b731efff68d865a2776ffb4e89', 'oldBytes': 5309829, 'newSha256': '818baac4e683ae5524cda48706406df050edda9d9e6dab0c93c615bcd4b44024'}, 'docs/roadmap/OPEN_WORK_TRACKER.md': {'prefix': '## 07/11/2026 21:19 Europe/Athens - CASH-UNIFIED-AUDIT-15 / SYSTEM-GENERATED EMAIL / BEFORE SOURCE\n\nASSIGNED - retained owner codex/cash-chat-reconciliation-20261026, coordinated by /root; no transfer or competing claim. Claim branch docs/cash-system-email-claim-20261107; implementation branch fix/cash-system-email-20261107. OPEN / AWAITING IMPLEMENTATION AND LAB.\n\nThe owner requires the system to generate the full cash report and send it through its native email flow; the owner or manager then reviews its findings and pending items. Current native email uses an ordinary source read, while the no-charge full check enables fullAudit. Duplicate-sale, stored-paper and full-audit pending evidence therefore does not all reach the existing email preview. This is a bounded connection gap, not a new financial-finality requirement.\n\nScope: connect native email preview/send to the existing full read-only report, validate the complete canonical envelope, and retain the email-only readiness projection without changing scheduled/public schemas. Preserve preview fingerprints/generation, arithmetic/provisional/auth/recipient guards and original amounts. Add only short system-owned pending/follow-up wording; no assistant-authored report/comment or richer duplicate formatter.\n\nProtected: existing 03/11 source evidence, 04/11 basic/full saved-reading scoped PASS and 07/11 limited no-charge LIVE UI PASS. No new functional PASS, manual entry, source fix or delivery is claimed. No paid OCR, ledger/review/offset writes, schedules, new recipients or production email attempt. Earlier outbound approval rejection remains effective; this claim/code correction grants no send approval. Any later delivery needs separate approval for its exact recipients.\n\nNext: publish this documentation-only claim on main after applicable CI, then implement the bounded correction and verify synthetic parity/freshness guards, exact CI and separately authorized LAB. All full-email delivery and new behavior remain NOT TESTED / NOT SENT. Parent and existing residual financial/source work remain OPEN. Checkpoint: CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md. All prior registry bytes and peer ownership retained.\n\n', 'oldSha256': '8d2d5d063c128732be196b98f2dde2207f158a02c6fb2037e4ea6c64fd628274', 'oldBytes': 4129096, 'newSha256': '96b390402588b460d30aba5141a8527bd163193a2648240be94a03117b53ea21'}, 'docs/roadmap/PENDING_WORK.md': {'prefix': '## 07/11/2026 21:19 Europe/Athens - CASH-UNIFIED-AUDIT-15 / SYSTEM-GENERATED EMAIL / BEFORE SOURCE\n\nASSIGNED - retained owner codex/cash-chat-reconciliation-20261026, coordinated by /root; no transfer or competing claim. Claim branch docs/cash-system-email-claim-20261107; implementation branch fix/cash-system-email-20261107. OPEN / AWAITING IMPLEMENTATION AND LAB.\n\nThe owner requires the system to generate the full cash report and send it through its native email flow; the owner or manager then reviews its findings and pending items. Current native email uses an ordinary source read, while the no-charge full check enables fullAudit. Duplicate-sale, stored-paper and full-audit pending evidence therefore does not all reach the existing email preview. This is a bounded connection gap, not a new financial-finality requirement.\n\nScope: connect native email preview/send to the existing full read-only report, validate the complete canonical envelope, and retain the email-only readiness projection without changing scheduled/public schemas. Preserve preview fingerprints/generation, arithmetic/provisional/auth/recipient guards and original amounts. Add only short system-owned pending/follow-up wording; no assistant-authored report/comment or richer duplicate formatter.\n\nProtected: existing 03/11 source evidence, 04/11 basic/full saved-reading scoped PASS and 07/11 limited no-charge LIVE UI PASS. No new functional PASS, manual entry, source fix or delivery is claimed. No paid OCR, ledger/review/offset writes, schedules, new recipients or production email attempt. Earlier outbound approval rejection remains effective; this claim/code correction grants no send approval. Any later delivery needs separate approval for its exact recipients.\n\nNext: publish this documentation-only claim on main after applicable CI, then implement the bounded correction and verify synthetic parity/freshness guards, exact CI and separately authorized LAB. All full-email delivery and new behavior remain NOT TESTED / NOT SENT. Parent and existing residual financial/source work remain OPEN. Checkpoint: CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md. All prior registry bytes and peer ownership retained.\n\n', 'oldSha256': '2ccf2a01e0e91f309618b34ddc922c061883f979f76139eaed48e2226da32612', 'oldBytes': 3656103, 'newSha256': '0e09757c2885f5bac5ad29078f7884ae8ef0e76093e0c3a6199cba947365ab6c'}}
          PDFS=['output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf', 'docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf']
          EXPECTED_PAGES=975
          EXPECTED_PDF_TEXT_SHA='faa6b986bc0cbca742b7f0a390a2a369e2933b6298ac7738ef68b608ed2199ec'
          def git(*a):return subprocess.check_output(['git',*a])
          def sha(b):return hashlib.sha256(b).hexdigest()
          event=os.environ['EVENT_SHA']
          assert reportlab.Version=='4.4.9'
          assert git('rev-parse','HEAD').decode().strip()==event
          assert git('rev-parse','HEAD^').decode().strip()==MAIN
          assert sorted(git('diff','--name-only',MAIN,'HEAD').decode().splitlines())==INPUT_PATHS
          subprocess.run(['git','fetch','--filter=blob:none','origin','refs/heads/main:refs/remotes/origin/main','refs/heads/'+BRANCH+':refs/remotes/origin/cash-system-email-claim-check'],check=True)
          assert git('rev-parse','refs/remotes/origin/main').decode().strip()==MAIN,'main advanced; stop for review'
          assert git('rev-parse','refs/remotes/origin/cash-system-email-claim-check').decode().strip()==event,'branch advanced; stop for review'
          for path, spec in PREFIXES.items():
              original=git('show',MAIN+':'+path)
              assert len(original)==spec['oldBytes'] and sha(original)==spec['oldSha256']
              data=spec['prefix'].encode()+original
              assert data.endswith(original) and sha(data)==spec['newSha256']
              Path(path).write_bytes(data)
          for path, expected in TEXT_SHAS.items():assert sha(Path(path).read_bytes())==expected,path+' differs from reviewed bytes'
          subprocess.run(['python3','-c',"import reportlab.rl_config,runpy; reportlab.rl_config.invariant=1; runpy.run_path('docs/roadmap/generate-open-work-tracker.py',run_name='__main__')"],check=True)
          shutil.copyfile(PDFS[0],PDFS[1])
          assert Path(PDFS[0]).read_bytes()==Path(PDFS[1]).read_bytes()
          pdf_text=subprocess.check_output(['pdftotext','-layout',PDFS[0],'-']).decode()
          normalized=' '.join(unicodedata.normalize('NFC',pdf_text).split())
          assert sha(normalized.encode())==EXPECTED_PDF_TEXT_SHA,'PDF text differs from reviewed generation'
          info=subprocess.check_output(['pdfinfo',PDFS[0]]).decode()
          assert int(re.search(r'^Pages:\s+(\d+)',info,re.M).group(1))==EXPECTED_PAGES,'PDF pagination changed'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--sparse','--',*FINAL_PATHS],check=True)
          subprocess.run(['git','rm','--',WORKFLOW],check=True)
          subprocess.run(['git','diff','--cached','--check',MAIN,'--',*TEXT_SHAS.keys()],check=True)
          assert sorted(git('diff','--cached','--name-only',MAIN).decode().splitlines())==FINAL_PATHS
          assert not git('diff','--name-only').strip(),'unstaged changes'
          subprocess.run(['git','commit','-m','docs(cash): retain ownership for full system-generated email correction'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+BRANCH],check=True)
          print('Published commit:',git('rev-parse','HEAD').decode().strip())
          print('Published tree:',git('rev-parse','HEAD^{tree}').decode().strip())
          print('PDF pages:',EXPECTED_PAGES)
          print('PDF SHA256:',sha(Path(PDFS[0]).read_bytes()))
          print('Verified normalized PDF text SHA256:',EXPECTED_PDF_TEXT_SHA)
          print('Preserved registry byte counts:',json.dumps({p:s['oldBytes'] for p,s in PREFIXES.items()}))
          PY
