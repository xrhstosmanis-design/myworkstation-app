name: Assemble Azure diagnostic claim once
on:
  push:
    branches: [docs/invoice-azure-timing-claim-20261105]
    paths: [.github/workflows/invoice-azure-claim-assemble-once.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          filter: blob:none
      - name: Verify exact source and branch lease
        run: |
          test "$(git rev-parse HEAD^)" = 27b756ef28fe417ede7bdf122fab183214e8cb85
          test "$(git ls-remote origin refs/heads/docs/invoice-azure-timing-claim-20261105 | cut -f1)" = "$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install reportlab==4.4.9 pypdf==6.3.0
      - name: Preserve complete registries and install exact prepared fixtures
        shell: python
        run: |
          import subprocess,json,zlib,base64,hashlib,shutil
          from pathlib import Path
          changes=json.loads(zlib.decompress(base64.b64decode('')))
          for path,e in changes.items():
           p=Path(path)
           if e['mode']=='new':assert not p.exists(),path;old=b''
           else:old=p.read_bytes();assert hashlib.sha256(old).hexdigest()==e['old'],path
           data=base64.b64decode(e['data']);new=data+old if e['mode']=='prepend' else data
           assert hashlib.sha256(new).hexdigest()==e['expected'],path
           if e['mode']=='prepend':assert new.endswith(old),path
           p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(new)
           if path.endswith('.json'):json.loads(new)
          subprocess.run(['python','docs/roadmap/generate-open-work-tracker.py'],check=True)
          shutil.copyfile('output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf','docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf')
          workflow='.github/workflows/invoice-azure-claim-assemble-once.yml';Path(workflow).unlink()
          paths=set(changes)|{'output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf','docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf',workflow}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed==paths,(changed,paths)
          subprocess.run(['git','diff','--check','--','*.md'],check=True)
          subprocess.run(['git','add','--',*sorted(paths)],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','docs(invoice): publish Azure phase diagnostic claim before source'],check=True)
          subprocess.run(['git','push','origin','HEAD:docs/invoice-azure-timing-claim-20261105'],check=True)
