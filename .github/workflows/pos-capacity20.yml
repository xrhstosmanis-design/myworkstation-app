name: Isolated 20-store capacity model

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/pos-capacity/**'
      - 'server/e2e/pos-capacity-flow.mjs'
      - '.github/workflows/pos-capacity20.yml'
  push:
    branches: ['codex/pos-capacity20-run-*']

permissions:
  contents: read

concurrency:
  group: isolated-capacity20-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capped-model:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NODE_ENV: test
      MWS_CAPACITY_ISOLATED: '1'
      MWS_CAPACITY_MODE: priority20
      MWS_CAPACITY_PROFILE: ${{ github.event_name == 'push' && 'full' || 'preflight' }}
      MWS_CAPACITY_OUTPUT: /tmp/mws-capacity20
      MWS_CAPACITY_RESOURCE_MODEL: 'Docker model: app0.15CPU/512MiB;PG18 0.10CPU/256MiB;not Render-equivalent infrastructure'
      MWS_CAPACITY_APP_POOL_LIMIT: '5 (explicit test model;production configured limit NOT_MEASURED)'
      DATABASE_URL: postgresql://postgres:isolated-only@127.0.0.1:5432/myworkstation_capacity20_test?connection_limit=5&pool_timeout=10
      JWT_SECRET: isolated-capacity20-test-secret-sufficient-length
      INITIAL_ADMIN_EMAIL: capacity20-admin@example.invalid
      INITIAL_ADMIN_PASSWORD: isolated-only-admin-password
      KAT_OWNER_EMAIL: capacity20-owner@example.invalid
      KAT_OWNER_NAME: Synthetic Capacity20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and prepare isolated server
        run: |
          npm install
          npm run build:server
      - name: Validate profile regressions before provisioning
        run: node --test server/test/pos-capacity-runner.test.js server/test/pos-capacity-profiles.test.js
      - name: Run bounded resource model
        run: bash tools/pos-capacity/run-capped20.sh
      - name: Preserve sanitized result and resources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity20-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/mws-capacity20/result.json
            /tmp/mws-capacity20/resources.jsonl
            /tmp/mws-capacity20/container-state.json
            /tmp/mws-capacity20/model-manifest.json
          if-no-files-found: ignore
          retention-days: 30
