name: Android owner signing helper
on:
  pull_request:
    paths: ['tools/android-chat-signing/**', '.github/workflows/android-signing-setup-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing-helper:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate helper using disposable keys and fake CLI in Windows PowerShell 5.1
        shell: powershell
        run: '& ./tools/android-chat-signing/Test-OwnerSigning.ps1'
      - name: Validate helper using disposable keys and fake CLI in PowerShell 7
        shell: pwsh
        run: '& ./tools/android-chat-signing/Test-OwnerSigning.ps1'
