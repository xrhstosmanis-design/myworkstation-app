name: OCR4 exact CI log diagnosis (isolated)
on:
  push:
    branches: [build/ocr4-page-ci-diagnosis-20261105]
    paths: [.github/workflows/ocr4-page-ci-diagnosis-once.yml]
permissions:
  actions: read
  contents: read
jobs:
  read-log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve exact original log and extract failures without changing source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ocr4-ci-diagnosis"
          python3 - <<'PY'
          import os,json,hashlib,re,urllib.request
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'ocr4-ci-diagnosis'
          base='https://api.github.com/repos/xrhstosmanis-design/myworkstation-app'
          headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def read(path):
              request=urllib.request.Request(base+path,headers=headers)
              request.add_unredirected_header('Authorization','Bearer '+os.environ['GH_TOKEN'])
              with urllib.request.urlopen(request,timeout=60) as r:return r.read()
          job=json.loads(read('/actions/jobs/127183902392'))
          assert job['run_id']==42009262448 and job['conclusion']=='failure'
          run=json.loads(read('/actions/runs/42009262448'))
          assert run['head_sha']=='d6046198273018a2f14b1a65890ef6b2a3c7345d'
          raw=read('/actions/jobs/127183902392/logs')
          (root/'job-127183902392.log').write_bytes(raw)
          lines=raw.decode('utf-8-sig').splitlines()
          indexes=set()
          for i,line in enumerate(lines):
              if re.search(r'\bnot ok\b|# (tests|pass|fail|cancelled|skipped)\b|##\[error\]',line):
                  indexes.update(range(max(0,i-4),min(len(lines),i+75 if 'not ok' in line else i+4)))
          excerpt='\n'.join(str(i+1)+': '+lines[i] for i in sorted(indexes))+'\n'
          (root/'failures.txt').write_text(excerpt)
          receipt={'run_id':run['id'],'run_head':run['head_sha'],'job_id':job['id'],'job_conclusion':job['conclusion'],'raw_sha256':hashlib.sha256(raw).hexdigest(),'raw_bytes':len(raw),'lines':len(lines),'read_only':True,'source_changed':False}
          (root/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt));print(excerpt[:30000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ocr4-page-exact-ci-diagnosis
          path: ${{ runner.temp }}/ocr4-ci-diagnosis
          if-no-files-found: error
          retention-days: 7
