name: Temporary efood active-list update

"on":
  push:
    branches:
      - "fix/efood-lab-bootstrap"
    paths:
      - ".github/workflows/efood-active-list-update.yml"

permissions:
  contents: write

jobs:
  update-active-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepend efood LAB checkpoint
        run: node tools/prepend-efood-active-checkpoint.mjs
      - name: Commit active-list update
        shell: bash
        run: |
          if git diff --quiet -- CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md; then
            echo "Active list already contains the efood checkpoint."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md
          git commit -m "Checkpoint efood LAB bootstrap repair"
          git push origin HEAD:fix/efood-lab-bootstrap
