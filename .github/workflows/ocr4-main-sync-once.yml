name: OCR4 one-use main synchronization
on:
  push:
    branches: [fix/ocr4-pdf-total-safety-20261105]
    paths: [.github/workflows/ocr4-main-sync-once.yml]
permissions:
  contents: write
concurrency:
  group: ocr4-main-sync-20261105
  cancel-in-progress: false
jobs:
  synchronize-and-verify:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app' && github.ref == 'refs/heads/fix/ocr4-pdf-total-safety-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin both reviewed parents and preserve exact source inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node.split(".")[0]')" = 20
          git fetch --no-tags --depth=100 origin main fix/ocr4-pdf-total-safety-20261105
          test "$(git rev-parse origin/main)" = 723b16750f8ad3ccc524267abcd5a25b1c3bd6a4
          test "$(git rev-parse origin/fix/ocr4-pdf-total-safety-20261105)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 012de5401900c55feb03fffb35ef3bd484768a88
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir /tmp/ocr4-main-sync
          git ls-tree -r 012de5401900c55feb03fffb35ef3bd484768a88 server/test > /tmp/ocr4-main-sync/original-test-inventory.txt
          git show 012de5401900c55feb03fffb35ef3bd484768a88:server/test/pos-fast-header-timing.test.js > /tmp/ocr4-main-sync/original-timing.test.js
          git show 012de5401900c55feb03fffb35ef3bd484768a88:server/test/pos-fast-header-latency.test.js > /tmp/ocr4-main-sync/original-latency.test.js
          git show 723b16750f8ad3ccc524267abcd5a25b1c3bd6a4:AGENTS.md > /tmp/ocr4-main-sync/AGENTS.md
          python - <<'PY'
          from pathlib import Path
          import subprocess,hashlib,json
          out=Path('/tmp/ocr4-main-sync'); refs={'common':'f0d45edfd0628557f7a1a545355faa928d631240','ours':'012de5401900c55feb03fffb35ef3bd484768a88','main':'723b16750f8ad3ccc524267abcd5a25b1c3bd6a4'}
          paths=['CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md','docs/roadmap/OPEN_WORK_TRACKER.md','docs/roadmap/PENDING_WORK.md','server/src/routes/commerce-pos-v244.js','server/test/pos-fast-header-latency.test.js']
          for label,ref in refs.items():
            for name in paths:
              b=subprocess.check_output(['git','show',f'{ref}:{name}']);p=out/label/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          r={'parents':refs,'kind':'BRANCH_SYNCHRONIZATION_NOT_RELEASE','runtime_new_policy':False,'full_ci':'REQUIRED','independent_review':'PENDING','lab':'NOT_TESTED','live_provider_called':False}
          (out/'receipt.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
      - name: Merge main with only the verified lossless active-registry resolution
        shell: bash
        run: |
          set -euo pipefail
          status=0
          git merge --no-commit --no-ff 723b16750f8ad3ccc524267abcd5a25b1c3bd6a4 || status=$?
          test "$status" -le 1
          python - <<'PY'
          from pathlib import Path
          import subprocess,hashlib,json
          out=Path('/tmp/ocr4-main-sync');name='CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md'
          conflicts=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          assert conflicts=={name},('unexpected conflict set; manual review required',conflicts)
          common=(out/'common'/name).read_bytes();ours=(out/'ours'/name).read_bytes();main=(out/'main'/name).read_bytes()
          assert ours.endswith(common) and main.endswith(common)
          own_prefix=ours[:-len(common)];peer_prefix=main[:-len(common)]
          assert len(own_prefix)==2137 and peer_prefix and own_prefix not in main
          merged=own_prefix+main;Path(name).write_bytes(merged)
          assert merged.endswith(main) and merged.startswith(own_prefix) and merged.endswith(common)
          subprocess.run(['git','add',name],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).strip()
          route=Path('server/src/routes/commerce-pos-v244.js').read_bytes()
          assert hashlib.sha256(route).hexdigest()=='32e1f56f985603aaa7c819a490c9dc2d846884c0c43dbd7e4f22f8fd9d5653e8','combined runtime differs from reviewed combination'
          r=json.loads((out/'receipt.json').read_text());r.update({'conflicts_resolved':[name],'source_prefix_preserved':True,'entire_main_registry_suffix_preserved':True,'common_registry_suffix_preserved':True,'combined_runtime_sha256':hashlib.sha256(route).hexdigest()})
          (out/'receipt.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
      - name: Install manifest dependencies without lifecycle or manifest writes
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false --no-save
      - name: Execute the six combined production-source regression suites
        shell: bash
        run: |
          set -euo pipefail
          node --check server/src/routes/commerce-pos-v244.js
          node --test server/test/pos-fast-header-latency.test.js server/test/pos-fast-header-timing.test.js server/test/pos-fast-handoff-recovery-v1.test.js server/test/pos-fast-header-pdf-total-safety.test.js server/test/pos-fast-header-pdf-real-helpers.test.js server/test/pos-fast-header-pdf-timing-shared.test.js | tee /tmp/ocr4-main-sync/combined.tap
      - name: Record source synchronization without a new OCR acceptance claim
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib,re,os
          out=Path('/tmp/ocr4-main-sync');r=json.loads((out/'receipt.json').read_text());tap=(out/'combined.tap').read_text()
          stats={key:int(re.search(r'^# '+key+r' (\d+)$',tap,re.M)[1]) for key in ['tests','pass','fail','cancelled','skipped']}
          assert stats=={'tests':277,'pass':277,'fail':0,'cancelled':0,'skipped':0},stats
          r.update({'focused_tests':stats,'tap_sha256':hashlib.sha256((out/'combined.tap').read_bytes()).hexdigest(),'node':subprocess.check_output(['node','--version'],text=True).strip(),'workflow_run_id':os.environ['RUN_ID']})
          prefix='\n\n'.join([
            '## 05/11/2026 - INVOICE-PDF-TOTAL-SAFETY-01 / PR3667 MAIN SYNC / AWAITING FULL CI AND REVIEW',
            'Retained task4 owner /root; fix/ocr4-pdf-total-safety-20261105. Before-source claim3666 remains published. Merged peer3665 main723b167 into this SOURCE BRANCH only. Both the exact-model low-reasoning provider change and PDF amount-return guards are preserved; no new runtime policy, transfer of peer ownership or release is performed.',
            'The sole active-registry merge conflict is resolved by preserving the entire main registry as an exact suffix after the existing2137-byte task4 source prefix. Common history and both owners survive. Node20 complete-checkout focused six-suite result:277PASS/0FAIL/0SKIP; provider/DB/wallet I/O remains simulated. Exact full native CI and independent review remain required.',
            'The previous CI41973921759 attempts failed at the server-test stage. Retrieved diagnostics conflicted with verified source files; no causal test attribution, flaky classification or full-suite count is asserted. No existing test, expected amount, guard or threshold was weakened. Fresh exact-head normal CI must determine release eligibility.',
            'No production deployment, paid provider read, invoice submission/payment, stock or fiscal operation. H/G and H21.959s are protected; F/D/G/H and reserved I are not replayed. General supplier/pages/packages/discount/VAT/EFK completeness and latency remain OPEN. Checkpoint: CHECKPOINTS/CHANGES/2026-11-05-ocr4-pdf-total-safety-source.md. Next: exact full CI and read-only independent review, then guarded release and a separately identified fresh no-submit LAB read.'
          ])+'\n\n'
          assert all(line.rstrip()==line for line in prefix.splitlines())
          registry=['CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md','docs/roadmap/OPEN_WORK_TRACKER.md','docs/roadmap/PENDING_WORK.md'];r['registry_sync']={}
          for name in registry:
            p=Path(name);old=p.read_bytes();new=prefix.encode()+old;p.write_bytes(new);assert p.read_bytes()[len(prefix.encode()):]==old
            r['registry_sync'][name]={'merged_old_bytes':len(old),'new_bytes':len(new),'new_prefix_bytes':len(prefix.encode()),'merged_old_suffix_preserved':True}
          checkpoint=Path('CHECKPOINTS/CHANGES/2026-11-05-ocr4-pdf-total-safety-source.md');checkpoint.write_bytes(checkpoint.read_bytes()+b'\n'+prefix.encode())
          names=['server/src/routes/commerce-pos-v244.js','server/test/pos-fast-header-latency.test.js','server/test/pos-fast-header-timing.test.js','server/test/pos-fast-handoff-recovery-v1.test.js','server/test/pos-fast-header-pdf-total-safety.test.js','server/test/pos-fast-header-pdf-real-helpers.test.js','server/test/pos-fast-header-pdf-timing-shared.test.js',str(checkpoint),*registry]
          r['files']={}
          for name in names:
            b=Path(name).read_bytes();dst=out/'after'/name;dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(b);r['files'][name]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          (out/'receipt.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
      - name: Regenerate both existing tracker PDFs for bounded visual review
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'reportlab>=4,<5' 'PyMuPDF>=1.24,<2'
          python docs/roadmap/generate-open-work-tracker.py
          cp output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf
          python - <<'PY'
          from pathlib import Path
          import fitz,json,hashlib
          out=Path('/tmp/ocr4-main-sync');r=json.loads((out/'receipt.json').read_text());names=['docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf','output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf']
          b=Path(names[0]).read_bytes();assert b==Path(names[1]).read_bytes();doc=fitz.open(stream=b,filetype='pdf')
          text=' '.join(' '.join(p.get_text() for p in doc[:2]).split());assert 'PR3667 MAIN SYNC' in text
          for n in sorted({0,1,len(doc)-1}):doc[n].get_pixmap(matrix=fitz.Matrix(1.25,1.25)).save(str(out/f'page-{n+1}.png'))
          for name in names:
            p=out/'after'/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          r['pdf']={'pages':len(doc),'sha256':hashlib.sha256(b).hexdigest(),'two_copies_equal':True,'visual_review':'PENDING'}
          (out/'receipt.json').write_text(json.dumps(r,indent=2)+'\n')
          p=Path('CHECKPOINTS/EVIDENCE/ocr4-pdf-total-safety-source-20261105/main-sync-results.json');assert not p.exists();p.write_text(json.dumps(r,indent=2)+'\n')
          PY
      - name: Delete helper and restrict final merge delta
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ocr4-main-sync-once.yml
          git add CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md CHECKPOINTS/CHANGES/2026-11-05-ocr4-pdf-total-safety-source.md CHECKPOINTS/EVIDENCE/ocr4-pdf-total-safety-source-20261105/main-sync-results.json docs/roadmap/OPEN_WORK_TRACKER.md docs/roadmap/PENDING_WORK.md docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf .github/workflows/ocr4-main-sync-once.yml
          python - <<'PY'
          import subprocess
          allowed={'CHECKPOINTS/CHANGES/2026-11-05-invoice-fast-low-reasoning-source.md','CHECKPOINTS/CHANGES/2026-11-05-ocr4-pdf-total-safety-source.md','CHECKPOINTS/EVIDENCE/ocr4-pdf-total-safety-source-20261105/main-sync-results.json','CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md','docs/roadmap/OPEN_WORK_TRACKER.md','docs/roadmap/PENDING_WORK.md','docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf','output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf','server/src/routes/commerce-pos-v244.js','server/test/pos-fast-header-latency.test.js'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only','012de5401900c55feb03fffb35ef3bd484768a88'],text=True).splitlines());assert actual==allowed,(actual,allowed)
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()
          PY
          git diff --cached --check -- server/src server/test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr4-main-sync-source-proof
          path: /tmp/ocr4-main-sync
          if-no-files-found: error
          retention-days: 14
      - name: Commit only to the unchanged source branch
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/ocr4-pdf-total-safety-20261105
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 723b16750f8ad3ccc524267abcd5a25b1c3bd6a4
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git commit -m 'fix(invoice): merge verified low-reasoning main while preserving PDF total guards and registry history'
          git push origin "HEAD:refs/heads/$branch"
