name: N40 one-time documentation preparation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  prepare-n40-docs:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app' && github.event.pull_request.number == 2040 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/n40-full-twin-navigation-audit-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: n40-documentation-preparation-2040
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/n40-full-twin-navigation-audit-20261010
          fetch-depth: 0
      - name: Validate exact requested head and reconcile main
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Prepare only N40 ownership and preserve all other entries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import re
          owner = 'codex/n40-full-twin-navigation-audit-20261010'
          checkpoint = 'CHECKPOINTS/CHANGES/2026-10-10-n40-full-twin-navigation-audit.md'
          stamp = datetime.now(ZoneInfo('Europe/Athens')).isoformat(timespec='seconds')
          marker = 'N40-NAV-CLAIM-20261010'
          path = Path('docs/roadmap/OPEN_WORK_TRACKER.md')
          original = path.read_text()
          assert marker not in original, 'Claim already prepared; do not repeat'
          match = re.search(r'^### AI-CC-LIMITS .*?(?=^### |\Z)', original, re.M | re.S)
          assert match, 'Canonical N40 section not found'
          old = match.group()
          assert '**Υπεύθυνη σελίδα / branch:** Προηγούμενος owner — νέα επέκταση μόνο με ανάθεση' in old, 'Owner changed; manual reconciliation required'
          new = old.replace('**Κατάσταση:** ΑΡΧΙΚΟ ΠΛΑΝΟ CLOSED / NOT TESTED', '**Κατάσταση:** OPEN / ASSIGNED / NAVIGATION NOT TESTED; visual phases 1–14 remain CLOSED')
          new = new.replace('**Υπεύθυνη σελίδα / branch:** Προηγούμενος owner — νέα επέκταση μόνο με ανάθεση', f'**Υπεύθυνη σελίδα / branch:** `{owner}` — explicit owner assignment for printed40, 10/10/2026.')
          new = new.replace('**Ανάληψη (χρόνος / ακριβές scope / checkpoint / PR):** Διατήρηση παλιάς ανάθεσης όπου υπάρχει· νέα καταγραφή εκκρεμεί.', f'**Ανάληψη (χρόνος / ακριβές scope / checkpoint / PR):** {stamp} — {marker}; Full Digital Twin six-tile navigation only: selected-company/store handoff, safe invalidation and return to the same Twin. `{checkpoint}`; PR #2040. No takeover of visual phases1–14, AI-CREDITS-01, inventory/workforce/video/invoice business flows or other owners.')
          assert new != old
          entry = f'## {stamp} — {marker} / AI-CC-LIMITS / ASSIGNED / AWAITING IMPLEMENTATION AND LAB\n\nSame conversation that created audit PR2040, now explicitly instructed «ξεκινα» to implement its findings. Owner `{owner}`. Bounded six-tile navigation, selected-store handoff/return/invalidation only. Source inspection found generic POS/EFTPOS/Cash callbacks and stale-selection fallback; this is not proof of a server-side data leak. Preserve visual phases1–14 and every other assigned module. Source fix and all authenticated LAB navigation tests NOT TESTED. No sales, payments, stock, staff, fiscal, camera or billing mutation. Claim publication requires this PR final green CI and main merge before application changes. Checkpoint `{checkpoint}`.\n\n'
          path.write_text(entry + original[:match.start()] + new + original[match.end():])
          for name in ['CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md', 'docs/roadmap/PENDING_WORK.md']:
              p = Path(name); before = p.read_text(); assert marker not in before
              p.write_text(entry + before)
          p = Path('docs/roadmap/NUMBERED_WORK_CHECKLIST_2026-10-06.md')
          text = p.read_text(); section = re.search(r'^## 40 .*?(?=^## |\Z)', text, re.M | re.S)
          assert section and 'AI-CC-LIMITS' in section.group()
          current = section.group()
          updated = current.rstrip() + f'\n- **Νεότερη ανάληψη 10/10/2026:** OPEN / ASSIGNED `{owner}` — έξι μεταβάσεις Full Digital Twin, διατήρηση/επιστροφή καταστήματος και ασφαλής ακύρωση μη έγκυρης επιλογής. PR #2040 / {marker}. Υλοποίηση και LAB NOT TESTED· οπτικές αποδοχές 1–14 προστατευμένες.\n\n'
          p.write_text(text[:section.start()] + updated + text[section.end():])
          p = Path(checkpoint)
          p.write_text(p.read_text() + f'\n## {stamp} — implementation instruction and scoped claim\n\n{marker}: owner explicitly instructed «ξεκινα» after the audit. Same owner `{owner}`. The central tracker, active list, pending list and numbered list now contain the bounded N40 claim on this branch. This supersedes only the earlier note that those files were not updated; publication to main still requires final green CI and merge. No application source or LAB action yet. Temporary preparation operates only on PR2040 head branch, never main, removes itself before final review and preserves concurrent main updates. The local clone failed DNS resolution again; tracked repository source is exported as a short-lived review artifact, without credentials or untracked files. Next: inspect complete source/checkpoints and implement one causal navigation fix after claim merge. Full N40 OPEN / NOT TESTED.\n')
          PY
      - name: Regenerate existing documentation PDFs
        run: |
          python3 -m pip install 'reportlab==4.4.9'
          python3 docs/roadmap/generate-open-work-tracker.py
          python3 docs/roadmap/generate-numbered-work-checklist.py
      - name: Remove one-time preparation and publish only to the audit branch
        run: |
          git rm .github/workflows/n40-prepare-20261010.yml
          git add CHECKPOINTS/CHANGES/2026-10-10-n40-full-twin-navigation-audit.md CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md docs/roadmap/OPEN_WORK_TRACKER.md docs/roadmap/PENDING_WORK.md docs/roadmap/NUMBERED_WORK_CHECKLIST_2026-10-06.md docs/roadmap/MyWorkStation_Numbered_Checklist_2026-10-06.pdf output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf
          git diff --cached --check -- '*.md' '.github/workflows/*.yml'
          git commit -m 'docs(n40): claim bounded Full Digital Twin navigation and synchronize lists'
          git push origin HEAD:refs/heads/codex/n40-full-twin-navigation-audit-20261010
      - name: Export tracked source for local review
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/n40-source-review.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/n40-source-revision.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: n40-source-review
          path: |
            ${{ runner.temp }}/n40-source-review.tar.gz
            ${{ runner.temp }}/n40-source-revision.txt
          retention-days: 1
          if-no-files-found: error
