name: Assemble tested multipage PDF priority source once
on:
  push:
    branches: [feat/invoice-pdf-header-priority-20261105]
    paths: [.github/workflows/invoice-pdf-priority-time-once.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          filter: blob:none
      - name: Verify original source and branch lease
        run: |
          test "$(git rev-parse HEAD^)" = 055becbc10caa150b81b3a37993469a3ada1ef28
          test "$(git ls-remote origin refs/heads/feat/invoice-pdf-header-priority-20261105 | cut -f1)" = "$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install reportlab==4.4.9
      - name: Stage exact reviewed source recipe 1
        shell: python
        run: |
          from pathlib import Path
          p=Path('/tmp/pdf-priority-time-recipe.b64')
          p.write_text('')
      - name: Assemble exact tested files, preserve registry suffixes and remove this workflow
        shell: python
        run: |
          import subprocess,json,zlib,base64,hashlib,shutil
          from pathlib import Path
          changes=json.loads(zlib.decompress(base64.b64decode(Path('/tmp/pdf-priority-time-recipe.b64').read_text())))
          for path,e in changes.items():
           p=Path(path)
           if e['mode']=='new':assert not p.exists(),path;old=b''
           else:old=p.read_bytes();assert hashlib.sha256(old).hexdigest()==e['old'],path
           data=base64.b64decode(e['data'])
           if e['mode']=='patch':
            subprocess.run(['git','apply','--check','--whitespace=error','-'],input=data,check=True)
            subprocess.run(['git','apply','--whitespace=error','-'],input=data,check=True)
            value=p.read_bytes()
           else:value=data+old if e['mode']=='prepend' else data
           assert hashlib.sha256(value).hexdigest()==e['expected'],path
           if e['mode']=='prepend':assert value.endswith(old),path
           p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(value)
           if path.endswith('.json'):json.loads(value)
          subprocess.run(['python','docs/roadmap/generate-open-work-tracker.py'],check=True)
          shutil.copyfile('output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf','docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf')
          workflow='.github/workflows/invoice-pdf-priority-time-once.yml';Path(workflow).unlink()
          allowed=set(changes)|set(['output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf', 'docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf'])|{workflow}
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert actual==allowed,(actual,allowed)
          subprocess.run(['git','diff','--check','--','*.md','*.js','*.json'],check=True)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','feat(invoice): prioritize verified multipage PDF headers without Azure wait'],check=True)
          subprocess.run(['git','push','origin','HEAD:feat/invoice-pdf-header-priority-20261105'],check=True)
