name: Temporary efood LAB pass active-list update

"on":
  push:
    branches:
      - "checkpoint/efood-lab-form-load-pass"
    paths:
      - ".github/workflows/efood-lab-pass-active-list.yml"

permissions:
  contents: write

jobs:
  update-active-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record efood LAB form-load pass
        run: node tools/update-efood-lab-pass-active-list.mjs
      - name: Commit active-list update
        shell: bash
        run: |
          if git diff --quiet -- CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md; then
            echo "Active list already records the efood LAB pass."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md
          git commit -m "Record efood LAB form-load pass in active list"
          git push origin HEAD:checkpoint/efood-lab-form-load-pass
