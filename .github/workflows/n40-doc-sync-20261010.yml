name: N40 additive documentation reconciliation
on:
  push:
    branches: [fix/n40-twin-navigation-20261010]
    paths: [.github/workflows/n40-doc-sync-20261010.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Preserve concurrent documentation and all previously verified code
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          SYNC_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n40-sync"
          git config user.name 'MyWorkStation N40 documentation reconciliation'
          git config user.email 'n40-docs@users.noreply.github.com'
          git fetch origin refs/heads/main
          export MAIN_REVISION="$(git rev-parse FETCH_HEAD)"
          python3 - <<'PY'
          import difflib,json,os,subprocess
          from pathlib import Path
          def git(*args):return subprocess.check_output(['git',*args],text=True)
          base='4fdba151bc8e1e5fe23f21509f39a0921a3dfbc9'
          main=os.environ['MAIN_REVISION'];own=os.environ['EXPECTED_HEAD']
          subprocess.run(['git','merge-base','--is-ancestor',base,main],check=True)
          changed=git('diff','--name-only',base,main).splitlines()
          if any(not p.startswith(('docs/','CHECKPOINTS/','output/')) for p in changed):raise RuntimeError('Concurrent runtime changes require a separate review')
          paths=['CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md','docs/roadmap/OPEN_WORK_TRACKER.md','docs/roadmap/PENDING_WORK.md']
          resolved={};evidence={}
          for p in paths:
              b=git('show',base+':'+p).splitlines(keepends=True)
              o=git('show',own+':'+p).splitlines(keepends=True)
              additions=[]
              for tag,i,j,k,l in difflib.SequenceMatcher(None,b,o,autojunk=False).get_opcodes():
                  if tag=='equal':continue
                  if tag!='insert':raise RuntimeError(p+': own diff is not additive')
                  text=''.join(o[k:l])
                  if not text.strip().startswith(('## N40-SCOPED-NAVIGATION-20261010','## N40 central-entry correction')):raise RuntimeError(p+': unexpected owner block')
                  if 'codex/n40-full-twin-navigation-audit-20261010' not in text:raise RuntimeError('Owner mismatch')
                  additions.append(text)
              if len(additions)!=2:raise RuntimeError(p+': expected two historical N40 additions')
              current=git('show',main+':'+p)
              if any(text.strip() in current for text in additions):raise RuntimeError('N40 evidence already published; re-review before appending')
              resolved[p]=current+'\n\n'+'\n\n'.join(text.strip() for text in additions)+'\n'
              evidence[p]={'main_bytes':len(current.encode()),'preserved_entire_main_prefix':True,'own_additive_blocks':len(additions)}
          trees={p:git('rev-parse',own+':'+p).strip() for p in ['client','server','tools','.github/workflows/ci.yml','.github/workflows/deploy-render.yml']}
          result=subprocess.run(['git','merge','--no-commit','--no-ff',main],text=True,capture_output=True)
          conflicts=git('diff','--name-only','--diff-filter=U').splitlines()
          if result.returncode and (not conflicts or any(p not in paths for p in conflicts)):raise RuntimeError('Unexpected merge failure: '+result.stdout+result.stderr)
          for p,text in resolved.items():Path(p).write_text(text)
          note='## N40 full source CI passed; concurrent documentation reconciled / LAB OPEN\n\nSame owner `codex/n40-full-twin-navigation-audit-20261010`, PR #2065. Normal full CI 38047423768 on ab4c5ef3696014db0d40f363d05b9f4b474f16b7 completed SUCCESS, including server suite, Work build, Windows and production safety invariants, isolated PostgreSQL archive import and real HTTP E2E. No tests or gates were skipped to clear earlier failures. This is source validation, not real LAB acceptance.\n\nConcurrent main '+main+' contains documentation/evidence changes only since reviewed main4fdba151. Reconciliation run '+os.environ['SYNC_RUN']+' preserves each entire current-main shared document byte prefix and appends only the two independently verified N40 additive historical blocks. Other owners\u2019 records, manuals, numbered checklist and PDFs are retained. No application or server code, CI gate, module, role, data or device changes. Normal final-head CI is still required before merge; no forced branch update, main push or automatic merge. Deployment and authenticated six-tile LAB/real Stock return remain NOT TESTED; overall No40 OPEN. The temporary reconciliation workflow is removed from the resulting tree.\n'
          for p in paths:Path(p).write_text(Path(p).read_text()+'\n'+note)
          Path('CHECKPOINTS/CHANGES/2026-10-10-n40-main-sync.md').write_text('# N40 documentation-only merge reconciliation\n\n'+note)
          subprocess.run(['git','add','--',*paths,'CHECKPOINTS/CHANGES/2026-10-10-n40-main-sync.md'],check=True)
          subprocess.run(['git','rm','--','.github/workflows/n40-doc-sync-20261010.yml'],check=True)
          tree=git('write-tree').strip()
          for p,sha in trees.items():
              if git('rev-parse',tree+':'+p).strip()!=sha:raise RuntimeError('Verified source changed: '+p)
          if git('diff','--name-only','--diff-filter=U').strip():raise RuntimeError('Unresolved conflicts')
          Path(os.environ['RUNNER_TEMP']+'/n40-sync/evidence.json').write_text(json.dumps({'main':main,'input':own,'preserved_code_trees':trees,'documents':evidence,'resolved_conflicts':conflicts},indent=2))
          PY
          git diff --cached --check
          git commit -m 'docs(N40): preserve concurrent owner records after full CI success'
          git rev-parse HEAD > "$RUNNER_TEMP/n40-sync/revision.txt"
          git diff --stat "$EXPECTED_HEAD" HEAD > "$RUNNER_TEMP/n40-sync/changes.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/n40-sync/source.tar.gz"
          git fetch origin refs/heads/fix/n40-twin-navigation-20261010
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/fix/n40-twin-navigation-20261010
      - name: Preserve exact reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n40-documentation-sync-${{ github.run_id }}
          path: ${{ runner.temp }}/n40-sync/
          retention-days: 3
          if-no-files-found: error
