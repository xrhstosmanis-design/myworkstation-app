name: N40 temporary navigation integration
on:
  push:
    branches: [fix/n40-twin-navigation-20261010]
    paths: [.github/workflows/n40-navigation-prepare-20261010.yml, CHECKPOINTS/tmp/n40-apply-navigation.py, server/test/ai-command-twin-navigation-ui.test.js]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    concurrency:
      group: n40-navigation-source-only
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/n40-twin-navigation-20261010
          fetch-depth: 0
      - name: Check branch lease, preserve main and integrate exact source anchors
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          python3 CHECKPOINTS/tmp/n40-apply-navigation.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install workspace test dependencies without production configuration
        run: npm install > "$RUNNER_TEMP/n40-install.log" 2>&1
      - name: Run navigation and protected selection regressions
        run: |
          set -o pipefail
          node --test server/test/ai-command-twin-selection.test.js server/test/ai-command-twin-selection-ui.test.js server/test/ai-command-twin-navigation.test.js server/test/ai-command-twin-navigation-ui.test.js server/test/super-admin-ai-command-center-phase1.test.js 2>&1 | tee "$RUNNER_TEMP/n40-focused.log"
      - name: Build frontend-only Work bundle
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/n40-build.log"
      - name: Publish tested source to this branch only and remove temporary tooling
        run: |
          cat >> CHECKPOINTS/CHANGES/2026-10-10-n40-scoped-navigation.md <<'EOF'

          ## Supported-runtime preparation

          The isolated Node20 runner passed the new helper and mounted canonical navigation tests, protected selection suites and original phase regression suite, then the frontend Work build. Exact logs/counts and source revision are exported for independent review. This is synthetic component evidence; normal full repository CI and authenticated LAB remain required. No production secrets, data, support session or camera commands were used. Temporary preparation tooling is removed before PR review.
          EOF
          git rm .github/workflows/n40-review-snapshot-20261010.yml .github/workflows/n40-navigation-prepare-20261010.yml CHECKPOINTS/tmp/n40-apply-navigation.py
          git add client/src/components/platform/AiCommandCenter.jsx client/src/components/platform/PlatformAdminApp.jsx client/src/components/platform/SuperAdminChecksAnalytics.jsx client/src/components/platform/SupplierSettlementReviewCenter.jsx client/src/components/platform/BankLedgerReviewCenter.jsx CHECKPOINTS/CHANGES/2026-10-10-n40-scoped-navigation.md CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md docs/roadmap/OPEN_WORK_TRACKER.md docs/roadmap/PENDING_WORK.md
          git diff --cached --check -- '*.md' '*.js' '*.jsx' '*.yml' '*.py'
          git commit -m 'fix(n40): scope canonical Twin destinations and restore navigation origin'
          git push origin HEAD:refs/heads/fix/n40-twin-navigation-20261010
      - name: Export exact applied source and test evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/n40-navigation-review"
          cp "$RUNNER_TEMP"/n40-*.log "$RUNNER_TEMP/n40-navigation-review/" 2>/dev/null || true
          git rev-parse HEAD > "$RUNNER_TEMP/n40-navigation-review/revision.txt"
          git diff --binary origin/main -- client/src/components/platform CHECKPOINTS/CHANGES/2026-10-10-n40-scoped-navigation.md server/test/ai-command-twin-navigation*.test.js > "$RUNNER_TEMP/n40-navigation-review/source.diff"
          git ls-files -z | tar --null -T - --ignore-failed-read -czf "$RUNNER_TEMP/n40-navigation-review/applied-source.tar.gz"
          if test -d node_modules; then tar -czf "$RUNNER_TEMP/n40-navigation-review/test-dependencies.tar.gz" node_modules; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n40-navigation-review
          path: ${{ runner.temp }}/n40-navigation-review/
          retention-days: 1
          if-no-files-found: error
