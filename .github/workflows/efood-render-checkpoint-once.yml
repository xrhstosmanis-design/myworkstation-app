name: efood Render checkpoint once

on:
  push:
    branches:
      - docs/efood-render-deploy-checkpoint
    paths:
      - .github/workflows/efood-render-checkpoint-once.yml

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/efood-render-deploy-checkpoint
          fetch-depth: 0

      - name: Update unified efood Render checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -c 'from pathlib import Path; p=Path("CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md"); lines=p.read_text(encoding="utf-8").splitlines(); h="## 2026-09-13 — efood / Pelican Indirect POS — αποκλειστικά LAB"; new=[h,"","- [x] Υλοποιήθηκε και συγχωνεύτηκε στο κεντρικό `main` μέσω PR #775 / merge `eb97190e`.","- [x] CI #1972, #1973, #1985 και #1987: PASS σε όλα τα gates.","- [x] Κλειδώθηκε server-side το μοναδικό test scope: `MYWORKSTATION LAB / ΕΡΓΑΣΤΗΡΙΟ ΔΟΚΙΜΩΝ`.","- [x] Ρύθμιση efood, mock webhooks, product mappings, Catalog/Promo/Orders previews και δημόσιο webhook απορρίπτονται σε ΚΑΤ ή άλλο πραγματικό κατάστημα.","- [x] Προστέθηκε πλήρης ασφαλής LAB mock ροή: `READY_FOR_PICKUP`, idempotent replay, `CANCELLED`, Catalog, Promo, Orders recovery και readiness.","- [x] Η ροή παραμένει fail-closed: `externalCall=false`, χωρίς OnlineOrder/Sale, stock, τιμή, προσφορά, πληρωμή, RBS/CapDriver/EFTPOS ή fiscal.","- [x] Render workflow #1054 και `Wait for exact production revision`: PASS για το deployed `main` `b6262b8f`.","- [ ] Εκκρεμεί live πάτημα `Πλήρης ασφαλής LAB δοκιμή` μόνο από Platform Super Admin στο μόνιμο LAB.","- [ ] Αναμονή από efood για test Vendor ID, portal access, sandbox credentials και webhook Authorization πριν από πραγματικό sandbox event."]; start=lines.index(h) if h in lines else 0; stops=[i for i in range(start+1,len(lines)) if lines[i].startswith("## ") and lines[i]!=h]; end=min(stops,default=len(lines)); rest=lines[end:]; first=next((i for i,x in enumerate(rest) if x.strip()),len(rest)); rest=rest[first:]; p.write_text("\n".join(new+[""]+rest).rstrip()+"\n",encoding="utf-8")'
          git add CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md
          git commit -m "Record efood Render deployment PASS"
          git push origin HEAD:docs/efood-render-deploy-checkpoint
