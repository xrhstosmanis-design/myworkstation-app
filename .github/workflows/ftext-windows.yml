name: FTEXT Windows diagnostic tests
on:
  pull_request:
    paths:
      - 'tools/windows-ftext/**'
      - 'server/src/services/ftext-cash-review.js'
      - 'server/src/services/ftext-handoff.js'
      - 'server/src/services/ftext-device-work.js'
      - 'server/src/routes/ftext-v1.js'
      - 'server/test/ftext-unpublished-stop*'
      - 'server/test/ftext-cash-review.test.js'
      - '.github/workflows/ftext-windows.yml'
  push:
    branches: [main]
    paths:
      - 'tools/windows-ftext/**'
      - 'server/src/services/ftext-cash-review.js'
      - 'server/src/services/ftext-handoff.js'
      - 'server/src/services/ftext-device-work.js'
      - 'server/src/routes/ftext-v1.js'
      - 'server/test/ftext-unpublished-stop*'
      - 'server/test/ftext-cash-review.test.js'
      - '.github/workflows/ftext-windows.yml'
jobs:
  status-foundation:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and run isolated STATUS transport tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem tools/windows-ftext -File | Where-Object { $_.Extension -in @('.ps1','.psm1') } | ForEach-Object {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          ./tools/windows-ftext/Test-Smoke.ps1
          ./tools/windows-ftext/Test-Cloud-Smoke.ps1
          ./tools/windows-ftext/Test-Cash-Smoke.ps1
          ./tools/windows-ftext/Test-Cloud-Recovery-Smoke.ps1
          ./tools/windows-ftext/Test-Handoff-Smoke.ps1
          ./tools/windows-ftext/Test-Unpublished-Stop-Smoke.ps1
          ./tools/windows-ftext/Test-Void-Smoke.ps1
          ./tools/windows-ftext/Test-Install-Smoke.ps1
          ./tools/windows-ftext/Test-Output-Smoke.ps1
          ./tools/windows-ftext/Test-Output-Cloud-Smoke.ps1
      - name: Check LAB-only timing contract
        shell: pwsh
        run: node --test tools/windows-ftext/tests/ftext-lab-timing-contract.test.mjs
      - name: Exercise opt-in LAB timing on synthetic Windows cash fixture
        shell: powershell
        env:
          MWS_FTEXT_LAB_TIMING: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          # The existing smoke suite creates a temporary synthetic FTEXT folder,
          # never connects to a store or to a physical payment terminal.
          $observed = (& ./tools/windows-ftext/Test-Cash-Smoke.ps1 6>&1 | Out-String)
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Synthetic cash fixture failed.' }
          if ($observed -notmatch 'PASS: [0-9]+ cash command/result/scope/timeout/restart/tombstone boundaries') { throw 'Original cash regression fixture did not pass.' }
          if ($observed -notmatch 'FTEXT_LAB_TIMING requestId=[0-9a-f-]{36} publish_to_result_ms=[0-9]+ elapsed_ms=[0-9]+ eftpos_visible_ms=NOT_OBSERVED') { throw 'Opt-in timing missing for the synthetic result.' }
          Write-Host 'PASS: synthetic original cash guard and LAB publication-to-result timing.'
