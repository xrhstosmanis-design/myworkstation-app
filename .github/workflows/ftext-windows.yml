name: FTEXT Windows diagnostic tests
on:
  pull_request:
    paths:
      - 'tools/windows-ftext/**'
      - '.github/workflows/ftext-windows.yml'
  push:
    branches: [main]
    paths:
      - 'tools/windows-ftext/**'
      - '.github/workflows/ftext-windows.yml'
jobs:
  status-foundation:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and run isolated STATUS transport tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem tools/windows-ftext -File | Where-Object { $_.Extension -in @('.ps1','.psm1') } | ForEach-Object {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          ./tools/windows-ftext/Test-Smoke.ps1
          ./tools/windows-ftext/Test-Cloud-Smoke.ps1
          ./tools/windows-ftext/Test-Cash-Smoke.ps1
          ./tools/windows-ftext/Test-Void-Smoke.ps1
          ./tools/windows-ftext/Test-Install-Smoke.ps1
