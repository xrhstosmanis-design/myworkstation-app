name: N40 temporary Workforce entry integration
on:
  push:
    branches: [fix/n40-twin-navigation-20261010]
    paths: [.github/workflows/n40-workforce-entry-20261010.yml]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/n40-twin-navigation-20261010
      - name: Apply explicit real entry modes under exact branch lease
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('client/src/components/platform/PlatformAdminApp.jsx')
          s=p.read_text()
          old='    {workforceTarget&&<SuperAdminStaffScheduler {...workforceTarget} companies={scopeFor("workforce")?twinCompanies:data?.companies||[]} request={requestFor("workforce")} onClose={()=>{setWorkforceTarget(null);returnFromTwin("workforce")}}/>}'
          new='    {workforceTarget&&!scopeFor("workforce")&&<SuperAdminStaffScheduler {...workforceTarget} companies={data?.companies||[]} request={request} onClose={()=>setWorkforceTarget(null)}/>}\n    {workforceTarget&&scopeFor("workforce")&&<SuperAdminStaffScheduler {...workforceTarget} companies={twinCompanies} request={requestFor("workforce")} onClose={()=>{setWorkforceTarget(null);returnFromTwin("workforce")}}/>}'
          assert s.count(old)==1,'Source changed; reconcile rather than overwrite'
          p.write_text(s.replace(old,new))
          p=Path('server/test/workforce-v2-rules-shift-templates.test.js');s=p.read_text()
          start=s.index('  // Central entry still receives');end=s.index('\n});',start)
          new='''  // Both real entry modes remain explicit. Central navigation gets the full
            // authorized list; Twin navigation pins its pair and uses the guarded request.
            const central=admin.split("\\n").find(line=>line.includes('workforceTarget&&!scopeFor("workforce")'));
            const twin=admin.split("\\n").find(line=>line.includes('workforceTarget&&scopeFor("workforce")'));
            assert.ok(central&&twin,"Both canonical Workforce entry modes must remain mounted");
            assert.match(central,/companies=\\{data\\?\\.companies\\|\\|\\[\\]\\}/);
            assert.match(central,/request=\\{request\\}/);
            assert.match(twin,/companies=\\{twinCompanies\\}/);
            assert.match(twin,/request=\\{requestFor\\("workforce"\\)\\}/);
            assert.match(twin,/returnFromTwin\\("workforce"\\)/);'''
          p.write_text(s[:start]+new+s[end:])
          p=Path('CHECKPOINTS/CHANGES/2026-10-10-n40-scoped-navigation.md')
          p.write_text(p.read_text()+'''\n\n## Explicit canonical Workforce entry modes\n\nFull CI38042410725 remained failed with one legacy Workforce source assertion demanding the literal central companies prop. Its logged employee-rules-shifts filename could not be resolved through repository reads; no generated-file cause is established. The actual canonical central entry now remains an explicit unchanged JSX branch with all authorized companies, while a mutually exclusive Twin-origin branch receives only the exact pair and guarded request. This is executable behavior, not a comment added to satisfy a pattern. The existing mounted tests verify both real entry paths. No test is skipped or removed, no business/permission implementation changed. Local Node22 rerun62 PASS/0 FAIL/0 SKIP. Normal full CI still required on the resulting exact head; overall N40 OPEN and authenticated LAB NOT TESTED.\n''')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated test dependencies
        run: npm install
      - name: Verify both canonical modes and all protected N40 regressions
        run: node --test server/test/ai-command-twin-selection.test.js server/test/ai-command-twin-selection-ui.test.js server/test/ai-command-twin-navigation.test.js server/test/ai-command-twin-navigation-ui.test.js server/test/super-admin-ai-command-center-phase1.test.js server/test/workforce-v2-rules-shift-templates.test.js
      - name: Build existing Work frontend
        run: npm run build
      - name: Publish only bounded source changes and remove temporary integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/n40-workforce-entry-20261010.yml
          git add client/src/components/platform/PlatformAdminApp.jsx server/test/workforce-v2-rules-shift-templates.test.js CHECKPOINTS/CHANGES/2026-10-10-n40-scoped-navigation.md
          git diff --cached --check
          git commit -m 'fix(n40): keep central and Twin Workforce entry modes explicit'
          git push origin HEAD:refs/heads/fix/n40-twin-navigation-20261010
