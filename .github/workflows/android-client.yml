name: Android Chat preview
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android build SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile, unit tests and lint
        run: gradle --no-daemon -p android :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Start isolated virtual audio for capture tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_video
          pactl set-default-sink ci_video
          pactl set-default-source ci_video.monitor
          pactl load-module module-native-protocol-unix socket="$RUNNER_TEMP/native-video-pulse.sock"
          echo "PULSE_SERVER=unix:$RUNNER_TEMP/native-video-pulse.sock" >> "$GITHUB_ENV"
          echo "QEMU_AUDIO_DRV=pa" >> "$GITHUB_ENV"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify 2FA background and activity recreation on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          # The default -noaudio cannot exercise an actual audio/video recorder. No host mic access.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: |
            if ! gradle --no-daemon -p android :app:connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=gr.myworkstation.chat.VideoActivityTest#emulatorCaptureProducesPlayableMp4InRamWithoutLocalVideo'; then
              adb logcat -b main -b system -d -v brief -s MediaRecorder:V MediaRecorderJNI:V MediaRecorderClient:V StagefrightRecorder:V MPEG4Writer:V ACodec:V CCodec:V Codec2Client:V AudioRecord:V AudioSource:V Camera3-Device:V FuseAppLoop:V AppFuseBridge:V
              exit 1
            fi
            gradle --no-daemon -p android :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: MyWorkStation-Android-Preview
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/androidTests/
          if-no-files-found: error
