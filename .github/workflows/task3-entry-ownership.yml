name: Task3 isolated workspace ownership regression
on:
  push:
    branches: [tools/task3-entry-ownership-20261105]
    paths:
      - .github/workflows/task3-entry-ownership.yml
      - tools/task3-entry-ownership-sync.py
permissions:
  contents: write
jobs:
  reconcile-and-verify:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app' && github.ref == 'refs/heads/tools/task3-entry-ownership-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconcile latest peer claim without changing tested runtime
        run: |
          set -o pipefail
          mkdir -p /tmp/task3-entry-ownership-sync
          node --version > /tmp/task3-entry-ownership-sync/node-version.txt
          python3 -m pip install --disable-pip-version-check reportlab==4.4.9 PyMuPDF==1.26.7
          python3 tools/task3-entry-ownership-sync.py 2>&1 | tee /tmp/task3-entry-ownership-sync/records.log
      - name: Install isolated dependencies without startup or database scripts
        run: npm install --ignore-scripts
      - name: Verify all focused regressions again
        run: |
          set -o pipefail
          timeout 90s node --test server/test/store-invoice-entry-mounted.test.mjs server/test/backoffice-workspace-stability.test.js server/test/backoffice-common-store-ui.test.js server/test/backoffice-session-boundary-mounted.test.mjs server/test/invoice-inbox-day-archive-ui.test.js server/test/invoice-common-credit-ui.test.js 2>&1 | tee /tmp/task3-entry-ownership-sync/green.tap
      - name: Retain allowlisted outputs on helper branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          out=Path('/tmp/task3-entry-ownership-sync');tap=(out/'green.tap').read_text()
          for key,value in [('tests',40),('pass',40),('fail',0),('cancelled',0),('skipped',0)]:assert re.search(r'^# '+key+' '+str(value)+r'$',tap,re.M),key
          paths=json.loads((out/'allowed.json').read_text());subprocess.run(['git','add','--',*paths],check=True)
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines());assert staged==set(json.loads((out/'staged.json').read_text())),staged
          subprocess.run(['git','diff','--cached','--check','--',*[p for p in paths if not p.endswith('.pdf')]],check=True)
          PY
          test "$(git ls-remote origin refs/heads/tools/task3-entry-ownership-20261105 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'task3: retain latest peer claim around verified ownership source; helper only'
          git push origin HEAD:refs/heads/tools/task3-entry-ownership-20261105
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          out=Path('/tmp/task3-entry-ownership-sync');paths=json.loads((out/'allowed.json').read_text())
          rows=[{'path':p,'mode':'100644','type':'blob','sha':subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()} for p in paths]
          (out/'output-tree.json').write_text(json.dumps(rows,indent=2));(out/'output-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task3-entry-ownership-sync
          path: /tmp/task3-entry-ownership-sync/
          if-no-files-found: error
          retention-days: 7
