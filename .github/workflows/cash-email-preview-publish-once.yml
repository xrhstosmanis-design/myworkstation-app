name: Cash email full preview one-time tracker synchronization
on:
  push:
    branches: [fix/cash-email-preview-20261107]
    paths: ['.github/workflows/cash-email-preview-publish-once.yml']
permissions:
  contents: write
concurrency:
  group: cash-email-preview-publish-once
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_DATE_EPOCH: '1794082743'
      PYTHONHASHSEED: '0'
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/workflows
            CHECKPOINTS/CHANGES
            CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md
            docs/roadmap
            output/pdf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic tracker PDF tools
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.9
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core poppler-utils
      - name: Prepend bounded status and preserve existing registry suffixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, re, subprocess, os
          import reportlab
          assert reportlab.Version=='4.4.9'
          claim=Path('CHECKPOINTS/CHANGES/2026-11-07-cash-email-preview-ui.md')
          assert claim.exists() and 'SOURCE CANDIDATE' in claim.read_text()
          marker='07/11/2026 - CASH-UNIFIED-AUDIT-15 - FULL EMAIL PREVIEW UI CANDIDATE'
          prefix=(
            '## '+marker+'\n\n'
            'Retained owner codex/cash-chat-reconciliation-20261026 with /root coordination; no transfer. '
            'Before-source claim #3710 merged. PR #3711 (fix/cash-email-preview-20261107) '
            'replaces oversized native cash-email dialogs with a complete scrollable in-app '
            'system-generated report preview and explicit Send/Cancel for owner, self preview '
            'and not-ready visibility. Original backend reader, arithmetic, permissions, '
            'fingerprint/generation, recipients, SMTP and schedules unchanged. '
            'Synthetic >10,240-character mounted UI regression and atomic double-send, '
            'stale-store/day and pending-readiness checks added. Exact CI and LIVE recheck '
            'remain pending; no actual email sent and no financial, review, provider, bank '
            'or fiscal mutation. Prior limited PASS and the real 10,240-character preview '
            'FAIL remain preserved. Separate approval of exact outbound recipients required. '
            'Checkpoint: CHECKPOINTS/CHANGES/2026-11-07-cash-email-preview-ui.md.\n\n'
          ).encode('utf-8')
          paths=[
            'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md',
            'docs/roadmap/OPEN_WORK_TRACKER.md',
            'docs/roadmap/PENDING_WORK.md'
          ]
          old={}
          for name in paths:
            p=Path(name);original=p.read_bytes()
            assert marker.encode('utf-8') not in original[:4096],name+' already modified'
            old[name]=(len(original),hashlib.sha256(original).hexdigest())
            p.write_bytes(prefix+original)
            assert p.read_bytes().endswith(original)
          import reportlab.rl_config
          reportlab.rl_config.invariant=1
          from runpy import run_path
          run_path('docs/roadmap/generate-open-work-tracker.py',run_name='__main__')
          out=Path('output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf')
          dest=Path('docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf')
          shutil.copyfile(out,dest)
          assert out.read_bytes()==dest.read_bytes()
          info=subprocess.check_output(['pdfinfo',str(out)],text=True)
          pages=int(re.search(r'^Pages:\s+(\d+)',info,re.M).group(1))
          assert pages>500,pages
          extracted=subprocess.check_output(['pdftotext','-f','1','-l','2','-layout',str(out),'-'],text=True)
          assert marker in extracted or 'FULL EMAIL PREVIEW' in extracted
          print('Preserved originals:',old)
          print('PDF pages:',pages,'PDF SHA256:',hashlib.sha256(out.read_bytes()).hexdigest())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md docs/roadmap/OPEN_WORK_TRACKER.md docs/roadmap/PENDING_WORK.md docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf
          git rm -- .github/workflows/cash-email-preview-publish-once.yml
          git diff --cached --check
          git commit -m "docs(cash): synchronize bounded native full-preview UI candidate"
          git push origin HEAD:refs/heads/fix/cash-email-preview-20261107
          git log -1 --format='Published %H'
