name: efood Render checkpoint sync main once

on:
  push:
    branches:
      - docs/efood-render-deploy-checkpoint
    paths:
      - .github/workflows/efood-render-sync-main-once.yml

permissions:
  contents: write

jobs:
  sync-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/efood-render-deploy-checkpoint
          fetch-depth: 0

      - name: Merge latest main and preserve both checkpoints
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          unexpected="$(printf '%s\n' "$conflicts" | grep -v -E '^CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05\.md$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "$unexpected"
            git merge --abort
            exit 1
          fi

          if printf '%s\n' "$conflicts" | grep -qx 'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md'; then
            git checkout --theirs CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md
            git add CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md
          fi

          if [ "$merge_rc" -ne 0 ] && [ -n "$(git diff --name-only --diff-filter=U || true)" ]; then
            echo "Expected conflict was not fully resolved."
            git merge --abort
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          heading = "## 2026-09-13 — efood / Pelican Indirect POS — αποκλειστικά LAB"
          section = [
              heading,
              "",
              "- [x] Υλοποιήθηκε και συγχωνεύτηκε στο κεντρικό `main` μέσω PR #775 / merge `eb97190e`.",
              "- [x] CI #1972, #1973, #1985 και #1987: PASS σε όλα τα gates.",
              "- [x] Κλειδώθηκε server-side το μοναδικό test scope: `MYWORKSTATION LAB / ΕΡΓΑΣΤΗΡΙΟ ΔΟΚΙΜΩΝ`.",
              "- [x] Ρύθμιση efood, mock webhooks, product mappings, Catalog/Promo/Orders previews και δημόσιο webhook απορρίπτονται σε ΚΑΤ ή άλλο πραγματικό κατάστημα.",
              "- [x] Προστέθηκε πλήρης ασφαλής LAB mock ροή: `READY_FOR_PICKUP`, idempotent replay, `CANCELLED`, Catalog, Promo, Orders recovery και readiness.",
              "- [x] Η ροή παραμένει fail-closed: `externalCall=false`, χωρίς OnlineOrder/Sale, stock, τιμή, προσφορά, πληρωμή, RBS/CapDriver/EFTPOS ή fiscal.",
              "- [x] Render workflow #1054 και `Wait for exact production revision`: PASS για το deployed `main` `b6262b8f`.",
              "- [ ] Εκκρεμεί live πάτημα `Πλήρης ασφαλής LAB δοκιμή` μόνο από Platform Super Admin στο μόνιμο LAB.",
              "- [ ] Αναμονή από efood για test Vendor ID, portal access, sandbox credentials και webhook Authorization πριν από πραγματικό sandbox event.",
          ]

          try:
              start = lines.index(heading)
          except ValueError:
              start = 0
          end = start + 1
          while end < len(lines) and not (lines[end].startswith("## ") and lines[end] != heading):
              end += 1
          rest = lines[end:]
          while rest and not rest[0].strip():
              rest.pop(0)
          path.write_text("\n".join(section + [""] + rest).rstrip() + "\n", encoding="utf-8")
          PY

          git add -A
          git commit -m "Sync latest main into efood Render checkpoint"
          git push origin HEAD:docs/efood-render-deploy-checkpoint
