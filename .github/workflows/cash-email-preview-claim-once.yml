name: Cash email full preview before-source claim
on:
  push:
    branches: [docs/cash-email-preview-claim-20261107]
    paths: ['.github/workflows/cash-email-preview-claim-once.yml']
permissions:
  contents: write
concurrency:
  group: cash-email-preview-claim-once
  cancel-in-progress: false
jobs:
  preserve-once:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app' && github.ref == 'refs/heads/docs/cash-email-preview-claim-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_DATE_EPOCH: '1794082743'
      PYTHONHASHSEED: '0'
      TZ: UTC
    steps:
      - name: Checkout exact documentation input
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            CHECKPOINTS/CHANGES
            CHECKPOINTS/EVIDENCE/cash-system-email-20261107
            docs/manual/cash-control
            docs/roadmap
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documented PDF renderer
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.9
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-dejavu-core
      - name: Preserve registries, verify generated PDF and remove helper
        env:
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, os, json, hashlib, re, unicodedata, shutil
          import reportlab
          MAIN='be3844895e807db469c3d3571cefa42bd7f3ec1c'
          BRANCH='docs/cash-email-preview-claim-20261107'
          WORKFLOW='.github/workflows/cash-email-preview-claim-once.yml'
          INPUT_PATHS=['.github/workflows/cash-email-preview-claim-once.yml', 'CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md', 'CHECKPOINTS/EVIDENCE/cash-system-email-20261107/native-preview.json']
          FINAL_PATHS=['CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md', 'CHECKPOINTS/EVIDENCE/cash-system-email-20261107/native-preview.json', 'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md', 'docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf', 'docs/roadmap/OPEN_WORK_TRACKER.md', 'docs/roadmap/PENDING_WORK.md', 'output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf']
          TEXT_SHAS={'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md': 'cb4edf544c57b558ffdc1badf935c541507d4020c6790471306c9ebb5a3a4c9f', 'docs/roadmap/OPEN_WORK_TRACKER.md': 'cb30f392a6d231706c8c2f90e6fe34dcaa3fd94d4305dbffe8d5881bee1b19ab', 'docs/roadmap/PENDING_WORK.md': '6d3b90b7a9fb612c3afb311508775ef78cf3dd0f77f5002ea5505f1068d4808b', 'CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md': '7f05916337c56ecfffaa52f37de41ba51fc2813440847862408f361fb292f9c8', 'CHECKPOINTS/EVIDENCE/cash-system-email-20261107/native-preview.json': '2a5fb28423f179132bbd662515fb50fe09a74ebd94a93fa258596694972857d9'}
          PREFIXES={'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md': {'prefix': '## 07/11/2026 22:19:03 Europe/Athens - CASH-UNIFIED-AUDIT-15 / FULL NATIVE PREVIEW FAIL / UI CLAIM BEFORE SOURCE\n\nRetained owner codex/cash-chat-reconciliation-20261026 with /root coordination; no transfer. Source PR #3708 is installed at be3844895e807db469c3d3571cefa42bd7f3ec1c. Claim branch docs/cash-email-preview-claim-20261107; future implementation fix/cash-email-preview-20261107. OPEN / ASSIGNED / AWAITING UI IMPLEMENTATION AND LAB.\n\nActual native preview opened on 07/11 at 20:10:42.209 UTC and was observed by 20:11:08.808 UTC. Full-mode content was visible: three pending full-audit rows, the canonical system follow-up sentence, duplicate evidence and cached/unread papers. However, the observed message stopped at exactly 10,240 characters mid-paper line; recipients and final instructions were not visible. Overall full-preview acceptance is FAIL, not PASS. This observation does not establish a universal browser limit or complete-body parity.\n\nThe comment field was empty; no comment was typed. Cancel at 20:14:15.269 UTC closed the dialog and restored the native button. No email was sent. Delivery remains NOT TESTED / NOT SENT and exact-recipient approval remains outstanding. Financial/source reconciliation stays OPEN; prior 03/11 source evidence, 04/11 basic/full scoped PASS and 07/11 no-charge LIVE UI PASS remain protected.\n\nBounded UI correction only: replace the oversized browser dialog with a scrollable in-app complete system preview, visible recipients, optional blank comment and explicit Send/Cancel. Preserve the installed full reader, canonical text, readiness/auth/store/day/fingerprint/generation/stale-context/double-submit guards. No schedules, paid providers, recipient changes, financial/review writes or new send authorization. No new manual PASS; existing limited short-preview history is not contradicted.\n\nNext: merge this documentation-only claim after applicable CI before UI source edits, then verify long-body completeness and guards with synthetic tests and separately authorized native preview/cancel acceptance. Do not repeat the completed no-charge button or any outbound action. Checkpoint: CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md; sanitized evidence: CHECKPOINTS/EVIDENCE/cash-system-email-20261107/native-preview.json. Every prior registry byte and peer owner retained.\n\n', 'oldSha256': '7923fee97726cfa900a4140f3f28d5c018cdb7442a5511eefefb1323ac0de8f8', 'oldBytes': 5313842, 'newSha256': 'cb4edf544c57b558ffdc1badf935c541507d4020c6790471306c9ebb5a3a4c9f'}, 'docs/roadmap/OPEN_WORK_TRACKER.md': {'prefix': '## 07/11/2026 22:19:03 Europe/Athens - CASH-UNIFIED-AUDIT-15 / FULL NATIVE PREVIEW FAIL / UI CLAIM BEFORE SOURCE\n\nRetained owner codex/cash-chat-reconciliation-20261026 with /root coordination; no transfer. Source PR #3708 is installed at be3844895e807db469c3d3571cefa42bd7f3ec1c. Claim branch docs/cash-email-preview-claim-20261107; future implementation fix/cash-email-preview-20261107. OPEN / ASSIGNED / AWAITING UI IMPLEMENTATION AND LAB.\n\nActual native preview opened on 07/11 at 20:10:42.209 UTC and was observed by 20:11:08.808 UTC. Full-mode content was visible: three pending full-audit rows, the canonical system follow-up sentence, duplicate evidence and cached/unread papers. However, the observed message stopped at exactly 10,240 characters mid-paper line; recipients and final instructions were not visible. Overall full-preview acceptance is FAIL, not PASS. This observation does not establish a universal browser limit or complete-body parity.\n\nThe comment field was empty; no comment was typed. Cancel at 20:14:15.269 UTC closed the dialog and restored the native button. No email was sent. Delivery remains NOT TESTED / NOT SENT and exact-recipient approval remains outstanding. Financial/source reconciliation stays OPEN; prior 03/11 source evidence, 04/11 basic/full scoped PASS and 07/11 no-charge LIVE UI PASS remain protected.\n\nBounded UI correction only: replace the oversized browser dialog with a scrollable in-app complete system preview, visible recipients, optional blank comment and explicit Send/Cancel. Preserve the installed full reader, canonical text, readiness/auth/store/day/fingerprint/generation/stale-context/double-submit guards. No schedules, paid providers, recipient changes, financial/review writes or new send authorization. No new manual PASS; existing limited short-preview history is not contradicted.\n\nNext: merge this documentation-only claim after applicable CI before UI source edits, then verify long-body completeness and guards with synthetic tests and separately authorized native preview/cancel acceptance. Do not repeat the completed no-charge button or any outbound action. Checkpoint: CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md; sanitized evidence: CHECKPOINTS/EVIDENCE/cash-system-email-20261107/native-preview.json. Every prior registry byte and peer owner retained.\n\n', 'oldSha256': 'fefb45db0ee804e7f4c6f4ba851878eb99b1f51d88943dc7c04c801a388dbab8', 'oldBytes': 4133109, 'newSha256': 'cb30f392a6d231706c8c2f90e6fe34dcaa3fd94d4305dbffe8d5881bee1b19ab'}, 'docs/roadmap/PENDING_WORK.md': {'prefix': '## 07/11/2026 22:19:03 Europe/Athens - CASH-UNIFIED-AUDIT-15 / FULL NATIVE PREVIEW FAIL / UI CLAIM BEFORE SOURCE\n\nRetained owner codex/cash-chat-reconciliation-20261026 with /root coordination; no transfer. Source PR #3708 is installed at be3844895e807db469c3d3571cefa42bd7f3ec1c. Claim branch docs/cash-email-preview-claim-20261107; future implementation fix/cash-email-preview-20261107. OPEN / ASSIGNED / AWAITING UI IMPLEMENTATION AND LAB.\n\nActual native preview opened on 07/11 at 20:10:42.209 UTC and was observed by 20:11:08.808 UTC. Full-mode content was visible: three pending full-audit rows, the canonical system follow-up sentence, duplicate evidence and cached/unread papers. However, the observed message stopped at exactly 10,240 characters mid-paper line; recipients and final instructions were not visible. Overall full-preview acceptance is FAIL, not PASS. This observation does not establish a universal browser limit or complete-body parity.\n\nThe comment field was empty; no comment was typed. Cancel at 20:14:15.269 UTC closed the dialog and restored the native button. No email was sent. Delivery remains NOT TESTED / NOT SENT and exact-recipient approval remains outstanding. Financial/source reconciliation stays OPEN; prior 03/11 source evidence, 04/11 basic/full scoped PASS and 07/11 no-charge LIVE UI PASS remain protected.\n\nBounded UI correction only: replace the oversized browser dialog with a scrollable in-app complete system preview, visible recipients, optional blank comment and explicit Send/Cancel. Preserve the installed full reader, canonical text, readiness/auth/store/day/fingerprint/generation/stale-context/double-submit guards. No schedules, paid providers, recipient changes, financial/review writes or new send authorization. No new manual PASS; existing limited short-preview history is not contradicted.\n\nNext: merge this documentation-only claim after applicable CI before UI source edits, then verify long-body completeness and guards with synthetic tests and separately authorized native preview/cancel acceptance. Do not repeat the completed no-charge button or any outbound action. Checkpoint: CHECKPOINTS/CHANGES/2026-11-07-cash-system-generated-email.md; sanitized evidence: CHECKPOINTS/EVIDENCE/cash-system-email-20261107/native-preview.json. Every prior registry byte and peer owner retained.\n\n', 'oldSha256': '93e6418231dc4c772888ef24e3a302659da84b12e2a6c6149b2b5128e9df2f54', 'oldBytes': 3660116, 'newSha256': '6d3b90b7a9fb612c3afb311508775ef78cf3dd0f77f5002ea5505f1068d4808b'}}
          PDFS=['output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf', 'docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf']
          EXPECTED_PAGES=976
          EXPECTED_PDF_TEXT_SHA='0574f58375867904c90e8369983e8045b7d261edb5e5b35ccb37ee16f8a35ac4'
          def git(*a):return subprocess.check_output(['git',*a])
          def sha(b):return hashlib.sha256(b).hexdigest()
          event=os.environ['EVENT_SHA']
          assert reportlab.Version=='4.4.9'
          assert git('rev-parse','HEAD').decode().strip()==event
          assert git('rev-parse','HEAD^').decode().strip()==MAIN
          assert sorted(git('diff','--name-only',MAIN,'HEAD').decode().splitlines())==INPUT_PATHS
          subprocess.run(['git','fetch','--filter=blob:none','origin','refs/heads/main:refs/remotes/origin/main','refs/heads/'+BRANCH+':refs/remotes/origin/cash-email-preview-claim-check'],check=True)
          assert git('rev-parse','refs/remotes/origin/main').decode().strip()==MAIN,'main advanced; stop for review'
          assert git('rev-parse','refs/remotes/origin/cash-email-preview-claim-check').decode().strip()==event,'branch advanced; stop for review'
          for path, spec in PREFIXES.items():
              original=git('show',MAIN+':'+path)
              assert len(original)==spec['oldBytes'] and sha(original)==spec['oldSha256']
              data=spec['prefix'].encode()+original
              assert data.endswith(original) and sha(data)==spec['newSha256']
              Path(path).write_bytes(data)
          for path, expected in TEXT_SHAS.items():assert sha(Path(path).read_bytes())==expected,path+' differs from reviewed bytes'
          subprocess.run(['python3','-c',"import reportlab.rl_config,runpy; reportlab.rl_config.invariant=1; runpy.run_path('docs/roadmap/generate-open-work-tracker.py',run_name='__main__')"],check=True)
          shutil.copyfile(PDFS[0],PDFS[1])
          assert Path(PDFS[0]).read_bytes()==Path(PDFS[1]).read_bytes()
          pdf_text=subprocess.check_output(['pdftotext','-layout',PDFS[0],'-']).decode()
          normalized=' '.join(unicodedata.normalize('NFC',pdf_text).split())
          assert sha(normalized.encode())==EXPECTED_PDF_TEXT_SHA,'PDF text differs from reviewed generation'
          info=subprocess.check_output(['pdfinfo',PDFS[0]]).decode()
          assert int(re.search(r'^Pages:\s+(\d+)',info,re.M).group(1))==EXPECTED_PAGES,'PDF pagination changed'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--sparse','--',*FINAL_PATHS],check=True)
          subprocess.run(['git','rm','--',WORKFLOW],check=True)
          subprocess.run(['git','diff','--cached','--check',MAIN,'--',*TEXT_SHAS.keys()],check=True)
          assert sorted(git('diff','--cached','--name-only',MAIN).decode().splitlines())==FINAL_PATHS
          assert not git('diff','--name-only').strip(),'unstaged changes'
          subprocess.run(['git','commit','-m','docs(cash): claim native full preview truncation correction'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+BRANCH],check=True)
          print('Published commit:',git('rev-parse','HEAD').decode().strip())
          print('Published tree:',git('rev-parse','HEAD^{tree}').decode().strip())
          print('PDF pages:',EXPECTED_PAGES)
          print('PDF SHA256:',sha(Path(PDFS[0]).read_bytes()))
          print('Verified normalized PDF text SHA256:',EXPECTED_PDF_TEXT_SHA)
          print('Preserved registry byte counts:',json.dumps({p:s['oldBytes'] for p,s in PREFIXES.items()}))
          PY
