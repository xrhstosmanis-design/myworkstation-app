name: Cash registry one-shot lossless insertion
on:
  push:
    branches:
      - feat/cash-audit-clean-main-20261105
    paths:
      - '.github/workflows/cash-registry-sync-once.yml'
permissions:
  contents: write
jobs:
  reconcile-once:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated cash branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Exact-head lossless insert and self-cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected_parent="774681c23e822fa4d60f1698eb67df2264e6cbb8"
          expected_blob="18e2b2133e5d64f50fc27aa2a904beec077894f9"
          entry="## 05/11/2026 — CASH-ADJACENT-COUNT-21 / AUTOMATIC CASH AUDIT / DRAFT SOURCE INTEGRATION\n\nPR #3683 (feat/cash-audit-clean-main-20261105) integrates 15 cash-only source/test/checkpoint files over main 759311ed86ad3d58f77b6819fb408043a60f6031 without overwriting parallel tasks. Previous pre-integration CI rerun 42064325969 passed 5/5, but merged-head run 42086169126 stopped at the mandatory active-list gate before executing full source tests; this additive entry fixes that prerequisite, not an implementation PASS. BackOffice selected-store automatic audit remains read-only and without paid OCR. Uncertain counting pairs or paper evidence require HOLD/review, never automatic OFFSET, cash movement or employee charge. Pending: exact-head full CI, review, authenticated selected-store LAB acceptance, and guarded release. No production deploy or financial mutation. Task-local checkpoint: CHECKPOINTS/CHANGES/2026-11-05-cash-adjacent-counting.md.\n\n".encode("utf-8")
          parent=subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip()
          if parent != expected_parent: raise SystemExit('ABORT unexpected branch parent')
          p=Path('CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md')
          existing=p.read_bytes()
          blob=subprocess.check_output(['git','hash-object',str(p)], text=True).strip()
          if blob != expected_blob: raise SystemExit('ABORT registry blob mismatch')
          if len(existing) < 5000000 or not existing.startswith(b'## 05/11/2026 - OCR4'): raise SystemExit('ABORT registry size/header mismatch')
          if entry in existing: raise SystemExit('ABORT duplicate entry')
          p.write_bytes(entry+existing)
          updated=p.read_bytes()
          if updated[:len(entry)] != entry or updated[len(entry):] != existing: raise SystemExit('ABORT non-lossless output')
          print(f'LOSSLESS REGISTRY INSERT: preserved {len(existing)} bytes, prefixed {len(entry)} bytes')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/cash-registry-sync-once.yml
          git add -- CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --name-only
          git commit -m 'docs(cash): sync active list losslessly, remove one-shot helper'
          git push origin HEAD:refs/heads/feat/cash-audit-clean-main-20261105
