name: efood sync latest main and self-clean

on:
  push:
    branches:
      - feat/efood-pelican-foundation
    paths:
      - .github/workflows/efood-sync-latest-once.yml

permissions:
  contents: write

jobs:
  sync-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout efood feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/efood-pelican-foundation
          fetch-depth: 0

      - name: Merge latest main, update checkpoints and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"

          if ! git merge-base --is-ancestor origin/main HEAD; then
            set +e
            git merge --no-ff --no-commit origin/main
            merge_rc=$?
            set -e

            conflicts="$(git diff --name-only --diff-filter=U || true)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v -E '^(CHECKPOINTS/ACTIVE\.md|CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05\.md)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unexpected"
              git merge --abort
              exit 1
            fi

            if printf '%s\n' "$conflicts" | grep -qx 'CHECKPOINTS/ACTIVE.md'; then
              git checkout --theirs CHECKPOINTS/ACTIVE.md
            fi
            if printf '%s\n' "$conflicts" | grep -qx 'CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md'; then
              git checkout --theirs CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md
            fi

            if [ "$merge_rc" -ne 0 ] && [ -n "$(git diff --name-only --diff-filter=U || true)" ]; then
              echo "Expected conflicts were not fully resolved."
              git merge --abort
              exit 1
            fi
          fi

          section_file="$(mktemp)"
          cat > "$section_file" <<'EOF'
          ## 2026-09-13 — efood / Pelican Indirect POS — Phase A

          - [x] Εγκρίθηκε και υλοποιήθηκε σε ξεχωριστό branch η fail-closed βάση της Indirect POS διασύνδεσης μέσω Pelican.
          - [x] Προστέθηκαν μόνο SANDBOX ρυθμίσεις ανά εταιρεία/κατάστημα, κρυπτογράφηση credentials/raw payload, idempotency, tenant/store isolation, local mock validation, product mappings και Catalog/Promo/Orders previews χωρίς εξωτερική κλήση.
          - [x] Το live webhook, η δημιουργία OnlineOrder/πώλησης, το stock, οι τιμές/προσφορές, οι πληρωμές, RBS/CapDriver/EFTPOS και η φορολογική έκδοση παραμένουν ρητά ανενεργά.
          - [x] Τοπικοί έλεγχοι: server syntax PASS, JSX parse PASS και `efood-pelican-foundation-v1.test.js` 9/9 PASS.
          - [ ] Εκκρεμούν πλήρες GitHub CI, draft PR review και μετά local mock LAB έλεγχος.
          - [ ] Αναμονή από efood για test Vendor ID, portal access, sandbox credentials και webhook Authorization. Απαιτείται νέα ρητή έγκριση πριν από live sandbox webhook ή πραγματικό API call.

          EOF
          sed -i 's/^          //' "$section_file"

          target="CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md"
          if ! grep -Fq 'efood / Pelican Indirect POS — Phase A' "$target"; then
            cat "$section_file" "$target" > "${target}.tmp"
            mv "${target}.tmp" "$target"
          fi

          cat > CHECKPOINTS/ACTIVE.md <<EOF
          # ACTIVE CHECKPOINT

          - Ημερομηνία: 2026-09-13
          - Εργασία: efood / Pelican Indirect POS — Phase A fail-closed foundation
          - Branch: \`feat/efood-pelican-foundation\`
          - Βάση branch: σημερινό \`main\` \`${main_sha}\`
          - Draft PR: \`#758\`
          - Κατάσταση: ΣΕ ΔΟΚΙΜΗ — αναμονή πλήρους GitHub CI, LAB mock validation και test vendor από efood
          - Checkpoint αλλαγών: \`CHECKPOINTS/CHANGES/2026-09-13-efood-pelican-phase-a-foundation.md\`

          ## Όρια της εγκεκριμένης εργασίας

          - Επιτρέπεται μόνο ασφαλής προετοιμασία SANDBOX, local mocks, κρυπτογραφημένη αποθήκευση, idempotency και tenant/store-scoped mappings/previews.
          - Απαγορεύεται πραγματική κλήση efood, ενεργό live webhook, δημιουργία παραγγελίας/πώλησης, αλλαγή stock/τιμής/προσφοράς, πληρωμή ή φορολογική έκδοση.
          - Δεν γίνεται merge στο \`main\` χωρίς πράσινο πλήρες CI και νέα ρητή έγκριση.

          ## Επόμενο βήμα

          1. Πλήρες GitHub CI στο draft PR #758.
          2. Μετά από PASS, local mock έλεγχος μόνο στο \`MYWORKSTATION LAB\`.
          3. Αναμονή test Vendor ID / portal / sandbox credentials / Authorization από efood.
          EOF
          sed -i 's/^          //' CHECKPOINTS/ACTIVE.md

          MAIN_SHA="$main_sha" python - <<'PY'
          from pathlib import Path
          import os, re
          path = Path('CHECKPOINTS/CHANGES/2026-09-13-efood-pelican-phase-a-foundation.md')
          text = path.read_text(encoding='utf-8')
          sha = os.environ['MAIN_SHA']
          text = re.sub(r'- \*\*Βάση:\*\*.*', f'- **Βάση:** σημερινό `main` commit `{sha}`', text, count=1)
          text = re.sub(r'- \*\*Συγχρονισμός:\*\*.*', '- **Συγχρονισμός:** το νεότερο `main` συγχωνεύτηκε μόνο προς το feature branch. Δεν έγινε merge της efood εργασίας στο `main`.', text, count=1)
          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/efood-sync-latest-once.yml
          git add CHECKPOINTS/ACTIVE.md CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md CHECKPOINTS/CHANGES/2026-09-13-efood-pelican-phase-a-foundation.md
          git add -A
          git commit -m "Sync latest main into efood Pelican Phase A"
          git push origin HEAD:feat/efood-pelican-foundation
