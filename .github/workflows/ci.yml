name: MyWorkStation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myworkstation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d myworkstation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      JWT_SECRET: test-only-ci-jwt-secret-with-sufficient-length
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/myworkstation_test
      INITIAL_ADMIN_EMAIL: ci-admin@myworkstation.test
      INITIAL_ADMIN_PASSWORD: ci-only-password-not-for-production
      KAT_OWNER_EMAIL: ci-kat-owner@myworkstation.test
      KAT_OWNER_NAME: CI KAT Owner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npm run prisma:generate -w server
      - name: Run security and licensing tests
        run: npm test -w server
      - name: Build client and Prisma client
        run: npm run build
      - name: Verify KAT production preparation invariants
        run: node server/e2e/kat-preparation-source-invariants.mjs
      - name: Verify KAT Windows observer safety invariants
        run: node server/e2e/kat-windows-observer-source-invariants.mjs
      - name: Verify KAT backup restore safety invariants
        run: node server/e2e/pilot-backup-restore-source-invariants.mjs
      - name: Prepare isolated E2E database
        run: |
          npm run prisma:push -w server
          npm run seed -w server
      - name: Run real HTTP E2E flows
        run: |
          PORT=8080 npm run start -w server > /tmp/myworkstation-e2e-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          on_error() { status=$?; echo "--- MyWorkStation E2E server log ---"; cat /tmp/myworkstation-e2e-server.log || true; exit "$status"; }
          trap cleanup EXIT
          trap on_error ERR
          node --input-type=module <<'NODE'
          const url="http://127.0.0.1:8080/api/health";
          let lastError;
          for(let attempt=0;attempt<40;attempt++){
            try{
              const response=await fetch(url);
              if(response.ok){
                const body=await response.json();
                if(body?.ok===true){
                  console.log("Real HTTP health check passed",body);
                  process.exit(0);
                }
              }
            }catch(error){lastError=error}
            await new Promise(resolve=>setTimeout(resolve,500));
          }
          console.error("Server did not become healthy",lastError);
          process.exit(1);
          NODE
          node server/e2e/payment-shift-flow.mjs
          node server/e2e/ai-reader-payment-flow.mjs
          node server/e2e/live-operator-permissions-flow.mjs
          node server/e2e/reversal-tenant-isolation-flow.mjs
          node server/e2e/operator-ledger-visibility-flow.mjs
          node server/e2e/payment-boundaries-flow.mjs
          node server/e2e/operator-shift-close-audit-flow.mjs
          node server/e2e/close-shift-permission-separation-flow.mjs
          node server/e2e/eftpos-shift-close-flow.mjs
          node server/e2e/pos-to-shift-backoffice-flow.mjs
          node server/e2e/kat-pos-regression-flow.mjs
          node server/e2e/multi-pos-shift-isolation-flow.mjs
          node server/e2e/kat-online-ordering-flow.mjs
          node server/e2e/kat-preparation-milk-stock-flow.mjs
          cat /tmp/myworkstation-e2e-server.log
