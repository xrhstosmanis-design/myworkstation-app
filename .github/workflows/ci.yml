name: MyWorkStation CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      JWT_SECRET: test-only-ci-jwt-secret-with-sufficient-length
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/myworkstation_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npm run prisma:generate -w server
      - name: Run security and licensing tests
        run: npm test -w server
      - name: Build client and Prisma client
        run: npm run build
