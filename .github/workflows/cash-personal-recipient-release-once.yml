name: Validate and release exact main for cash recipient
on:
  push:
    branches: [ci/cash-personal-recipient-release-20261108]
    paths: [.github/workflows/cash-personal-recipient-release-once.yml]
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$main" = "$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD:server/src/routes/platform-admin.js)" = 3b577b2d8d50893497339b648a31e510fa548aae
          test "$(git rev-parse HEAD:client/src/components/platform/PlatformAdminApp.jsx)" = 6d096344ed155c5064a4e8c30bff7c6422865b68
          start=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run ci.yml --ref main
          for i in $(seq 1 64); do
            sleep 30
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$main&event=workflow_dispatch&per_page=10" --jq ".workflow_runs | map(select(.created_at >= \"$start\")) | first | if .status == \"completed\" then .conclusion else \"\" end")
            if [ "$status" = success ]; then
              test "$main" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
              gh workflow run deploy-render.yml --ref main
              git rm -- .github/workflows/cash-personal-recipient-release-once.yml
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git commit -m "ci: remove completed cash release dispatcher"
              git push origin HEAD:refs/heads/ci/cash-personal-recipient-release-20261108
              exit 0
            fi
            test -z "$status"
          done
          exit 1
