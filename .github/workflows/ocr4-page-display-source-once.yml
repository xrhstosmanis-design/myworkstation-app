name: OCR4 page display source validation (isolated)
on:
  push:
    branches: [build/ocr4-page-display-source-20261105]
    paths: [.github/workflows/ocr4-page-display-source-once.yml, client/src/lib/invoice-file-page-count.js, client/src/lib/invoice-pdf-count-loader.js, client/src/components/store/InvoiceFilePageSummary.jsx, server/test/invoice-file-page-count.test.js, server/test/invoice-file-page-summary.test.js, server/e2e/invoice-file-page-count-flow.mjs]
permissions:
  contents: write
concurrency:
  group: ocr4-page-display-source-20261105
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: 7851efe9889621553790fe920316c6b0a5bdbfcd
      TARGET: fix/ocr4-physical-page-display-20261105
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install isolated recipe reader
        run: python -m pip install PyYAML==6.0.2
      - name: Execute the pinned reviewed recipe with exact label-expectation adaptation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,os,subprocess,yaml
          from pathlib import Path
          # This immutable recipe was authored in this isolated build branch.
          # It never publishes its workflow or ancestry to the clean source PR.
          ref='582777d51ea98b2321555938ddc11ea1b04a3e3a:.github/workflows/ocr4-page-display-source-once.yml'
          raw=subprocess.check_output(['git','show',ref])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='1f51ae7b500f1ddd44b74942ed57d1c5485ded20'
          recipe=yaml.safe_load(raw)
          extra='server/test/supplier-five-photos.test.js server/test/pos-invoice-multipage-upload-v1.test.js'
          def align():
            p=Path('server/test/supplier-five-photos.test.js');d=p.read_bytes()
            assert hashlib.sha1(b'blob '+str(len(d)).encode()+b'\0'+d).hexdigest()=='9dac2323ecd74ed920c502296e2bd79628d22b31'
            s=d.decode();start=s.index('test("actual Basic, Premium');end=s.index('\ntest("phone QR',start);part=s[start:end]
            old='document.querySelectorAll(\'[title="Αφαίρεση σελίδας"]\')'
            assert part.count(old)==4
            part=part.replace('    const select=async numbers','    const removeSelector=name==="StoreSupplierInvoicePremiumFast"?\'[title="Αφαίρεση αρχείου"]\':\'[title="Αφαίρεση σελίδας"]\';\n    const select=async numbers')
            part=part.replace(old,'document.querySelectorAll(removeSelector)');s=s[:start]+part+s[end:];p.write_text(s)
            assert hashlib.sha1(b'blob '+str(len(s.encode())).encode()+b'\0'+s.encode()).hexdigest()=='761718263e9f36ac990a2c869d8ebb0eaf8b616d'
            p=Path('server/test/pos-invoice-multipage-upload-v1.test.js');d=p.read_bytes()
            assert hashlib.sha1(b'blob '+str(len(d)).encode()+b'\0'+d).hexdigest()=='a8cc2ae190de56527a26a437fa4e551f4d09769f'
            s=d.decode();old='  assert.match(client,/Σελίδα \\{index\\+1\\}/);';assert s.count(old)==1
            s=s.replace(old,'  assert.match(client,/Αρχείο \\{index\\+1\\}/);\n  assert.match(client,/<InvoiceFilePageSummary pages=\\{pages\\} scopeKey=\\{store.id\\}/);');p.write_text(s)
            assert hashlib.sha1(b'blob '+str(len(s.encode())).encode()+b'\0'+s.encode()).hexdigest()=='f49548ae316c3147a966ee2f624854d84613ce75'
          failure=None
          for step in recipe['jobs']['source']['steps']:
            if 'run' not in step:continue
            if failure is not None and step.get('if')!='always()':continue
            name=step['name'];script=step['run']
            if name=='Publish clean bounded source tree, never helper workflow or main':
              script=script.replace('server/e2e/invoice-file-page-count-flow.mjs CHECKPOINTS/','server/e2e/invoice-file-page-count-flow.mjs '+extra+' CHECKPOINTS/')
              script=script.replace('-eq 14','-eq 16')
            if name=='Preserve exact tested files and diagnostics even on failure':
              script=script.replace("'server/e2e/invoice-file-page-count-flow.mjs',", "'server/e2e/invoice-file-page-count-flow.mjs','server/test/supplier-five-photos.test.js','server/test/pos-invoice-multipage-upload-v1.test.js',")
            if name=='Record measured source evidence and preserve complete registries':
              script=script.replace('File-based status/removal wording is accurate.','File-based status/removal wording is accurate. Two existing tests now target the exact new file labels for Premium only; original five-file/order/payment assertions and other form expectations remain intact.')
            print('::group::'+name,flush=True)
            try:
              subprocess.run(['bash','--noprofile','--norc','-eo','pipefail','-c',script],check=True,env=dict(os.environ))
              if name=='Apply only reviewed display wiring and wording':align()
              envfile=Path(os.environ['GITHUB_ENV'])
              if envfile.exists():
                for line in envfile.read_text().splitlines():
                  if '=' in line:
                    key,value=line.split('=',1)
                    if key in ['CHROME_BIN','OCR4_PDF_COUNT_SCREENSHOTS']:os.environ[key]=value
            except Exception as error:
              if failure is None:failure=error
              print('::error::'+name+': '+str(error),flush=True)
            finally:print('::endgroup::',flush=True)
          if failure is not None:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr4-page-display-source-validation
          path: ${{ runner.temp }}/ocr4-page-display-source
          retention-days: 7
          if-no-files-found: error
