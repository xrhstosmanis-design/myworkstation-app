name: N40 bounded central entry preparation
on:
  push:
    branches: [fix/n40-twin-navigation-20261010]
    paths: [.github/workflows/n40-central-apply-20261010.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'xrhstosmanis-design/myworkstation-app'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preserve reviewed main and apply only the exact N40 correction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n40-central"
          git config user.name 'MyWorkStation N40 preparation'
          git config user.email 'n40-preparation@users.noreply.github.com'
          git merge --no-edit 4fdba151bc8e1e5fe23f21509f39a0921a3dfbc9
          git rev-parse HEAD > "$RUNNER_TEMP/n40-central/input-revision.txt"
          python3 .github/n40-central-apply.py
          git diff --check
          git diff -- client/src/components/platform/PlatformAdminApp.jsx server/test/ai-command-twin-navigation-ui.test.js > "$RUNNER_TEMP/n40-central/source.diff"
      - name: Install ordinary workspace dependencies
        run: npm install > "$RUNNER_TEMP/n40-central/install.log" 2>&1
      - name: Execute all eight focused regression suites
        shell: bash
        run: |
          set -euo pipefail
          node --test server/test/ai-command-twin-selection.test.js server/test/ai-command-twin-selection-ui.test.js server/test/ai-command-twin-navigation.test.js server/test/ai-command-twin-navigation-ui.test.js server/test/super-admin-ai-command-center-phase1.test.js server/test/workforce-v2-rules-shift-templates.test.js server/test/platform-cash-written-report-v1.test.js server/test/super-admin-analytics-filters-v1.test.js > "$RUNNER_TEMP/n40-central/focused.log" 2>&1
          tail -10 "$RUNNER_TEMP/n40-central/focused.log"
      - name: Build unchanged Work frontend
        run: npm run build > "$RUNNER_TEMP/n40-central/build.log" 2>&1
      - name: Record bounded evidence, remove temporary tooling and publish only own branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          PREPARATION_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          log=(Path(os.environ['RUNNER_TEMP'])/'n40-central/focused.log').read_text()
          def count(name):
              match=re.search(r'^# '+name+r' (\d+)$',log,re.M)
              if not match:raise RuntimeError('Missing TAP summary '+name)
              return int(match.group(1))
          if (count('pass'),count('fail'),count('skipped'))!=(74,0,0):raise RuntimeError('Unexpected focused results')
          note='\n\n## N40 central-entry correction — Node20 preparation / AWAITING FULL CI AND LAB\n\nSame owner `codex/n40-full-twin-navigation-audit-20261010`, PR #2065. Preparation run '+os.environ['PREPARATION_RUN']+' executed eight focused suites: 74 PASS / 0 FAIL / 0 SKIP on Node20, then Work frontend build succeeded. Exact main4fdba151 was merged into this branch without force, preserving other owners. Central Cash/Checks are explicit normal entries; Twin entries remain pinned to the selected store and origin-aware close. New mounted central Checks and strengthened Cash selector/refresh regressions retain all prior tests. Temporary N40 preparation/provenance workflows and applier are removed from the resulting tree. Normal full CI, exact deployment and authenticated six-tile LAB/real Stock return remain required and NOT TESTED. Historical unsupported Stock-log discrepancy is not claimed resolved; independent capacity timing test is untouched. No business, fiscal, stock, staff, camera, permissions, licensing, production or LAB state changes. No manual PASS; full40 OPEN. Checkpoint `CHECKPOINTS/CHANGES/2026-10-10-n40-central-entry-compatibility.md`.\n'
          for name in ['CHECKPOINTS/CHANGES/2026-10-10-n40-central-entry-compatibility.md','CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md','docs/roadmap/OPEN_WORK_TRACKER.md','docs/roadmap/PENDING_WORK.md']:
              p=Path(name);s=p.read_text()
              if '## N40 central-entry correction — Node20 preparation / AWAITING FULL CI AND LAB' in s:raise RuntimeError('Duplicate evidence')
              p.write_text(s+note)
          PY
          git add -- client/src/components/platform/PlatformAdminApp.jsx server/test/ai-command-twin-navigation-ui.test.js CHECKPOINTS/CHANGES/2026-10-10-n40-central-entry-compatibility.md CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md docs/roadmap/OPEN_WORK_TRACKER.md docs/roadmap/PENDING_WORK.md
          git rm --ignore-unmatch -- .github/n40-central-apply.py .github/workflows/n40-central-apply-20261010.yml .github/workflows/n40-ci-provenance-20261010.yml
          git diff --cached --check
          git commit -m 'fix(N40): preserve central Cash and Checks alongside scoped Twin entry'
          git rev-parse HEAD > "$RUNNER_TEMP/n40-central/revision.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/n40-central/source.tar.gz"
          git diff --stat 4fdba151bc8e1e5fe23f21509f39a0921a3dfbc9 HEAD > "$RUNNER_TEMP/n40-central/final-diff-stat.txt"
          git fetch origin refs/heads/fix/n40-twin-navigation-20261010
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/fix/n40-twin-navigation-20261010
      - name: Preserve independent review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n40-central-entry-${{ github.run_id }}
          path: ${{ runner.temp }}/n40-central/
          retention-days: 3
          if-no-files-found: error
