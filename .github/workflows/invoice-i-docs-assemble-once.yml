name: Assemble invoice I documentation once
on:
  push:
    branches: [docs/invoice-header-i-result-20261105]
    paths: [.github/workflows/invoice-i-docs-assemble-once.yml]
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/docs/invoice-header-i-result-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          filter: blob:none
      - name: Verify one-use parent and exact branch lease
        run: |
          test "$(git rev-parse HEAD^)" = e7d65e2e040099a55010e5549b1896b52a144e15
          test "$(git ls-remote origin refs/heads/docs/invoice-header-i-result-20261105 | cut -f1)" = "$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF generator dependencies
        run: python -m pip install reportlab==4.4.9 pypdf==6.3.0
      - name: Apply verified documentation only, regenerate PDFs and remove this workflow
        shell: python
        run: |
          import base64,zlib,json,hashlib,subprocess
          from pathlib import Path
          payload=json.loads(zlib.decompress(base64.b64decode('')))
          for p,sha in payload['old'].items():
           assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==sha,p
          patch=zlib.decompress(base64.b64decode(payload['patch']))
          subprocess.run(['git','apply','--check','--whitespace=error','-'],input=patch,check=True)
          subprocess.run(['git','apply','--whitespace=error','-'],input=patch,check=True)
          for p,sha in payload['new'].items():
           assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==sha,p
          for p in ['CHECKPOINTS/KAT_ACTIVE_LIST_2026-09-05.md','docs/roadmap/OPEN_WORK_TRACKER.md','docs/roadmap/PENDING_WORK.md','docs/manual/invoices/PASS.md']:
           old=subprocess.check_output(['git','show','e7d65e2e040099a55010e5549b1896b52a144e15:'+p])
           assert Path(p).read_bytes().endswith(old),p
          subprocess.run(['python','docs/roadmap/generate-open-work-tracker.py'],check=True)
          import shutil
          shutil.copyfile('output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf','docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf')
          subprocess.run(['python','docs/roadmap/generate-numbered-work-checklist.py'],check=True)
          from pypdf import PdfReader
          tracker=PdfReader('output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf')
          assert 'I MEASURED' in tracker.pages[0].extract_text()
          numbered=PdfReader('docs/roadmap/MyWorkStation_Numbered_Checklist_2026-10-06.pdf')
          assert any('8,538' in p.extract_text() for p in numbered.pages)
          Path('.github/workflows/invoice-i-docs-assemble-once.yml').unlink()
          allowed=set(payload['paths']+['docs/roadmap/MyWorkStation_Numbered_Checklist_2026-10-06.pdf','docs/roadmap/MyWorkStation_Open_Work_2026-10-07.pdf','output/pdf/MyWorkStation_Open_Work_2026-10-07.pdf','.github/workflows/invoice-i-docs-assemble-once.yml'])
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==allowed,(changed,allowed)
          subprocess.run(['git','diff','--check','--',*payload['paths']],check=True)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','docs(invoice): publish measured I result with lossless registries and manuals'],check=True)
          subprocess.run(['git','push','origin','HEAD:docs/invoice-header-i-result-20261105'],check=True)
          print('Exact original registry suffixes and reviewed new Markdown verified; temporary assembly workflow removed.')
