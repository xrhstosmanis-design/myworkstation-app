plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
    namespace 'gr.myworkstation.chat'
    compileSdk 35
    defaultConfig {
        applicationId 'gr.myworkstation.chat'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-preview'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug { applicationIdSuffix '.preview' }
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }

// Messaging only: no Analytics, Firestore, Auth or private-content storage SDK.
dependencies { implementation platform('com.google.firebase:firebase-bom:35.0.2'); implementation 'com.google.firebase:firebase-messaging' }
